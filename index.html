<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Интерактивный тренажёр нотаций системного анализа: ERD, BPMN, UML, DFD. 22 модуля, 233 задачи, конструкторы схем.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%93%90</text></svg>">
</head>
<body>
<title>Тренажёр нотаций — ERD · BPMN · UML · DFD</title>
<style>
/* ============================================================
   ТОКЕНЫ
   ============================================================ */
:root{
  --paper:#E9EAE4; --sheet:#F7F8F4; --sheet-2:#FFFFFF; --sunk:#E2E4DC;
  --ink:#15181B; --ink-2:#4C5450; --ink-3:#7C847F;
  --line:#C9CCC3; --line-2:#A6ABA0;
  --accent:#1B4DA8; --accent-soft:#DCE5F6;
  --mark:#B06C08; --mark-soft:#F5E7CE;
  --ok:#1C6B48; --ok-soft:#DCEDE4;
  --no:#A62A20; --no-soft:#F5DFDC;
  --grid:rgba(27,77,168,.075);
  --case:#1B4DA8; --case-soft:#DCE5F6; --thread:#A8221B; --stamp:#A8221B;
  --shadow:0 1px 0 rgba(21,24,27,.04), 0 12px 28px -20px rgba(21,24,27,.5);
  --font-display:"Bahnschrift","DIN Alternate","Segoe UI Semibold",system-ui,sans-serif;
  --font-body:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --font-mono:"Cascadia Mono","Consolas",ui-monospace,SFMono-Regular,monospace;
  --r:4px;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#101315; --sheet:#171B1E; --sheet-2:#1C2125; --sunk:#13171A;
    --ink:#E9ECE7; --ink-2:#A3ACA6; --ink-3:#79837D;
    --line:#2B3237; --line-2:#3E464C;
    --accent:#84ABF6; --accent-soft:#1A2540; --mark:#DFA24C; --mark-soft:#2C2313;
    --ok:#63C89A; --ok-soft:#13291F; --no:#F0857B; --no-soft:#2C1614;
    --grid:rgba(132,171,246,.06);
  --case:#84ABF6; --case-soft:#1A2540; --thread:#E4736A; --stamp:#E4736A;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 14px 30px -22px #000;
  }
}
:root[data-theme="dark"]{
  --paper:#101315; --sheet:#171B1E; --sheet-2:#1C2125; --sunk:#13171A;
  --ink:#E9ECE7; --ink-2:#A3ACA6; --ink-3:#79837D;
  --line:#2B3237; --line-2:#3E464C;
  --accent:#84ABF6; --accent-soft:#1A2540; --mark:#DFA24C; --mark-soft:#2C2313;
  --ok:#63C89A; --ok-soft:#13291F; --no:#F0857B; --no-soft:#2C1614;
  --grid:rgba(132,171,246,.06);
  --case:#84ABF6; --case-soft:#1A2540; --thread:#E4736A; --stamp:#E4736A;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 14px 30px -22px #000;
}
:root[data-theme="light"]{
  --paper:#E9EAE4; --sheet:#F7F8F4; --sheet-2:#FFFFFF; --sunk:#E2E4DC;
  --ink:#15181B; --ink-2:#4C5450; --ink-3:#7C847F;
  --line:#C9CCC3; --line-2:#A6ABA0;
  --accent:#1B4DA8; --accent-soft:#DCE5F6; --mark:#B06C08; --mark-soft:#F5E7CE;
  --ok:#1C6B48; --ok-soft:#DCEDE4; --no:#A62A20; --no-soft:#F5DFDC;
  --grid:rgba(27,77,168,.075);
  --case:#1B4DA8; --case-soft:#DCE5F6; --thread:#A8221B; --stamp:#A8221B;
  --shadow:0 1px 0 rgba(21,24,27,.04), 0 12px 28px -20px rgba(21,24,27,.5);
}

/* ============================================================
   БАЗА
   ============================================================ */
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--font-body); font-size:16px; line-height:1.6;
  background-image:
    repeating-linear-gradient(to right, var(--grid) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(to bottom, var(--grid) 0 1px, transparent 1px 28px);
}
h1,h2,h3,h4{font-family:var(--font-display); font-variation-settings:"wght" 700,"wdth" 87.5;
  font-weight:700; margin:0; letter-spacing:.01em; text-wrap:balance; line-height:1.15}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}
.mono{font-family:var(--font-mono)}
.eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3)}

/* ============================================================
   КАРКАС
   ============================================================ */
.wrap{max-width:1220px; margin:0 auto; padding:0 22px 80px}
header.top{
  border-bottom:1px solid var(--line); background:color-mix(in srgb, var(--paper) 82%, transparent);
  backdrop-filter:blur(8px); position:sticky; top:0; z-index:20;
}
.top-in{max-width:1220px; margin:0 auto; padding:14px 22px; display:flex; align-items:center;
  gap:20px; flex-wrap:wrap}
.brand{display:flex; align-items:baseline; gap:12px; margin-right:auto}
.brand h1{font-size:clamp(19px,2.4vw,25px)}
.brand .sub{font-family:var(--font-mono); font-size:11px; color:var(--ink-3); letter-spacing:.1em}
.hud{display:flex; align-items:center; gap:14px}
.hud .num{font-family:var(--font-mono); font-size:13px; color:var(--ink-2); font-variant-numeric:tabular-nums}
.hud .num b{color:var(--ink); font-weight:600}
.bar{width:140px; height:6px; background:var(--sunk); border:1px solid var(--line); position:relative}
.bar i{position:absolute; inset:0 auto 0 0; background:var(--accent); display:block}
.ghost{background:transparent; border:1px solid var(--line-2); padding:6px 12px;
  font-family:var(--font-mono); font-size:12px; letter-spacing:.04em; border-radius:var(--r)}
.ghost:hover{border-color:var(--ink-2); background:var(--sheet)}

.shell{display:grid; grid-template-columns:270px minmax(0,1fr); gap:30px; padding-top:26px}
@media(max-width:940px){ .shell{grid-template-columns:1fr; gap:18px} }

/* рейка */
.rail{align-self:start; position:sticky; top:82px; display:flex; flex-direction:column; gap:3px}
@media(max-width:940px){
  .rail{position:static; flex-direction:row; overflow-x:auto; padding-bottom:6px; gap:8px}
  .rail .rail-h{display:none}
}
.rail-h{font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); padding:0 0 8px 2px}
.mod{display:grid; grid-template-columns:26px 1fr; gap:10px; align-items:start;
  padding:9px 10px; border:1px solid transparent; background:transparent; text-align:left;
  border-radius:var(--r); width:100%}
@media(max-width:940px){ .mod{width:auto; min-width:190px; flex:0 0 auto; background:var(--sheet); border-color:var(--line)} }
.mod:hover{background:var(--sheet); border-color:var(--line)}
.mod[aria-current="true"]{background:var(--sheet-2); border-color:var(--line-2); box-shadow:var(--shadow)}
.mod .n{font-family:var(--font-mono); font-size:12px; color:var(--ink-3); padding-top:2px}
.mod[aria-current="true"] .n{color:var(--accent)}
.mod .t{font-size:14px; line-height:1.3; font-weight:600}
.mod .m{font-family:var(--font-mono); font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.mod .pb{height:3px; background:var(--sunk); margin-top:6px; position:relative}
.mod .pb i{position:absolute; left:0; top:0; bottom:0; background:var(--ok)}
.mod.exam .t{color:var(--mark)}

/* лист */
.sheet{background:var(--sheet); border:1px solid var(--line); box-shadow:var(--shadow);
  border-radius:var(--r); position:relative}
.sheet::after{content:""; position:absolute; top:-1px; right:-1px; width:16px; height:16px;
  border-top:1px solid var(--line-2); border-right:1px solid var(--line-2)}
.sheet-head{padding:22px 26px 0}
.sheet-head h2{font-size:clamp(22px,3vw,30px); margin-bottom:6px}
.sheet-head .lead{color:var(--ink-2); font-size:15px; max-width:64ch}

/* дело: штамп, кодовое имя, эмблема, завязка */
.sheet{--case:var(--case-l); --case-soft:color-mix(in srgb, var(--case) 13%, var(--sheet))}
@media (prefers-color-scheme: dark){ .sheet{--case:var(--case-d)} }
:root[data-theme="dark"] .sheet{--case:var(--case-d)}
:root[data-theme="light"] .sheet{--case:var(--case-l)}
.mod{--case:var(--case-l)}
@media (prefers-color-scheme: dark){ .mod{--case:var(--case-d)} }
:root[data-theme="dark"] .mod{--case:var(--case-d)}
:root[data-theme="light"] .mod{--case:var(--case-l)}
.sheet{border-top:3px solid var(--case)}
.casebar{display:flex; align-items:center; gap:12px; margin-bottom:12px}
.stamp{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--stamp); border:1.5px solid var(--stamp); border-radius:2px; padding:4px 9px;
  transform:rotate(-1.5deg); opacity:.9}
.codename{font-family:var(--font-display); font-variation-settings:"wght" 600,"wdth" 87.5;
  font-size:15px; color:var(--case)}
svg.emb{margin-left:auto; flex:0 0 auto; fill:none; stroke:var(--case); stroke-width:1.5;
  stroke-linecap:round; stroke-linejoin:round; opacity:.9}
.hook{font-size:15.5px; line-height:1.55; color:var(--ink-2); max-width:62ch; margin-bottom:10px;
  padding-left:14px; border-left:2px solid var(--case)}
.mod[aria-current="true"] .n{color:var(--case)}
.mod[aria-current="true"]{border-left:2px solid var(--case)}
.mod .pb i{background:var(--case)}

/* доска улик: красная нить между фигурами */
.canvas{background:var(--sunk); border-color:var(--line-2)}
.canvas .arrow{background:var(--thread)}
.canvas .arrow::after{border-left-color:var(--thread)}
.canvas .node.slot{border-color:var(--case); background:var(--case-soft)}
.canvas .node.slot .knd{color:var(--case)}
.node .knd{color:var(--case)}
.fig .arrow{background:var(--thread)}
.fig .arrow::after{border-left-color:var(--thread)}
.tabs{display:flex; gap:0; margin-top:18px; border-bottom:1px solid var(--line)}
.tab{background:none; border:none; border-bottom:2px solid transparent; padding:9px 2px; margin-right:22px;
  font-family:var(--font-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
.body{padding:24px 26px 30px}
@media(max-width:560px){ .sheet-head{padding:18px 16px 0} .body{padding:20px 16px 26px} }

/* ============================================================
   ТЕОРИЯ
   ============================================================ */
.purpose{border:1px solid var(--line); border-top:3px solid var(--mark); background:var(--sheet-2);
  padding:16px 20px 18px; margin-bottom:26px; max-width:74ch; border-radius:var(--r)}
.purpose .plead{font-family:var(--font-display); font-variation-settings:"wght" 700,"wdth" 87.5;
  font-size:18px; line-height:1.3; margin:6px 0 14px; text-wrap:balance}
.pgrid{display:grid; grid-template-columns:minmax(110px,auto) 1fr; gap:2px 18px; margin:0}
.pgrid dt{font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--mark); padding:7px 0 7px; border-top:1px solid var(--line)}
.pgrid dd{margin:0; padding:7px 0; color:var(--ink-2); font-size:14.5px; border-top:1px solid var(--line)}
@media(max-width:560px){ .pgrid{grid-template-columns:1fr; gap:0} .pgrid dd{border-top:none; padding-top:0} }
.theory{display:flex; flex-direction:column; gap:18px; max-width:74ch}
.theory h3{font-size:19px; margin-top:8px}
.theory h3::before{content:"— "; color:var(--accent)}
.theory p{color:var(--ink-2)}
.theory strong{color:var(--ink); font-weight:600}
.theory ul{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px; color:var(--ink-2)}
.theory li::marker{color:var(--accent)}
.dl{display:grid; grid-template-columns:minmax(120px,auto) 1fr; gap:2px 18px; border-top:1px solid var(--line)}
.dl dt{font-weight:600; padding:9px 0 9px; border-bottom:1px solid var(--line)}
.dl dd{margin:0; padding:9px 0; color:var(--ink-2); border-bottom:1px solid var(--line)}
@media(max-width:560px){ .dl{grid-template-columns:1fr; gap:0} .dl dt{border:none; padding-bottom:0} }
pre.code{background:var(--sunk); border:1px solid var(--line); border-left:2px solid var(--accent);
  padding:14px 16px; overflow-x:auto; font-family:var(--font-mono); font-size:13px; line-height:1.65;
  color:var(--ink); margin:0}
.note{border-left:2px solid var(--mark); background:var(--mark-soft); padding:12px 16px; color:var(--ink-2); font-size:15px}
.note b{color:var(--ink)}
.tblwrap{overflow-x:auto; border:1px solid var(--line)}
table{border-collapse:collapse; width:100%; font-size:14px; min-width:440px}
th{text-align:left; font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; padding:10px 14px; background:var(--sunk); border-bottom:1px solid var(--line)}
td{padding:10px 14px; border-bottom:1px solid var(--line); color:var(--ink-2); vertical-align:top}
tr:last-child td{border-bottom:none}
td:first-child{color:var(--ink); font-weight:600; white-space:nowrap}
.glyph{font-family:var(--font-mono); font-size:15px; color:var(--accent)}

/* ============================================================
   ПРАКТИКА
   ============================================================ */
.runner{max-width:78ch}
.run-head{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:18px}
.chip{font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; border:1px solid var(--line-2);
  padding:3px 8px; color:var(--ink-2); border-radius:2px}
.chip.kind{border-color:var(--accent); color:var(--accent)}
.dots{display:flex; gap:3px; margin-left:auto; flex-wrap:wrap}
.dots i{width:9px; height:9px; border:1px solid var(--line-2); display:block}
.dots i.ok{background:var(--ok); border-color:var(--ok)}
.dots i.no{background:var(--no); border-color:var(--no)}
.dots i.now{border-color:var(--ink); box-shadow:inset 0 0 0 2px var(--sheet)}
.q{font-size:19px; font-weight:600; line-height:1.4; margin-bottom:6px; text-wrap:balance}
.qsub{color:var(--ink-3); font-size:14px; margin-bottom:16px}
.opts{display:flex; flex-direction:column; gap:8px; margin-bottom:20px}
.opt{display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border:1px solid var(--line);
  background:var(--sheet-2); border-radius:var(--r); cursor:pointer; transition:border-color .12s, background .12s}
.opt:hover{border-color:var(--line-2)}
.opt input{margin:4px 0 0; accent-color:var(--accent); flex:0 0 auto}
.opt .txt{flex:1}
.opt.sel{border-color:var(--accent); background:var(--accent-soft)}
.opt.good{border-color:var(--ok); background:var(--ok-soft)}
.opt.bad{border-color:var(--no); background:var(--no-soft)}
.opt.locked{cursor:default}
.opt .tag{font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; margin-left:auto; white-space:nowrap}
.opt.good .tag{color:var(--ok)} .opt.bad .tag{color:var(--no)}

.rows{display:flex; flex-direction:column; gap:8px; margin-bottom:20px}
.row{display:flex; gap:12px; align-items:center; padding:10px 14px; border:1px solid var(--line);
  background:var(--sheet-2); border-radius:var(--r)}
.row .txt{flex:1}
.row select{font:inherit; font-size:14px; padding:6px 8px; background:var(--sheet); color:var(--ink);
  border:1px solid var(--line-2); border-radius:2px; max-width:52%}
.row.good{border-color:var(--ok); background:var(--ok-soft)}
.row.bad{border-color:var(--no); background:var(--no-soft)}
.row .idx{font-family:var(--font-mono); font-size:12px; color:var(--ink-3); width:20px; text-align:right}
.row .mv{display:flex; gap:4px}
.mvb{width:28px; height:28px; border:1px solid var(--line-2); background:var(--sheet); border-radius:2px;
  line-height:1; font-size:13px; display:grid; place-items:center}
.mvb:hover{border-color:var(--ink-2)}
.mvb:disabled{opacity:.3; cursor:default}
.fixhint{font-family:var(--font-mono); font-size:12px; color:var(--no)}

input.fill{font:inherit; font-family:var(--font-mono); font-size:15px; padding:11px 13px; width:100%;
  max-width:380px; background:var(--sheet-2); color:var(--ink); border:1px solid var(--line-2);
  border-radius:var(--r); margin-bottom:20px; display:block}
input.fill.good{border-color:var(--ok); background:var(--ok-soft)}
input.fill.bad{border-color:var(--no); background:var(--no-soft)}

.fb{border:1px solid var(--line); border-left-width:3px; padding:14px 16px; margin-bottom:18px;
  background:var(--sheet-2); border-radius:var(--r); animation:in .18s ease-out}
.fb.good{border-color:var(--ok); background:var(--ok-soft)}
.fb.bad{border-color:var(--no); background:var(--no-soft)}
.fb .v{font-family:var(--font-display); font-variation-settings:"wght" 700,"wdth" 87.5;
  font-size:15px; letter-spacing:.02em; margin-bottom:5px}
.fb.good .v{color:var(--ok)} .fb.bad .v{color:var(--no)}
.fb .why{font-size:15px; color:var(--ink-2)}
.fb .why b{color:var(--ink)}
@keyframes in{from{opacity:0; transform:translateY(-4px)} to{opacity:1; transform:none}}
@media(prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }

.actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.btn{background:var(--accent); color:var(--sheet); border:1px solid var(--accent); padding:10px 20px;
  font-family:var(--font-display); font-variation-settings:"wght" 600,"wdth" 87.5; font-size:15px;
  letter-spacing:.02em; border-radius:var(--r)}
@media (prefers-color-scheme: dark){ .btn{color:#0E1114} }
:root[data-theme="dark"] .btn{color:#0E1114}
:root[data-theme="light"] .btn{color:#F7F8F4}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:transparent; color:var(--ink); border-color:var(--line-2)}
.btn.sec:hover{border-color:var(--ink-2); background:var(--sheet-2); filter:none}
.hintmsg{font-size:13px; color:var(--no); font-family:var(--font-mono)}

/* итог */
.result{text-align:left; max-width:60ch}
.score{font-family:var(--font-display); font-variation-settings:"wght" 700,"wdth" 75;
  font-size:clamp(52px,10vw,86px); line-height:1; color:var(--accent); font-variant-numeric:tabular-nums}
.score span{font-size:.42em; color:var(--ink-3)}
.verdict{font-size:17px; color:var(--ink-2); margin:12px 0 22px; max-width:52ch}
.misslist{display:flex; flex-direction:column; gap:0; border-top:1px solid var(--line); margin:0 0 24px}
.miss{padding:10px 0; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline}
.miss .id{font-family:var(--font-mono); font-size:11px; color:var(--no); flex:0 0 auto}
.miss .qq{font-size:14px; color:var(--ink-2)}

/* ============================================================
   ВИЗУАЛЬНЫЙ СЛОЙ: ЛЕГЕНДЫ, ПРИМЕРЫ СХЕМ, ВИДЖЕТЫ
   ============================================================ */
.gal{display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:8px; margin:0}
.gi{display:flex; flex-direction:column; align-items:center; gap:7px; padding:13px 8px 11px;
  border:1px solid var(--line); background:var(--sheet-2); border-radius:var(--r); text-align:center;
  transition:border-color .12s, transform .12s}
.gi:hover{border-color:var(--case); transform:translateY(-1px)}
.gi[aria-expanded="true"]{border-color:var(--case); background:var(--case-soft)}
.gi .nm{font-size:12px; line-height:1.25; color:var(--ink-2)}
.gi[aria-expanded="true"] .nm{color:var(--ink); font-weight:600}
.galnote{grid-column:1/-1; border-left:2px solid var(--case); background:var(--case-soft);
  padding:11px 14px; font-size:14px; color:var(--ink-2); animation:in .16s ease-out}
.galnote b{color:var(--ink)}

.fig{border:1px solid var(--line); background:var(--sunk); padding:16px 14px 12px; border-radius:var(--r);
  overflow-x:auto}
.fig .figcap{font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); margin-bottom:12px}
.figrow{display:flex; align-items:stretch; gap:4px; min-width:min-content}
.fignode{width:108px; flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:5px;
  padding:8px 6px; background:var(--sheet-2); border:1px solid var(--line); border-radius:var(--r)}
.fignode .fc{font-size:11px; line-height:1.25; text-align:center; color:var(--ink-2)}
.fignode.hl{border-color:var(--case); background:var(--case-soft)}

.wdg{border:1px solid var(--line); border-top:3px solid var(--case); background:var(--sheet-2);
  border-radius:var(--r); padding:16px 18px 18px}
.wdg h4{font-size:15px; margin-bottom:4px}
.wdg .whint{font-size:13px; color:var(--ink-3); margin-bottom:14px}
.ctrls{display:flex; flex-wrap:wrap; gap:16px; margin-bottom:16px}
.ctrl{display:flex; flex-direction:column; gap:6px}
.ctrl .cl{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-3)}
.seg{display:flex; border:1px solid var(--line-2); border-radius:var(--r); overflow:hidden}
.seg button{background:var(--sheet); border:none; padding:6px 13px; font-family:var(--font-mono);
  font-size:13px; color:var(--ink-2); border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--case); color:var(--sheet)}
:root[data-theme="dark"] .seg button[aria-pressed="true"], .seg button[aria-pressed="true"]{color:var(--paper)}
.wout{border-top:1px solid var(--line); padding-top:14px; display:flex; flex-direction:column; gap:10px}
.wread{font-size:15px; line-height:1.5}
.wread b{color:var(--case)}
.wcode{font-family:var(--font-mono); font-size:12.5px; background:var(--sunk); border:1px solid var(--line);
  padding:9px 12px; border-radius:2px; color:var(--ink-2); white-space:pre-wrap}
svg.link{display:block; max-width:100%; height:auto}
svg.link .ln{stroke:var(--ink-2); stroke-width:1.6; fill:none}
svg.link .th{stroke:var(--thread); stroke-width:2; fill:none}
svg.link .bx{fill:var(--sheet-2); stroke:var(--ink-2); stroke-width:1.4}
svg.link text{fill:var(--ink); font-family:var(--font-mono); font-size:12px}
svg.link text.lbl{fill:var(--case); font-size:13px}
svg.link text.sm{fill:var(--ink-3); font-size:10.5px}

/* класс-бокс */
.cbox{border:1.5px solid var(--ink-2); background:var(--sheet-2); max-width:420px; font-family:var(--font-mono);
  font-size:13px; border-radius:2px; overflow:hidden}
.cbox .zone{padding:9px 12px; border-bottom:1px solid var(--line); cursor:pointer; transition:background .12s}
.cbox .zone:last-child{border-bottom:none}
.cbox .zone:hover{background:var(--sunk)}
.cbox .zone[aria-pressed="true"]{background:var(--case-soft); box-shadow:inset 3px 0 0 var(--case)}
.cbox .cn{text-align:center; font-weight:700; font-size:14px}
.cbox .ln{display:block; line-height:1.65}
.vis{color:var(--case); font-weight:700}

/* доска статусов */
.stat{display:flex; flex-wrap:wrap; gap:8px}
.stbtn{border:1px solid var(--line-2); background:var(--sheet); padding:8px 14px; border-radius:20px;
  font-size:13.5px}
.stbtn[aria-pressed="true"]{border-color:var(--case); background:var(--case-soft); color:var(--ink); font-weight:600}
.trans{display:flex; flex-direction:column; gap:6px}
.tr{display:flex; gap:10px; align-items:baseline; font-size:14px; padding:7px 0; border-bottom:1px solid var(--line)}
.tr .ev{font-family:var(--font-mono); font-size:12px; color:var(--ink-2); min-width:120px}
.tr .to{font-weight:600}
.tr.no .to{color:var(--no); font-weight:400}
.tr.yes .to{color:var(--ok)}

/* ============================================================
   КОНСТРУКТОР BPMN
   ============================================================ */
.case{border:1px solid var(--line); border-left:3px solid var(--mark); background:var(--sheet-2);
  padding:14px 16px; margin-bottom:18px}
.case .eyebrow{margin-bottom:6px}
.case p{color:var(--ink-2); font-size:15px}
.canvas{border:1px dashed var(--line-2); background:var(--sunk); padding:14px;
  display:flex; flex-wrap:wrap; align-items:stretch; gap:4px; margin-bottom:18px; min-height:104px}
.node{width:124px; display:flex; flex-direction:column; align-items:center; gap:5px; padding:9px 7px;
  background:var(--sheet-2); border:1px solid var(--line); border-radius:var(--r); animation:pop .18s ease-out}
@keyframes pop{from{opacity:0; transform:scale(.94)} to{opacity:1; transform:none}}
.node .cap{font-size:11.5px; line-height:1.28; text-align:center; color:var(--ink-2)}
.node .knd{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--accent); text-align:center}
.node.slot{border-style:dashed; border-color:var(--accent); background:var(--accent-soft);
  justify-content:center; animation:none}
.node.slot .cap{color:var(--ink); font-weight:600}
.arrow{align-self:center; width:22px; height:2px; background:var(--ink-3); position:relative; flex:0 0 auto}
.arrow::after{content:""; position:absolute; right:-1px; top:-3px; border:4px solid transparent;
  border-left-color:var(--ink-3); border-right:none}
.canvas .empty{color:var(--ink-3); font-size:14px; align-self:center; font-family:var(--font-mono)}
svg.g{display:block}
svg.g *{stroke:var(--ink); fill:none; stroke-width:1.7; vector-effect:non-scaling-stroke}
svg.g .fill{fill:var(--ink); stroke:none}
svg.g .thick{stroke-width:3.4}
svg.g text{fill:var(--ink); stroke:none; font-family:var(--font-mono); font-size:11px}
.ask{font-size:15px; margin-bottom:12px}
.ask b{font-weight:600}
.pal{display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:7px; margin-bottom:16px}
.pi{display:flex; align-items:center; gap:9px; padding:7px 9px; border:1px solid var(--line);
  background:var(--sheet-2); border-radius:var(--r); text-align:left; font-size:12.5px; line-height:1.25}
.pi:hover{border-color:var(--accent); background:var(--accent-soft)}
.pi.bad{border-color:var(--no); background:var(--no-soft); animation:shake .32s}
.pi.off{opacity:.42; pointer-events:none}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.tip{border-left:2px solid var(--mark); background:var(--mark-soft); padding:11px 14px; font-size:14px;
  color:var(--ink-2); margin-bottom:16px; animation:in .18s ease-out}
.tip b{color:var(--ink)}
.stepline{display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-bottom:10px}
.stepline .n{font-family:var(--font-mono); font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums}

/* песочница ERD */
.erd{display:grid; grid-template-columns:minmax(0,1fr) minmax(240px,300px); gap:20px; align-items:start}
@media(max-width:820px){ .erd{grid-template-columns:1fr} }
.erd-code{background:var(--sunk); border:1px solid var(--line); border-left:2px solid var(--accent);
  padding:12px 14px; font-family:var(--font-mono); font-size:12px; line-height:1.6; overflow-x:auto;
  position:sticky; top:88px; white-space:pre; color:var(--ink)}
.erd-code .ph{color:var(--ink-3)}
.erd-code .rf{color:var(--accent)}
.qa{display:flex; flex-direction:column; gap:7px; margin-bottom:16px}
.qa label{font-size:14px; color:var(--ink-2)}
.qa select{font:inherit; font-size:14px; padding:9px 10px; background:var(--sheet-2); color:var(--ink);
  border:1px solid var(--line-2); border-radius:var(--r); width:100%; max-width:460px}
.qa select.good{border-color:var(--ok); background:var(--ok-soft)}
.qa select.bad{border-color:var(--no); background:var(--no-soft)}
.pairhead{font-family:var(--font-display); font-variation-settings:"wght" 700,"wdth" 87.5;
  font-size:17px; margin-bottom:4px}
.pairhead em{font-style:normal; color:var(--accent)}
</style>

      <h1>Бюро расследований систем</h1>

    <nav class="rail" id="rail"><div class="rail-h">Программа</div></nav>
    <main id="stage"></main>
  </div>

<script>
/* ============================================================
   ДАННЫЕ КУРСА
   ============================================================ */
const T = {
  h:(v)=>({t:'h',v}), p:(v)=>({t:'p',v}), ul:(v)=>({t:'ul',v}),
  dl:(v)=>({t:'dl',v}), code:(v)=>({t:'code',v}), note:(v)=>({t:'note',v}),
  table:(head,rows)=>({t:'table',head,rows}),
  gal:(v)=>({t:'gal',v}),                       /* легенда фигур: [ключ, подпись, пояснение] */
  fig:(cap,v,arrows)=>({t:'fig',cap,v,arrows}), /* отрисованный пример схемы */
  wdg:(v)=>({t:'wdg',v})                        /* интерактивный виджет */
};

const MODULES = [];

/* ---------- 1. ERD ---------- */
MODULES.push({
  id:'erd', title:'ERD: сущности и связи',
  lead:'Диаграмма «сущность-связь» описывает, из каких объектов состоят данные, какие у них признаки и как объекты связаны между собой.',
  theory:[
    T.h('Зачем нужна ERD'),
    T.p('ERD (Entity Relationship Diagram) — схема структуры базы данных. Аналитик рисует её, чтобы договориться с разработчиком: какие таблицы завести, какие поля в них хранить и как таблицы ссылаются друг на друга. По ERD видно, где данные дублируются, а где их не хватает.'),

    T.h('Сущность'),
    T.p('<strong>Сущность</strong> — объект, о котором можно хранить данные. Это физический объект (автомобиль, человек), концепт (адрес) или событие (регистрация студента на курс).'),
    T.dl([
      ['Сильная сущность','Имеет собственный идентификатор (первичный ключ) и существует сама по себе, независимо от других. Пример: студент, товар, пользователь.'],
      ['Слабая сущность','Не может существовать без сильной и содержит внешний ключ на неё. Пример: регистрация студента на курс — без студента и курса записи не существует.']
    ]),
    T.note('Простая проверка: если удалить «родителя» и запись потеряет смысл — сущность слабая.'),

    T.h('Атрибуты'),
    T.p('<strong>Атрибут</strong> — характеристика сущности. На схеме атрибуты изображают овалами или строками внутри прямоугольника-таблицы.'),
    T.dl([
      ['Простой','Нельзя разделить на части: имя, номер телефона.'],
      ['Составной','Делится на несколько: полное имя = фамилия + имя + отчество; адрес = город + улица + дом.'],
      ['Вычисляемый','Получается из других данных: возраст — из даты рождения, сумма заказа — из позиций.']
    ]),

    T.h('Виды связей'),
    T.table(['Связь','Смысл','Пример'],[
      ['Один к одному (1:1)','Одной записи соответствует ровно одна запись','Пользователь — паспорт'],
      ['Один ко многим (1:N)','Одна запись связана с несколькими','Клиент — его заказы'],
      ['Многие ко многим (N:M)','Много записей связаны со многими','Преподаватель — предмет']
    ]),
    T.p('Связь N:M напрямую в базе не реализуется: создаётся <strong>промежуточная (связующая) таблица</strong> с двумя внешними ключами — например, «Преподаватель_Предмет» с полями «Код преподавателя (FK)» и «Код предмета (FK)».'),

    T.h('Синтаксис dbdiagram.io'),
    T.p('Слева редактор кода, справа автоматически строится схема. Таблица описывается так:'),
    T.code('Table User {\n  id int [pk]\n  name varchar\n  email varchar\n}\n\nTable Order {\n  id int [pk]\n  user_id int\n  goods_id int\n  sum int\n}\n\nRef: User.id > Order.user_id'),
    T.p('В строке <strong>Ref</strong> указывают, какой атрибут одной сущности связан с атрибутом другой. Пометка <strong>[pk]</strong> помечает первичный ключ, после имени атрибута указывают тип данных (int, varchar, text, timestamp).')
  ],
  tasks:[
    {id:'ERD-01', type:'choice', q:'Что описывает ERD-диаграмма?',
      opts:['Структуру данных: сущности, их атрибуты и связи между ними',
            'Последовательность действий сотрудников во времени',
            'Обмен сообщениями между модулями системы',
            'Зоны ответственности участников бизнес-процесса'],
      a:0, why:'ERD — модель данных. Порядок действий описывают BPMN и диаграмма активностей, обмен сообщениями — диаграмма последовательности.'},

    {id:'ERD-02', type:'choice', q:'Какая сущность считается сильной?',
      opts:['Та, у которой больше всего атрибутов',
            'Та, у которой есть первичный ключ и которая не зависит от других сущностей',
            'Та, на которую ссылается наибольшее число внешних ключей',
            'Та, которая описывает событие, а не объект'],
      a:1, why:'Сильная сущность имеет собственный идентификатор и существует самостоятельно. Количество атрибутов и ссылок роли не играет.'},

    {id:'ERD-03', type:'choice', q:'«Регистрация студента на курс» — это пример какой сущности?',
      opts:['Сильной, потому что у записи есть свой id',
            'Слабой: без студента и курса запись не существует, у неё есть внешние ключи',
            'Это не сущность, а связь и отдельной таблицей не описывается',
            'Это атрибут сущности «Студент»'],
      a:1, why:'Регистрация зависит от студента и курса — классическая слабая сущность. Технически она же является связующей таблицей для отношения многие-ко-многим.'},

    {id:'ERD-04', type:'assign', q:'Распределите атрибуты по видам.',
      buckets:['Простой','Составной','Вычисляемый'],
      items:[
        {text:'Электронная почта пользователя', a:'Простой'},
        {text:'ФИО (фамилия + имя + отчество)', a:'Составной'},
        {text:'Возраст, полученный из даты рождения', a:'Вычисляемый'},
        {text:'Адрес доставки (город, улица, дом, квартира)', a:'Составной'},
        {text:'Итоговая сумма заказа как сумма позиций', a:'Вычисляемый'},
        {text:'Серия паспорта', a:'Простой'}
      ],
      why:'Составной атрибут можно разложить на самостоятельные части, вычисляемый выводится из других данных и обычно не хранится, а рассчитывается.'},

    {id:'ERD-05', type:'choice', q:'У каждого пользователя ровно один паспорт, и каждый паспорт принадлежит ровно одному пользователю. Какая это связь?',
      opts:['Один к одному','Один ко многим','Многие ко многим','Связи нет'],
      a:0, why:'«Ровно один с обеих сторон» — это 1:1. Внешний ключ ставится в одну из таблиц, например поле user в таблице passport.'},

    {id:'ERD-06', type:'choice', q:'В таблице orders есть поле customer_id, ссылающееся на customers.customer_id. Какая это связь?',
      opts:['Один к одному','Один ко многим: у клиента может быть несколько заказов','Многие ко многим','Слабая связь без кардинальности'],
      a:1, why:'Внешний ключ на стороне «многих» — типичная реализация 1:N. Один клиент — много заказов, но у заказа один клиент.'},

    {id:'ERD-07', type:'choice', q:'Преподаватель ведёт несколько предметов, и один предмет ведут несколько преподавателей. Что нужно сделать на схеме?',
      opts:['Поставить внешний ключ в таблицу «Преподаватель»',
            'Поставить внешний ключ в таблицу «Предмет»',
            'Создать промежуточную таблицу с двумя внешними ключами',
            'Объединить обе сущности в одну таблицу'],
      a:2, why:'Отношение многие-ко-многим в реляционной базе реализуется связующей таблицей: «Преподава_Предмет» с полями «Код преподавателя (FK)» и «Код предмета (FK)».'},

    {id:'ERD-08', type:'fill', q:'Какую пометку в квадратных скобках ставят в dbdiagram.io, чтобы обозначить первичный ключ?',
      sub:'Ответ — одно слово латиницей, без скобок.', a:['pk','[pk]','primary key'],
      why:'Строка вида «id int [pk]» задаёт первичный ключ. Скобки в ответе не обязательны.'},

    {id:'ERD-09', type:'choice', q:'Какая строка корректно задаёт связь между User и Order в dbdiagram.io?',
      opts:['Link User.id to Order.user_id','Ref: User.id > Order.user_id',
            'Relation(User, Order)','User.id -> Order.user_id [ref]'],
      a:1, why:'Синтаксис: Ref: &lt;сущность_1&gt;.&lt;атрибут_1&gt; &gt; &lt;сущность_2&gt;.&lt;атрибут_2&gt;.'},

    {id:'ERD-10', type:'multi', q:'Что верно про слабую сущность? Выберите все подходящие утверждения.',
      opts:['Зависит от сильной сущности','Содержит внешний ключ на другую сущность',
            'Никогда не имеет собственных атрибутов','Часто описывает событие или факт связи',
            'Не может быть удалена из модели данных'],
      a:[0,1,3], why:'Слабая сущность зависима и хранит внешний ключ; собственные атрибуты у неё быть могут (например, дата регистрации).'},

    {id:'ERD-11', type:'order', q:'Расставьте шаги построения ERD в dbdiagram.io по порядку.',
      items:['Определить, какие сущности нужны предметной области',
             'Описать каждую сущность через Table с атрибутами и типами данных',
             'Пометить первичные ключи [pk]',
             'Определить кардинальность связей между сущностями',
             'Записать связи через Ref и проверить схему справа'],
      why:'Сначала выделяем объекты, затем описываем их поля, помечаем ключи и только потом связываем.'},

    {id:'ERD-12', type:'choice', q:'В таблице posts есть поля id, title, body, user_id, status, created_at. Какое поле указывает на связь с другой сущностью?',
      opts:['id','status','user_id','created_at'],
      a:2, why:'Внешний ключ обычно называется по образцу «имя_сущности_id» и ссылается на первичный ключ родительской таблицы — здесь users.id.'},

    {id:'ERD-13', type:'multi', q:'Какие из объектов можно описать как сущность в ERD?',
      opts:['Автомобиль','Адрес','Регистрация студента на курс','Цвет шрифта в интерфейсе','Заказ'],
      a:[0,1,2,4], why:'Сущность — это физический объект, концепт или событие, о котором мы храним данные. Оформление интерфейса к модели данных не относится.'}
  ]
});

/* ---------- 2. BPMN: пулы, дорожки, задачи ---------- */
MODULES.push({
  id:'bpmn-base', title:'BPMN: пулы, дорожки, задачи',
  lead:'BPMN описывает бизнес-процесс так, чтобы было видно, кто и что делает, и в какой момент работа переходит от одного участника к другому.',
  theory:[
    T.h('Что такое BPMN'),
    T.p('BPMN — нотация моделирования бизнес-процессов. Её ключевая особенность: на схеме чётко разделены зоны ответственности участников и видно, в какой момент действие переходит от одного участника к другому. Рисовать можно в bpmn.io или draw.io.'),

  const s=document.createElementNS('http://www.w3.org/2000/svg','svg');

  s.setAttribute('width',w); s.setAttribute('height',w);
  s.innerHTML=EMBLEM[kind]||EMBLEM.badge;
  return s;
}

function glyph(kind, w){
  const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('class','g'); s.setAttribute('viewBox','0 0 48 40');
  s.setAttribute('width',w); s.setAttribute('height',Math.round(w*40/48));
  s.innerHTML=GLYPH[kind]||SVG.task;
  return s;
}

const sizeOf = m => m.exam ? m.size : m.tasks.length;
const mastered = id => store.res[id]===true;

function el(tag, props, ...kids){
  const n=document.createElement(tag);
  if(props) for(const k in props){
    if(k==='class') n.className=props[k];
    else if(k==='html') n.innerHTML=props[k];
    else if(k.startsWith('on')) n.addEventListener(k.slice(2), props[k]);
    else if(props[k]!==null && props[k]!==false) n.setAttribute(k, props[k]);
  }
  kids.flat().forEach(c=>{ if(c==null||c===false) return;
    n.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return n;
}
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const norm = s => s.toLowerCase().trim().replace(/ё/g,'е').replace(/[«»"'.,;:()\[\]]/g,'').replace(/\s+/g,' ');

/* ---- шапка ---- */
function paintHud(){
  const all=allTasks(), n=all.filter(t=>mastered(t.id)).length;
  document.getElementById('hud-n').textContent=n;
  document.getElementById('hud-t').textContent=all.length;
  document.getElementById('hud-bar').style.width=(all.length? n/all.length*100:0)+'%';
}

/* ---- рейка ---- */
let current = MODULES[0].id;
function paintRail(){
  const rail=document.getElementById('rail');
  rail.querySelectorAll('.mod').forEach(n=>n.remove());
  MODULES.forEach((m,i)=>{
    const done=m.exam ? (store.exam||0) : m.tasks.filter(t=>mastered(t.id)).length;
    const total=sizeOf(m);
    const pct=m.exam ? done : (total? done/total*100 : 0);
    rail.appendChild(el('button',{class:'mod'+(m.exam?' exam':''), 'aria-current': current===m.id?'true':'false',
      style:m.hue||'',
      onclick:()=>{ current=m.id; tab='theory'; run=null; render(); window.scrollTo({top:0,behavior:'smooth'}); }},
      el('span',{class:'n'}, m.exam?'★':String(i+1).padStart(2,'0')),
      el('span',{},
        el('span',{class:'t'}, m.title),
        el('span',{class:'m'}, m.exam ? (store.exam?('лучший результат '+store.exam+'%'):'билет из '+total+' улик')
                                      : 'раскрыто '+done+'/'+total),
        el('span',{class:'pb'}, el('i',{style:'width:'+pct+'%'}))
      )
    ));
  });
}

/* 1. кардинальность: собери связь и прочитай её */
WIDGET.cardinality=()=>{
  const st={aMin:'1',aMax:'1',bMin:'0',bMax:'*'};
  const box=el('div',{class:'wdg'});
  const out=el('div',{class:'wout'});
  const seg=(key,vals,labels)=>{
    const s=el('div',{class:'seg'});
    vals.forEach((v,i)=>{
      const b=el('button',{'aria-pressed':st[key]===v?'true':'false', onclick:()=>{
        st[key]=v; s.querySelectorAll('button').forEach(n=>n.setAttribute('aria-pressed','false'));
        b.setAttribute('aria-pressed','true'); draw();
      }}, labels[i]);
      s.appendChild(b);
    });
    return s;
  };
  const card=(min,max)=> min==='0'&&max==='1' ? '0..1' : min==='1'&&max==='1' ? '1'
    : min==='0' ? '0..*' : '1..*';
  const foot=(x,dir,min,max)=>{ /* значки вороньей лапки */
    const d=dir, g=[];
    g.push('<path class="ln" d="M'+(x+d*10)+' 32 v-14"/>');                       /* черта «один» */
    if(max==='*'){ g.push('<path class="ln" d="M'+x+' 25 l'+(d*13)+' -7 M'+x+' 25 l'+(d*13)+' 0 M'+x+' 25 l'+(d*13)+' 7"/>'); }
    if(min==='0'){ g.push('<circle class="ln" cx="'+(x+d*20)+'" cy="25" r="4.5"/>'); }
    return g.join('');
  };
  const draw=()=>{
    out.textContent='';
    const ca=card(st.aMin,st.aMax), cb=card(st.bMin,st.bMax);
    const svg=el('div',{});
    svg.innerHTML='<svg class="link" viewBox="0 0 460 60" width="460">'+
      '<rect class="bx" x="4" y="10" width="118" height="30" rx="3"/><text x="30" y="30">КЛИЕНТ</text>'+
      '<rect class="bx" x="338" y="10" width="118" height="30" rx="3"/><text x="368" y="30">ЗАКАЗ</text>'+
      '<path class="th" d="M122 25 H338"/>'+
      foot(150,-1,st.aMin,st.aMax)+foot(310,1,st.bMin,st.bMax)+
      '<text class="lbl" x="150" y="52">'+ca+'</text>'+
      '<text class="lbl" x="286" y="52">'+cb+'</text></svg>';
    out.appendChild(svg);
    const say=c=> c==='1'?'ровно один':c==='0..1'?'ноль или один':c==='0..*'?'сколько угодно, включая ноль':'хотя бы один';
    out.appendChild(el('div',{class:'wread', html:
      'Читаем с двух сторон: у одного <b>клиента</b> — '+say(cb)+' заказ(ов); '+
      'у одного <b>заказа</b> — '+say(ca)+' клиент(ов).'}));
    const many = c=>c==='0..*'||c==='1..*';
    let verdict, code;
    if(many(ca)&&many(cb)){ verdict='Связь многие ко многим: нужна связующая таблица с двумя внешними ключами.';
      code='Table ClientOrder {\n  client_id int\n  order_id int\n}'; }
    else if(many(cb)){ verdict='Связь один ко многим. Внешний ключ живёт на стороне «многих» — в таблице ЗАКАЗ.';
      code='Order.client_id int'+(ca==='1'?' [not null]':' [null]'); }
    else if(many(ca)){ verdict='Связь один ко многим в обратную сторону: внешний ключ в таблице КЛИЕНТ.';
      code='Client.order_id int'+(cb==='1'?' [not null]':' [null]'); }
    else { verdict='Связь один к одному. Внешний ключ кладут в зависимую таблицу.';
      code='Order.client_id int [unique'+(ca==='1'?', not null':'')+']'; }
    out.appendChild(el('div',{class:'wread'}, verdict));
    out.appendChild(el('div',{class:'wcode'}, code));
  };
  box.appendChild(el('h4',{},'Соберите связь и прочитайте её'));
  box.appendChild(el('div',{class:'whint'},'Переключайте минимум и максимум с каждой стороны — схема, чтение и место внешнего ключа меняются сразу.'));
  box.appendChild(el('div',{class:'ctrls'},
    el('div',{class:'ctrl'}, el('span',{class:'cl'},'Клиентов у заказа: мин'), seg('aMin',['0','1'],['0','1'])),
    el('div',{class:'ctrl'}, el('span',{class:'cl'},'Клиентов у заказа: макс'), seg('aMax',['1','*'],['1','много'])),
    el('div',{class:'ctrl'}, el('span',{class:'cl'},'Заказов у клиента: мин'), seg('bMin',['0','1'],['0','1'])),
    el('div',{class:'ctrl'}, el('span',{class:'cl'},'Заказов у клиента: макс'), seg('bMax',['1','*'],['1','много']))
  ));
  box.appendChild(out); draw();
  return box;
};

/* ---- теория ---- */
function theoryNode(blocks){
  const wrap=el('div',{class:'theory'});
  blocks.forEach(b=>{
    if(b.t==='h') wrap.appendChild(el('h3',{},b.v));
    if(b.t==='p') wrap.appendChild(el('p',{html:b.v}));
    if(b.t==='ul') wrap.appendChild(el('ul',{}, b.v.map(x=>el('li',{html:x}))));
    if(b.t==='note') wrap.appendChild(el('div',{class:'note',html:b.v}));
    if(b.t==='code') wrap.appendChild(el('pre',{class:'code'},b.v));
    if(b.t==='dl') wrap.appendChild(el('dl',{class:'dl'}, b.v.flatMap(([d,dd])=>[el('dt',{html:d}),el('dd',{html:dd})])));
    if(b.t==='gal') wrap.appendChild(galleryNode(b.v));
    if(b.t==='fig') wrap.appendChild(figNode(b.cap, b.v, b.arrows));
    if(b.t==='wdg' && WIDGET[b.v]) wrap.appendChild(WIDGET[b.v]());
    if(b.t==='table') wrap.appendChild(el('div',{class:'tblwrap'}, el('table',{},
      el('thead',{},el('tr',{},b.head.map(h=>el('th',{},h)))),
      el('tbody',{}, b.rows.map(r=>el('tr',{}, r.map(c=>el('td',{html:c})))))
    )));
  });
  return wrap;
}

/* ---- практика ---- */
const KIND={choice:'один ответ',multi:'несколько ответов',fill:'вписать ответ',
  assign:'сопоставление',order:'порядок',build:'конструктор схемы',erd:'песочница ERD'};
let run=null;

/* --- песочница ERD --- */
function erdNode(t, box){
  if(!run.state) run.state={stage:0, errs:0, pick:new Set(), card:null, fk:null, checked:false};
  const st=run.state;
  const host=el('div',{}); box.appendChild(host);
  const good=t.candidates.filter(c=>c.ok);
  const CARDS=['Один к одному (1:1)','Один ко многим (1:N)','Многие ко многим (N:M)'];

  const codePanel=()=>{
    const p=el('div',{class:'erd-code'});
    if(st.stage===0){ p.appendChild(el('span',{class:'ph'},'// схема появится здесь,\n// как только вы выберете таблицы')); return p; }
    let code='';
    good.forEach(c=>{ code+='Table '+c.t+' {\n'+c.f.map(f=>'  '+f).join('\n')+'\n}\n\n'; });
    p.appendChild(document.createTextNode(code));
    const done=Math.min(st.stage-1, t.links.length);
    for(let i=0;i<done;i++) p.appendChild(el('span',{class:'rf'}, t.links[i].ref+'\n'));
    if(st.stage-1<t.links.length) p.appendChild(el('span',{class:'ph'},'// связь '+st.stage+' из '+t.links.length+'…'));
    return p;
  };

  const draw=()=>{
    host.textContent='';
    host.appendChild(el('div',{class:'case'},
      el('div',{class:'eyebrow'},'Кейс'), el('p',{html:t.story})));

    const grid=el('div',{class:'erd'});
    const left=el('div',{});
    grid.appendChild(left); grid.appendChild(codePanel());
    host.appendChild(grid);

    /* --- этап 1: состав таблиц --- */
    if(st.stage===0){
      left.appendChild(el('div',{class:'stepline'},
        el('span',{class:'n'},'Этап 1 из '+(t.links.length+1)),
        el('span',{class:'n'},'ошибок: '+st.errs)));
      left.appendChild(el('div',{class:'ask', html:'<b>Что станет таблицей?</b> Отметьте только те кандидаты, которые действительно являются сущностями. Лишнее — это атрибуты или вычисляемые значения.'}));
      const list=el('div',{class:'opts'});
      t.candidates.forEach((c,i)=>{
        const inp=el('input',{type:'checkbox'});
        const lab=el('label',{class:'opt'}, inp, el('span',{class:'txt'}, c.n));
        inp.addEventListener('change',()=>{ if(st.checked) return;
          inp.checked?st.pick.add(i):st.pick.delete(i); lab.classList.toggle('sel', inp.checked); });
        if(st.checked){
          inp.disabled=true; lab.classList.add('locked');
          if(c.ok){ lab.classList.add('good'); lab.appendChild(el('span',{class:'tag'},'таблица')); }
          else if(st.pick.has(i)){ lab.classList.add('bad'); lab.appendChild(el('span',{class:'tag'},'не сущность')); }
          if(!c.ok) lab.appendChild(el('span',{class:'fixhint', style:'flex-basis:100%'}, c.why));
        }
        list.appendChild(lab);
      });
      left.appendChild(list);
      if(!st.checked){
        left.appendChild(el('div',{class:'actions'}, el('button',{class:'btn', onclick:()=>{
          const rightSet=t.candidates.map((c,i)=>c.ok?i:-1).filter(i=>i>=0).sort().join(',');
          const ok=[...st.pick].sort((a,b)=>a-b).join(',')===rightSet;
          if(!ok) st.errs++;
          st.checked=true; draw();
        }},'Проверить состав таблиц')));
      } else {
        left.appendChild(el('div',{class:'fb', style:'border-left-color:var(--accent)'},
          el('div',{class:'v'},'Состав таблиц'), el('div',{class:'why', html:t.whyEntities})));
        left.appendChild(el('div',{class:'actions'}, el('button',{class:'btn',
          onclick:()=>{ st.stage=1; st.checked=false; draw(); }},'Перейти к связям')));
      }
      return;
    }

    /* --- этап 2..N: связи --- */
    const li=st.stage-1;
    if(li<t.links.length){
      const L=t.links[li];
      const fkOpts=['В таблицу '+L.a,'В таблицу '+L.b,'В отдельную связующую таблицу'];
      left.appendChild(el('div',{class:'stepline'},
        el('span',{class:'n'},'Этап '+(st.stage+1)+' из '+(t.links.length+1)),
        el('span',{class:'n'},'ошибок: '+st.errs)));
      left.appendChild(el('div',{class:'pairhead', html:'Связь: <em>'+L.a+'</em> и <em>'+L.b+'</em>'}));
      left.appendChild(el('div',{class:'ask', html:L.rule}));

      const s1=el('select',{}, el('option',{value:''},'— выберите кардинальность —'),
        CARDS.map(c=>el('option',{value:c},c)));
      const s2=el('select',{}, el('option',{value:''},'— выберите место внешнего ключа —'),
        fkOpts.map(c=>el('option',{value:c},c)));
      s1.addEventListener('change',()=>st.card=s1.value);
      s2.addEventListener('change',()=>st.fk=s2.value);
      left.appendChild(el('div',{class:'qa'},
        el('label',{},'Как соотносятся эти сущности?'), s1,
        el('label',{style:'margin-top:6px'},'Где физически хранится внешний ключ?'), s2));

      const hint=el('div',{class:'hintmsg'});
      if(!st.checked){
        left.appendChild(el('div',{class:'actions'}, el('button',{class:'btn', onclick:()=>{
          if(!st.card||!st.fk){ hint.textContent='Ответьте на оба вопроса'; return; }
          const okC=st.card===CARDS[L.card], okF=st.fk===fkOpts[L.fk];
          if(!(okC&&okF)) st.errs++;
          st.res={okC,okF}; st.checked=true; draw();
        }},'Проверить связь'), hint));
      } else {
        const okC=st.card===CARDS[L.card], okF=st.fk===fkOpts[L.fk];
        s1.value=st.card; s2.value=st.fk; s1.disabled=s2.disabled=true;
        s1.classList.add(okC?'good':'bad'); s2.classList.add(okF?'good':'bad');
        left.appendChild(el('div',{class:'fb '+(okC&&okF?'good':'bad')},
          el('div',{class:'v'}, okC&&okF?'Связь описана верно':'Связь описана неверно'),
          el('div',{class:'why', html:'<b>Правильно:</b> '+CARDS[L.card]+'; внешний ключ — '+
            fkOpts[L.fk].toLowerCase()+'.<br>'+L.why})));
        left.appendChild(el('div',{class:'actions'}, el('button',{class:'btn',
          onclick:()=>{ st.stage++; st.checked=false; st.card=null; st.fk=null; draw(); }},
          li===t.links.length-1?'Посмотреть итоговую схему':'Следующая связь')));
      }
      return;
    }

    /* --- финал --- */
    const ok=st.errs===0;
    run.checked=true; run.log[run.i]=ok;
    if(ok || store.res[t.id]!==true) store.res[t.id]=ok;
    save(); paintHud(); paintRail();
    left.appendChild(el('div',{class:'fb '+(ok?'good':'bad')},
      el('div',{class:'v'}, ok?'Схема собрана верно':'Схема собрана с ошибками'),
      el('div',{class:'why'}, ok?'Все таблицы и все связи описаны правильно. Готовый код справа можно вставить в dbdiagram.io и увидеть схему.'
        :'Ошибок по ходу сборки: '+st.errs+'. Перечитайте разборы связей и пройдите кейс заново — важно научиться проговаривать связь с двух сторон.')));
    left.appendChild(el('div',{class:'eyebrow', style:'margin-bottom:8px'},'Разбор связей'));
    const dl=el('dl',{class:'dl', style:'margin-bottom:20px'});
    t.links.forEach(L=>{ dl.appendChild(el('dt',{}, L.a+' — '+L.b));
      dl.appendChild(el('dd',{html:CARDS[L.card]+'. '+L.why})); });
    left.appendChild(dl);
    left.appendChild(el('div',{class:'actions'},
      el('button',{class:'btn', onclick:()=>{ run.i++; run.checked=false; run.state=null; render(); }},
        run.i===run.list.length-1?'Показать результат':'Дальше'),
      el('button',{class:'btn sec', onclick:()=>{ run.state=null; render(); }},'Собрать заново')));
  };

  draw();
  return box;
}

/* --- конструктор схемы --- */
function buildNode(t, box){
  const uniq=[...new Set(t.steps.map(s=>s.k))];
  if(!run.state) run.state={i:0, errs:0, hints:0, tip:false, bad:'',
    pal:shuffle([...new Set([...uniq, ...(t.extras||[])])])};
  const st=run.state;
  const host=el('div',{}); box.appendChild(host);

  const chip=(k,cap)=> el('div',{class:'node'}, glyph(k,46),
    el('span',{class:'knd'}, EL[k].replace(/ \(.*\)/,'')), el('span',{class:'cap'}, cap));

  const draw=()=>{
    host.textContent='';
    host.appendChild(el('div',{class:'case'},
      el('div',{class:'eyebrow'},'Кейс'), el('p',{html:t.story})));

    const flow = t.flow!==false;
    const cv=el('div',{class:'canvas'});
    if(!st.i) cv.appendChild(el('span',{class:'empty'},
      flow?'холст пуст — поставьте первую фигуру':'холст пуст — добавьте первый элемент'));
    for(let n=0;n<st.i;n++){
      if(n && flow) cv.appendChild(el('span',{class:'arrow'}));
      cv.appendChild(chip(t.steps[n].k, t.steps[n].cap));
    }
    if(st.i<t.steps.length){
      if(st.i && flow) cv.appendChild(el('span',{class:'arrow'}));
      cv.appendChild(el('div',{class:'node slot'},
        el('span',{class:'cap'},'?'), el('span',{class:'knd'},'шаг '+(st.i+1))));
    }
    host.appendChild(cv);

    if(st.i>=t.steps.length){ finish(); return; }

    const s=t.steps[st.i];
    host.appendChild(el('div',{class:'stepline'},
      el('span',{class:'n'},'Шаг '+(st.i+1)+' из '+t.steps.length),
      el('span',{class:'n'},'ошибок: '+st.errs),
      el('span',{class:'n'},'подсказок: '+st.hints)));
    host.appendChild(el('div',{class:'ask', html:'<b>По кейсу дальше:</b> '+s.label+'. Какую фигуру поставить?'}));
    if(st.tip) host.appendChild(el('div',{class:'tip', html:'<b>Подсказка.</b> '+s.hint}));

    const pal=el('div',{class:'pal'});
    st.pal.forEach(k=>{
      pal.appendChild(el('button',{class:'pi'+(st.bad===k?' bad':''),
        onclick:()=>pick(k)}, glyph(k,34), el('span',{},EL[k])));
    });
    host.appendChild(pal);

    host.appendChild(el('div',{class:'actions'},
      st.tip? null : el('button',{class:'btn sec', onclick:()=>{ st.hints++; st.tip=true; draw(); }},'Подсказка')));
  };

  const pick=(k)=>{
    const s=t.steps[st.i];
    if(k===s.k){ st.i++; st.tip=false; st.bad=''; draw(); }
    else { st.errs++; st.bad=k; st.tip=true; draw(); }
  };

  const finish=()=>{
    const ok = st.errs===0;
    run.checked=true; run.log[run.i]=ok;
    if(ok || store.res[t.id]!==true) store.res[t.id]=ok;
    save(); paintHud(); paintRail();
    const verdict = st.errs===0 && st.hints===0 ? 'Схема собрана без единой ошибки и без подсказок.'
      : st.errs===0 ? 'Схема собрана верно. Подсказками пользоваться не стыдно — со второго прохода попробуйте без них.'
      : 'Схема собрана, но по пути было '+st.errs+' неверных фигур. Перечитайте разбор и пройдите кейс заново.';
    host.appendChild(el('div',{class:'fb '+(ok?'good':'bad')},
      el('div',{class:'v'}, ok?'Схема верна':'Собрано с ошибками'),
      el('div',{class:'why'}, verdict)));
    host.appendChild(el('div',{class:'eyebrow', style:'margin-bottom:8px'},'Разбор шагов'));
    const dl=el('dl',{class:'dl', style:'margin-bottom:20px'});
    t.steps.forEach((s,n)=>{ dl.appendChild(el('dt',{}, (n+1)+'. '+EL[s.k]));
      dl.appendChild(el('dd',{html:s.hint})); });
    host.appendChild(dl);
    host.appendChild(el('div',{class:'actions'},
      el('button',{class:'btn', onclick:()=>{ run.i++; run.checked=false; run.state=null; render(); }},
        run.i===run.list.length-1?'Показать результат':'Дальше'),
      el('button',{class:'btn sec', onclick:()=>{ run.state=null; render(); }},'Собрать заново')));
  };

  draw();
  return box;
}

function startRun(mod, only){
  const pool = only && only.length ? only : poolOf(mod);
  run={mod, list:shuffle(pool), i:0, log:[], checked:false, state:null};
  render();
}

function runnerNode(mod){
  if(!run || run.mod.id!==mod.id) startRunSilent(mod);
  if(run.i>=run.list.length) return resultNode(mod);

  const t=run.list[run.i];
  const box=el('div',{class:'runner'});

  box.appendChild(el('div',{class:'run-head'},
    el('span',{class:'chip mono'}, t.id),
    el('span',{class:'chip kind'}, KIND[t.type]),
    el('span',{class:'dots'}, run.list.map((_,k)=>el('i',{class:
      k<run.i ? (run.log[k]?'ok':'no') : (k===run.i?'now':'')})))
  ));
  box.appendChild(el('div',{class:'q'}, t.q));
  if(t.sub) box.appendChild(el('div',{class:'qsub'}, t.sub));
  if(t.code) box.appendChild(el('pre',{class:'code', style:'margin-bottom:18px'}, t.code));
  if(t.type==='build') return buildNode(t, box);
  if(t.type==='erd') return erdNode(t, box);

  const body=el('div',{}); box.appendChild(body);
  const hint=el('div',{class:'hintmsg'});
  const acts=el('div',{class:'actions'});

  let read;   /* () => ответ пользователя */
  let mark;   /* (correct) => подсветить */

  if(t.type==='choice' || t.type==='multi'){
    if(!run.state) run.state={order:shuffle(t.opts.map((o,i)=>({o,i}))), pick:new Set()};
    const {order,pick}=run.state;
    const list=el('div',{class:'opts'});
    order.forEach((it,pos)=>{
      const input=el('input',{type:t.type==='choice'?'radio':'checkbox', name:'o'});
      const lab=el('label',{class:'opt'}, input, el('span',{class:'txt'}, it.o));
      input.addEventListener('change',()=>{
        if(run.checked) return;
        if(t.type==='choice'){ pick.clear(); pick.add(it.i);
          list.querySelectorAll('.opt').forEach(n=>n.classList.remove('sel')); }
        else { input.checked?pick.add(it.i):pick.delete(it.i); }
        lab.classList.toggle('sel', input.checked);
        hint.textContent='';
      });
      lab.dataset.i=it.i;
      list.appendChild(lab);
    });
    body.appendChild(list);
    read=()=> pick.size? [...pick] : null;
    mark=()=>{
      const right = t.type==='choice'?[t.a]:t.a;
      list.querySelectorAll('.opt').forEach(n=>{
        const i=+n.dataset.i; n.classList.add('locked'); n.classList.remove('sel');
        n.querySelector('input').disabled=true;
        if(right.includes(i)){ n.classList.add('good'); n.appendChild(el('span',{class:'tag'},'верно')); }
        else if(pick.has(i)){ n.classList.add('bad'); n.appendChild(el('span',{class:'tag'},'ваш выбор')); }
      });
    };
  }

  if(t.type==='fill'){
    const inp=el('input',{class:'fill', type:'text', placeholder:'Ваш ответ', autocomplete:'off'});
    inp.addEventListener('input',()=>hint.textContent='');
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') acts.querySelector('.btn').click(); });
    body.appendChild(inp);
    read=()=> inp.value.trim()? inp.value : null;
    mark=(ok)=>{ inp.disabled=true; inp.classList.add(ok?'good':'bad'); };
  }

  if(t.type==='assign'){
    if(!run.state) run.state={order:shuffle(t.items), val:{}};
    const {order,val}=run.state;
    const rows=el('div',{class:'rows'});
    order.forEach((it,k)=>{
      const sel=el('select',{},
        el('option',{value:''},'— выберите —'),
        t.buckets.map(b=>el('option',{value:b},b)));
      sel.addEventListener('change',()=>{ val[k]=sel.value; hint.textContent=''; });
      const row=el('div',{class:'row'}, el('span',{class:'txt'}, it.text), sel);
      row.dataset.k=k; rows.appendChild(row);
    });
    body.appendChild(rows);
    read=()=> order.every((_,k)=>val[k])? order.map((_,k)=>val[k]) : null;
    mark=()=>{
      rows.querySelectorAll('.row').forEach(n=>{
        const k=+n.dataset.k, ok=val[k]===order[k].a;
        n.classList.add(ok?'good':'bad');
        const s=n.querySelector('select'); s.disabled=true;
        if(!ok) n.appendChild(el('span',{class:'fixhint'},'→ '+order[k].a));
      });
    };
  }

  if(t.type==='order'){
    if(!run.state) run.state={order:shuffle(t.items)};
    const st=run.state;
    const rows=el('div',{class:'rows'});
    const draw=()=>{
      rows.textContent='';
      st.order.forEach((txt,k)=>{
        const up=el('button',{class:'mvb', title:'Выше', disabled:k===0||run.checked,
          onclick:()=>{ [st.order[k-1],st.order[k]]=[st.order[k],st.order[k-1]]; draw(); }},'↑');
        const dn=el('button',{class:'mvb', title:'Ниже', disabled:k===st.order.length-1||run.checked,
          onclick:()=>{ [st.order[k+1],st.order[k]]=[st.order[k],st.order[k+1]]; draw(); }},'↓');
        const row=el('div',{class:'row'}, el('span',{class:'idx'},(k+1)+'.'),
          el('span',{class:'txt'},txt), el('span',{class:'mv'},up,dn));
        if(run.checked){ const ok=txt===t.items[k]; row.classList.add(ok?'good':'bad');
          if(!ok) row.appendChild(el('span',{class:'fixhint'},'должно быть №'+(t.items.indexOf(txt)+1))); }
        rows.appendChild(row);
      });
    };
    draw(); body.appendChild(rows);
    read=()=> st.order;
    mark=()=>draw();
  }

  /* --- проверка --- */
  const check=()=>{
    const ans=read();
    if(ans===null){ hint.textContent='Ответ не заполнен'; return; }
    let ok=false;
    if(t.type==='choice') ok = ans[0]===t.a;
    if(t.type==='multi'){ const r=[...t.a].sort().join(','); ok = [...ans].sort().join(',')===r; }
    if(t.type==='fill') ok = t.a.some(v=>norm(v)===norm(ans));
    if(t.type==='assign') ok = run.state.order.every((it,k)=>run.state.val[k]===it.a);
    if(t.type==='order') ok = ans.every((v,k)=>v===t.items[k]);

    run.checked=true; run.log[run.i]=ok;
    if(ok || store.res[t.id]!==true) store.res[t.id]=ok;
    save(); paintHud(); paintRail();
    mark(ok);
    hint.textContent='';

    const fb=el('div',{class:'fb '+(ok?'good':'bad')},
      el('div',{class:'v'}, ok?'Верно':'Неверно'),
      el('div',{class:'why', html:(t.type==='fill'&&!ok? '<b>Правильный ответ:</b> '+t.a[0]+'. ':'')+t.why}));
    body.after(fb);

    acts.textContent='';
    acts.appendChild(el('button',{class:'btn', onclick:()=>{
      run.i++; run.checked=false; run.state=null; render();
    }}, run.i===run.list.length-1?'Показать результат':'Дальше'));
    acts.querySelector('.btn').focus();
  };

  acts.appendChild(el('button',{class:'btn', onclick:check},'Проверить'));
  acts.appendChild(hint);
  box.appendChild(acts);
  return box;
}

function startRunSilent(mod){
  run={mod, list:shuffle(poolOf(mod)), i:0, log:[], checked:false, state:null};
}

function resultNode(mod){
  const right=run.log.filter(Boolean).length, total=run.list.length;
  const pct=Math.round(right/total*100);
  const missed=run.list.filter((t,k)=>!run.log[k]);
  if(mod.exam){ store.exam=Math.max(store.exam||0, pct); save(); paintRail(); }
  const verdict = pct===100 ? 'Дело раскрыто полностью. Можно переходить к следующему.'
    : pct>=80 ? 'Дело почти закрыто. Разберите промахи ниже и прогоните их отдельно.'
    : pct>=50 ? 'Основа есть, но половина деталей пока плавает. Перечитайте досье и прогоните ошибки.'
    : 'Дело не раскрыто: вернитесь к досье и пройдите расследование заново.';
  const box=el('div',{class:'result'});
  box.appendChild(el('div',{class:'eyebrow'}, mod.exam?'Итог экзамена':'Итог по делу'));
  box.appendChild(el('div',{class:'score'}, pct+'', el('span',{},'%')));
  box.appendChild(el('div',{class:'verdict'}, 'Верно '+right+' из '+total+'. '+verdict));
  if(missed.length){
    box.appendChild(el('div',{class:'eyebrow'},'Нераскрытые улики'));
    box.appendChild(el('div',{class:'misslist'}, missed.map(t=>
      el('div',{class:'miss'}, el('span',{class:'id'},t.id), el('span',{class:'qq'},t.q)))));
  }
  box.appendChild(el('div',{class:'actions'},
    missed.length? el('button',{class:'btn', onclick:()=>startRun(mod,missed)},'Прогнать ошибки') : null,
    el('button',{class:'btn'+(missed.length?' sec':''), onclick:()=>startRun(mod)},'Пройти заново'),
    el('button',{class:'btn sec', onclick:()=>{
      const i=MODULES.findIndex(m=>m.id===mod.id);
      if(i<MODULES.length-1){ current=MODULES[i+1].id; run=null; render(); window.scrollTo({top:0,behavior:'smooth'}); }
    }}, 'Следующий модуль')
  ));
  return box;
}

/* ---- рендер ---- */
let tab='theory';
function render(){
  const mod=MODULES.find(m=>m.id===current);
  const stage=document.getElementById('stage');
  stage.textContent='';
  const done=mod.tasks.filter(t=>mastered(t.id)).length;

  const no=String(MODULES.indexOf(mod)+1).padStart(2,'0');
  const head=el('div',{class:'sheet-head'},
    el('div',{class:'casebar'},
      el('span',{class:'stamp'}, mod.exam?'экзамен':'дело № '+no),
      mod.caseName? el('span',{class:'codename'}, '«'+mod.caseName+'»') : null,
      mod.emblem? emblem(mod.emblem,30) : null),
    el('h2',{}, mod.title),
    mod.hook? el('p',{class:'hook'}, mod.hook) : null,
    el('p',{class:'lead'}, mod.lead),
    el('div',{class:'tabs'},
      el('button',{class:'tab','aria-selected':tab==='theory','onclick':()=>{tab='theory';render();}},
        mod.exam?'Регламент':'Досье'),
      el('button',{class:'tab','aria-selected':tab==='practice','onclick':()=>{tab='practice';render();}},
        mod.exam ? 'Сдать экзамен' : 'Расследование · '+done+'/'+mod.tasks.length)
    ));

  const body=el('div',{class:'body'});
  if(tab==='theory'){
    if(mod.purpose) body.appendChild(purposeNode(mod.purpose));
    body.appendChild(theoryNode(mod.theory));
    body.appendChild(el('div',{class:'actions', style:'margin-top:28px'},
      el('button',{class:'btn', onclick:()=>{ tab='practice'; run=null; render(); }},'Перейти к практике')));
  } else {
    body.appendChild(runnerNode(mod));
  }
  stage.appendChild(el('section',{class:'sheet', style:mod.hue||''}, head, body));
  paintRail();
}

document.getElementById('reset').addEventListener('click',()=>{
  if(!confirm('Сбросить весь прогресс? Отметки об освоенных задачах будут удалены.')) return;
  store={res:{}}; save(); run=null; paintHud(); render();
});

paintHud(); render();
</script>

</body>
</html>
