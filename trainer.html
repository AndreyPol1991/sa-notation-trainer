  box.appendChild(el('div',{class:'ctrls'}, el('div',{class:'ctrl'}, el('span',{class:'cl'},'Уровень модели'), seg)));
  box.appendChild(pic);
  box.appendChild(el('div',{class:'wout'}, note, meta));
  draw();
  return box;
};

/* легенда фигур: клик по карточке раскрывает пояснение */
function galleryNode(items){
  const box=el('div',{class:'gal'});
  const note=el('div',{class:'galnote', style:'display:none'});
  items.forEach(([k,cap,desc])=>{
    const card=el('button',{class:'gi','aria-expanded':'false', onclick:()=>{
      const open=card.getAttribute('aria-expanded')==='true';
      box.querySelectorAll('.gi').forEach(n=>n.setAttribute('aria-expanded','false'));
      if(open){ note.style.display='none'; return; }
      card.setAttribute('aria-expanded','true');
      note.innerHTML='<b>'+(cap||EL[k])+'.</b> '+(desc||'');
      note.style.display='';
      card.after(note);
    }}, glyph(k,44), el('span',{class:'nm'}, cap||EL[k]));
    box.appendChild(card);
  });
  return box;
}
/* отрисованный пример схемы; третий элемент шага — пояснение по клику */
function figNode(cap, steps, arrows){
  const row=el('div',{class:'figrow'});
  const hasNotes=steps.some(s=>s[2]);
  const note=el('div',{class:'erdnote'}, hasNotes?'Нажмите на любую фигуру — объясню, почему здесь именно она.':'');
  let sel=null;
  steps.forEach(([k,c,why],i)=>{
    if(i && arrows!==false) row.appendChild(el('span',{class:'arrow'}));
    const n=el('div',{class:'fignode'+(why?' act':'')}, glyph(k,40), el('span',{class:'fc'}, c));
    if(why) n.addEventListener('click',()=>{
      if(sel===i){ sel=null; row.querySelectorAll('.fignode').forEach(x=>x.classList.remove('hl','dim'));
        note.textContent='Нажмите на любую фигуру — объясню, почему здесь именно она.'; return; }
      sel=i;
      row.querySelectorAll('.fignode').forEach((x,j)=>{
        x.classList.toggle('hl', j===i); x.classList.toggle('dim', j!==i); });
      note.innerHTML='<b>'+(EL[k]||c)+'.</b> '+why;
    });
    row.appendChild(n);
  });
  const box=el('div',{class:'fig'}, el('div',{class:'figcap'}, cap), row);
  if(hasNotes) box.appendChild(note);
  return box;
}

/* динамика по делам: сколько улик раскрыто в каждом */
const progressWidget=()=>{
  const box=el('div',{class:'wdg'});
  const draw=()=>{
    box.textContent='';
    box.appendChild(el('h4',{},'Динамика расследований'));
    box.appendChild(el('div',{class:'whint'},
      'Столбец — дело, высота — доля раскрытых улик. Нажмите на столбец, чтобы перейти в это дело.'));
    const list=MODULES.filter(m=>!m.exam);
    const done=list.map(m=>m.tasks.filter(t=>mastered(t.id)).length);
    const tot=list.map(m=>m.tasks.length);
    const all=tot.reduce((a,b)=>a+b,0), ok=done.reduce((a,b)=>a+b,0);
    const chart=el('div',{class:'chart'});
    list.forEach((m,i)=>{
      const pct=tot[i]? Math.round(done[i]/tot[i]*100):0;
      const col=el('button',{class:'bar-col', style:m.hue||'', title:m.title+': '+done[i]+' из '+tot[i],
        onclick:()=>{ current=m.id; tab='theory'; run=null; render(); window.scrollTo({top:0,behavior:'smooth'}); }},
        el('span',{class:'bar-v'}, el('i',{style:'height:'+Math.max(pct,3)+'%'})),
        el('span',{class:'bar-n'}, String(MODULES.indexOf(m)+1).padStart(2,'0')));
      if(pct===100) col.classList.add('full');
      chart.appendChild(col);
    });
    box.appendChild(chart);
    box.appendChild(el('div',{class:'wout'},
      el('div',{class:'wread', html:'Всего раскрыто <b>'+ok+'</b> из '+all+' улик — это '+
        Math.round(ok/all*100)+'%. Полностью закрытых дел: <b>'+
        list.filter((m,i)=>tot[i]&&done[i]===tot[i]).length+'</b> из '+list.length+'.'})));
  };
  draw();
  return box;
};

/* 1. кардинальность: собери связь и прочитай её */
WIDGET.cardinality=()=>{
  const st={aMin:'1',aMax:'1',bMin:'0',bMax:'*'};
  const box=el('div',{class:'wdg'});
  const out=el('div',{class:'wout'});
  const seg=(key,vals,labels)=>{
    const s=el('div',{class:'seg'});
    vals.forEach((v,i)=>{
      const b=el('button',{'aria-pressed':st[key]===v?'true':'false', onclick:()=>{
        st[key]=v; s.querySelectorAll('button').forEach(n=>n.setAttribute('aria-pressed','false'));
        b.setAttribute('aria-pressed','true'); draw();
      }}, labels[i]);
      s.appendChild(b);
    });
    return s;
  };
  const card=(min,max)=> min==='0'&&max==='1' ? '0..1' : min==='1'&&max==='1' ? '1'
    : min==='0' ? '0..*' : '1..*';
  const foot=(x,dir,min,max)=>{ /* значки вороньей лапки */
    const d=dir, g=[];
    g.push('<path class="ln" d="M'+(x+d*10)+' 32 v-14"/>');                       /* черта «один» */
    if(max==='*'){ g.push('<path class="ln" d="M'+x+' 25 l'+(d*13)+' -7 M'+x+' 25 l'+(d*13)+' 0 M'+x+' 25 l'+(d*13)+' 7"/>'); }
    if(min==='0'){ g.push('<circle class="ln" cx="'+(x+d*20)+'" cy="25" r="4.5"/>'); }
    return g.join('');
  };
  const draw=()=>{
    out.textContent='';
    const ca=card(st.aMin,st.aMax), cb=card(st.bMin,st.bMax);
    const svg=el('div',{});
    svg.innerHTML='<svg class="link" viewBox="0 0 460 60" width="460">'+
      '<rect class="bx" x="4" y="10" width="118" height="30" rx="3"/><text x="30" y="30">КЛИЕНТ</text>'+
      '<rect class="bx" x="338" y="10" width="118" height="30" rx="3"/><text x="368" y="30">ЗАКАЗ</text>'+
      '<path class="th" d="M122 25 H338"/>'+
      foot(150,-1,st.aMin,st.aMax)+foot(310,1,st.bMin,st.bMax)+
      '<text class="lbl" x="150" y="52">'+ca+'</text>'+
      '<text class="lbl" x="286" y="52">'+cb+'</text></svg>';
    out.appendChild(svg);
    const say=c=> c==='1'?'ровно один':c==='0..1'?'ноль или один':c==='0..*'?'сколько угодно, включая ноль':'хотя бы один';
    out.appendChild(el('div',{class:'wread', html:
      'Читаем с двух сторон: у одного <b>клиента</b> — '+say(cb)+' заказ(ов); '+
      'у одного <b>заказа</b> — '+say(ca)+' клиент(ов).'}));
    const many = c=>c==='0..*'||c==='1..*';
    let verdict, code;
    if(many(ca)&&many(cb)){ verdict='Связь многие ко многим: нужна связующая таблица с двумя внешними ключами.';
      code='Table ClientOrder {\n  client_id int\n  order_id int\n}'; }
    else if(many(cb)){ verdict='Связь один ко многим. Внешний ключ живёт на стороне «многих» — в таблице ЗАКАЗ.';
      code='Order.client_id int'+(ca==='1'?' [not null]':' [null]'); }
    else if(many(ca)){ verdict='Связь один ко многим в обратную сторону: внешний ключ в таблице КЛИЕНТ.';
      code='Client.order_id int'+(cb==='1'?' [not null]':' [null]'); }
    else { verdict='Связь один к одному. Внешний ключ кладут в зависимую таблицу.';
      code='Order.client_id int [unique'+(ca==='1'?', not null':'')+']'; }
    out.appendChild(el('div',{class:'wread'}, verdict));
    out.appendChild(el('div',{class:'wcode'}, code));
  };
  box.appendChild(el('h4',{},'Соберите связь и прочитайте её'));
  box.appendChild(el('div',{class:'whint'},'Переключайте минимум и максимум с каждой стороны — схема, чтение и место внешнего ключа меняются сразу.'));
  box.appendChild(el('div',{class:'ctrls'},
    el('div',{class:'ctrl'}, el('span',{class:'cl'},'Клиентов у заказа: мин'), seg('aMin',['0','1'],['0','1'])),
    el('div',{class:'ctrl'}, el('span',{class:'cl'},'Клиентов у заказа: макс'), seg('aMax',['1','*'],['1','много'])),
    el('div',{class:'ctrl'}, el('span',{class:'cl'},'Заказов у клиента: мин'), seg('bMin',['0','1'],['0','1'])),
    el('div',{class:'ctrl'}, el('span',{class:'cl'},'Заказов у клиента: макс'), seg('bMax',['1','*'],['1','много']))
  ));
  box.appendChild(out); draw();
  return box;
};

/* ---- теория ---- */
function theoryNode(blocks){
  const wrap=el('div',{class:'theory'});
  blocks.forEach(b=>renderBlock(b,wrap));
  return wrap;
}
function renderBlock(b,wrap){
  {
    if(b.t==='h') wrap.appendChild(el('h3',{},b.v));
    if(b.t==='p') wrap.appendChild(el('p',{html:b.v}));
    if(b.t==='ul') wrap.appendChild(el('ul',{}, b.v.map(x=>el('li',{html:x}))));
    if(b.t==='note') wrap.appendChild(el('div',{class:'note',html:b.v}));
    if(b.t==='code') wrap.appendChild(el('pre',{class:'code'},b.v));
    if(b.t==='dl') wrap.appendChild(el('dl',{class:'dl'}, b.v.flatMap(([d,dd])=>[el('dt',{html:d}),el('dd',{html:dd})])));
    if(b.t==='rules') wrap.appendChild(el('ul',{class:'rules'},
      b.v.map(([ok,txt])=>el('li',{class:ok?'yes':'no'}, el('span',{html:txt})))));
    if(b.t==='kase'){
      const deep=!!b.spec;
      const s=b.spec||{};
      const sec=el('section',{class:'kase'+(deep?' deep':'')});
      sec.appendChild(el('div',{class:'eyebrow'},(deep?'Разбор дела · ':'Мини-кейс · ')+b.title));
      if(deep){
        (s.situation||[]).forEach(p=>sec.appendChild(el('p',{class:'kase-s', html:p})));
        if(s.facts){
          sec.appendChild(el('div',{class:'kase-lbl'},'Что известно'));
          sec.appendChild(el('dl',{class:'kase-facts'},
            s.facts.flatMap(([k,v])=>[el('dt',{html:k}), el('dd',{html:v})])));
        }
      } else sec.appendChild(el('p',{class:'kase-s', html:b.situation}));
      sec.appendChild(el('p',{class:'kase-q', html:'<b>Вопрос:</b> '+(deep?s.question:b.question)}));
      const ans=el('div',{class:'kase-ans', style:'display:none'});
      if(deep){
        (s.steps||[]).forEach(([h,...ps],i)=>{
          ans.appendChild(el('div',{class:'kase-step'},
            el('span',{class:'kase-num'}, String(i+1)),
            el('div',{},
              el('div',{class:'kase-sh'}, h),
              ...ps.map(p=> typeof p==='string' ? el('p',{html:p}) : (()=>{ const h2=el('div'); renderBlock(p,h2); return h2; })()))));
        });
        if(s.result){
          ans.appendChild(el('div',{class:'kase-lbl'},'Что получилось на выходе'));
          const rh=el('div',{class:'kase-res'});
          (Array.isArray(s.result)?s.result:[s.result]).forEach(r=>renderBlock(r,rh));
          ans.appendChild(rh);
        }
        if(s.lesson) ans.appendChild(el('div',{class:'note', html:'<b>Чему учит этот случай.</b> '+s.lesson}));
      } else ans.innerHTML=b.answer;
      const btn=el('button',{class:'btn sec', onclick:()=>{
        const open=ans.style.display!=='none';
        ans.style.display=open?'none':'';
        btn.textContent=open?'Показать разбор':'Скрыть разбор';
      }},'Показать разбор');
      sec.appendChild(btn); sec.appendChild(ans);
      wrap.appendChild(sec);
    }
    if(b.t==='erdfig') wrap.appendChild(erdFigNode(b.v));
    if(b.t==='sysfig') wrap.appendChild(sysFigNode(b.v));
    if(b.t==='diag') wrap.appendChild(diagNode(b.v));
    if(b.t==='gal') wrap.appendChild(galleryNode(b.v));
    if(b.t==='fig') wrap.appendChild(figNode(b.cap, b.v, b.arrows));
    if(b.t==='wdg' && WIDGET[b.v]) wrap.appendChild(WIDGET[b.v]());
    if(b.t==='table') wrap.appendChild(el('div',{class:'tblwrap'}, el('table',{},
      el('thead',{},el('tr',{},b.head.map(h=>el('th',{},h)))),
      el('tbody',{}, b.rows.map(r=>el('tr',{}, r.map(c=>el('td',{html:c})))))
    )));
  }
  return wrap;
}

/* ---- практика ---- */
const KIND={choice:'один ответ',multi:'несколько ответов',fill:'вписать ответ',
  assign:'сопоставление',order:'порядок',build:'конструктор схемы',erd:'песочница ERD',
  hotspot:'найди ошибку на схеме'};

/* --- ключ с правильными ответами: виден только в режиме преподавателя --- */
function teacherKey(t){
  let ans='';
  if(t.type==='choice') ans='<b>'+t.opts[t.a]+'</b>';
  else if(t.type==='multi') ans=t.a.map(i=>'<b>'+t.opts[i]+'</b>').join('<br>');
  else if(t.type==='fill') ans='<b>'+t.a[0]+'</b>'+(t.a.length>1? ' <span class="alt">(также принимается: '+t.a.slice(1).join(', ')+')</span>':'');
  else if(t.type==='assign') ans=t.items.map(it=>it.text+' → <b>'+it.a+'</b>').join('<br>');
  else if(t.type==='order') ans=t.items.map((x,i)=>(i+1)+'. '+x).join('<br>');
  else if(t.type==='build') ans=t.steps.map((s,i)=>(i+1)+'. <b>'+(EL[s.k]||s.k)+'</b> — '+s.cap).join('<br>');
  else if(t.type==='hotspot') ans='Ошибочная фигура: <b>'+t.nodes[t.a][1]+'</b> ('+(EL[t.nodes[t.a][0]]||'')+')';
  else if(t.type==='erd'){
    ans='<u>Таблицы:</u> '+t.candidates.filter(c=>c.ok).map(c=>'<b>'+c.t+'</b>').join(', ')+'<br><u>Связи:</u><br>'+
      t.links.map(L=>{ const C=['Один к одному (1:1)','Один ко многим (1:N)','Многие ко многим (N:M)'];
        const F=['в таблицу '+L.a,'в таблицу '+L.b,'в отдельную связующую таблицу'];
        return L.a+' — '+L.b+': <b>'+C[L.card]+'</b>, ключ '+F[L.fk]; }).join('<br>');
  }
  const body=el('div',{class:'key-body', style:'display:none'});
  body.innerHTML='<div class="key-ans">'+ans+'</div>'+
    (t.why? '<div class="key-why"><b>Разбор:</b> '+t.why+'</div>':'');
  const btn=el('button',{class:'key-btn', onclick:()=>{
    const open=body.style.display!=='none';
    body.style.display=open?'none':'';
    btn.textContent=open?'Показать ключ':'Скрыть ключ';
  }},'Показать ключ');
  return el('div',{class:'tkey'},
    el('div',{class:'key-head'}, el('span',{class:'eyebrow'},'Ключ преподавателя'), btn), body);
}

/* --- найди ошибку на схеме --- */
function hotspotNode(t, box){
  if(!run.state) run.state={tries:0, found:false, first:null};
  const st=run.state;
  const host=el('div',{}); box.appendChild(host);
  const draw=()=>{
    host.textContent='';
    host.appendChild(el('div',{class:'case'},
      el('div',{class:'eyebrow'},'Что должно быть на схеме'), el('p',{html:t.story})));
    const fig=el('div',{class:'fig'});
    fig.appendChild(el('div',{class:'figcap'}, t.cap||'Схема с ошибкой'));
    const row=el('div',{class:'figrow'});
    t.nodes.forEach(([k,cap],i)=>{
      if(i && t.flow!==false) row.appendChild(el('span',{class:'arrow'}));
      const n=el('div',{class:'fignode act'}, glyph(k,40), el('span',{class:'fc'},cap));
      if(st.found){
        if(i===t.a){ n.classList.add('bad-node'); n.appendChild(el('span',{class:'fc mark'},'ошибка')); }
        else n.classList.add('dim');
      } else if(st.wrong===i) n.classList.add('shakeit');
      if(!st.found) n.addEventListener('click',()=>{
        st.tries++;
        if(st.first===null) st.first = (i===t.a);
        if(i===t.a){ st.found=true; finish(); }
        else { st.wrong=i; st.note=t.ok&&t.ok[i] ? t.ok[i] : 'Эта фигура здесь уместна — ищите дальше.'; draw(); }
      });
      row.appendChild(n);
    });
    fig.appendChild(row);
    host.appendChild(fig);
    if(!st.found){
      host.appendChild(el('div',{class:'erdnote', html: st.note
        ? '<b>Не она.</b> '+st.note
        : 'Нажмите на фигуру, которая здесь стоять не должна.'}));
      host.appendChild(el('div',{class:'stepline'},
        el('span',{class:'n'},'попыток: '+st.tries)));
    }
  };
  const finish=()=>{
    const ok = st.first===true;
    run.checked=true; run.log[run.i]=ok;
    if(ok || store.res[t.id]!==true) store.res[t.id]=ok;
    save(); paintHud(); paintRail();
    draw();
    host.appendChild(el('div',{class:'fb '+(ok?'good':'bad')},
      el('div',{class:'v'}, ok?'Ошибка найдена с первой попытки':'Ошибка найдена, но не сразу'),
      el('div',{class:'why', html:t.why})));
    host.appendChild(el('div',{class:'actions'},
      el('button',{class:'btn', onclick:()=>{ run.i++; run.checked=false; run.state=null; render(); }},
        run.i===run.list.length-1?'Показать результат':'Дальше')));
  };
  draw();
  return box;
}
let run=null;

/* --- песочница ERD --- */
function erdNode(t, box){
  if(!run.state) run.state={stage:0, errs:0, pick:new Set(), card:null, fk:null, checked:false};
  const st=run.state;
  const host=el('div',{}); box.appendChild(host);
  const good=t.candidates.filter(c=>c.ok);
  const CARDS=['Один к одному (1:1)','Один ко многим (1:N)','Многие ко многим (N:M)'];

  const codePanel=()=>{
    const p=el('div',{class:'erd-code'});
    if(st.stage===0){ p.appendChild(el('span',{class:'ph'},'// схема появится здесь,\n// как только вы выберете таблицы')); return p; }
    let code='';
    good.forEach(c=>{ code+='Table '+c.t+' {\n'+c.f.map(f=>'  '+f).join('\n')+'\n}\n\n'; });
    p.appendChild(document.createTextNode(code));
    const done=Math.min(st.stage-1, t.links.length);
    for(let i=0;i<done;i++) p.appendChild(el('span',{class:'rf'}, t.links[i].ref+'\n'));
    if(st.stage-1<t.links.length) p.appendChild(el('span',{class:'ph'},'// связь '+st.stage+' из '+t.links.length+'…'));
    return p;
  };

  const draw=()=>{
    host.textContent='';
    host.appendChild(el('div',{class:'case'},
      el('div',{class:'eyebrow'},'Кейс'), el('p',{html:t.story})));

    const grid=el('div',{class:'erd'});
    const left=el('div',{});
    grid.appendChild(left); grid.appendChild(codePanel());
    host.appendChild(grid);

    /* --- этап 1: состав таблиц --- */
    if(st.stage===0){
      left.appendChild(el('div',{class:'stepline'},
        el('span',{class:'n'},'Этап 1 из '+(t.links.length+1)),
        el('span',{class:'n'},'ошибок: '+st.errs)));
      left.appendChild(el('div',{class:'ask', html:'<b>Что станет таблицей?</b> Отметьте только те кандидаты, которые действительно являются сущностями. Лишнее — это атрибуты или вычисляемые значения.'}));
      const list=el('div',{class:'opts'});
      t.candidates.forEach((c,i)=>{
        const inp=el('input',{type:'checkbox'});
        const lab=el('label',{class:'opt'}, inp, el('span',{class:'txt'}, c.n));
        inp.addEventListener('change',()=>{ if(st.checked) return;
          inp.checked?st.pick.add(i):st.pick.delete(i); lab.classList.toggle('sel', inp.checked); });
        if(st.checked){
          inp.disabled=true; lab.classList.add('locked');
          if(c.ok){ lab.classList.add('good'); lab.appendChild(el('span',{class:'tag'},'таблица')); }
          else if(st.pick.has(i)){ lab.classList.add('bad'); lab.appendChild(el('span',{class:'tag'},'не сущность')); }
          if(!c.ok) lab.appendChild(el('span',{class:'fixhint', style:'flex-basis:100%'}, c.why));
        }
        list.appendChild(lab);
      });
      left.appendChild(list);
      if(!st.checked){
        left.appendChild(el('div',{class:'actions'}, el('button',{class:'btn', onclick:()=>{
          const rightSet=t.candidates.map((c,i)=>c.ok?i:-1).filter(i=>i>=0).sort().join(',');
          const ok=[...st.pick].sort((a,b)=>a-b).join(',')===rightSet;
          if(!ok) st.errs++;
          st.checked=true; draw();
        }},'Проверить состав таблиц')));
      } else {
        left.appendChild(el('div',{class:'fb', style:'border-left-color:var(--accent)'},
          el('div',{class:'v'},'Состав таблиц'), el('div',{class:'why', html:t.whyEntities})));
        left.appendChild(el('div',{class:'actions'}, el('button',{class:'btn',
          onclick:()=>{ st.stage=1; st.checked=false; draw(); }},'Перейти к связям')));
      }
      return;
    }

    /* --- этап 2..N: связи --- */
    const li=st.stage-1;
    if(li<t.links.length){
      const L=t.links[li];
      const fkOpts=['В таблицу '+L.a,'В таблицу '+L.b,'В отдельную связующую таблицу'];
      left.appendChild(el('div',{class:'stepline'},
        el('span',{class:'n'},'Этап '+(st.stage+1)+' из '+(t.links.length+1)),
        el('span',{class:'n'},'ошибок: '+st.errs)));
      left.appendChild(el('div',{class:'pairhead', html:'Связь: <em>'+L.a+'</em> и <em>'+L.b+'</em>'}));
      left.appendChild(el('div',{class:'ask', html:L.rule}));

      const s1=el('select',{}, el('option',{value:''},'— выберите кардинальность —'),
        CARDS.map(c=>el('option',{value:c},c)));
      const s2=el('select',{}, el('option',{value:''},'— выберите место внешнего ключа —'),
        fkOpts.map(c=>el('option',{value:c},c)));
      s1.addEventListener('change',()=>st.card=s1.value);
      s2.addEventListener('change',()=>st.fk=s2.value);
      left.appendChild(el('div',{class:'qa'},
        el('label',{},'Как соотносятся эти сущности?'), s1,
        el('label',{style:'margin-top:6px'},'Где физически хранится внешний ключ?'), s2));

      const hint=el('div',{class:'hintmsg'});
      if(!st.checked){
        left.appendChild(el('div',{class:'actions'}, el('button',{class:'btn', onclick:()=>{
          if(!st.card||!st.fk){ hint.textContent='Ответьте на оба вопроса'; return; }
          const okC=st.card===CARDS[L.card], okF=st.fk===fkOpts[L.fk];
          if(!(okC&&okF)) st.errs++;
          st.res={okC,okF}; st.checked=true; draw();
        }},'Проверить связь'), hint));
      } else {
        const okC=st.card===CARDS[L.card], okF=st.fk===fkOpts[L.fk];
        s1.value=st.card; s2.value=st.fk; s1.disabled=s2.disabled=true;
        s1.classList.add(okC?'good':'bad'); s2.classList.add(okF?'good':'bad');
        left.appendChild(el('div',{class:'fb '+(okC&&okF?'good':'bad')},
          el('div',{class:'v'}, okC&&okF?'Связь описана верно':'Связь описана неверно'),
          el('div',{class:'why', html:'<b>Правильно:</b> '+CARDS[L.card]+'; внешний ключ — '+
            fkOpts[L.fk].toLowerCase()+'.<br>'+L.why})));
        left.appendChild(el('div',{class:'actions'}, el('button',{class:'btn',
          onclick:()=>{ st.stage++; st.checked=false; st.card=null; st.fk=null; draw(); }},
          li===t.links.length-1?'Посмотреть итоговую схему':'Следующая связь')));
      }
      return;
    }

    /* --- финал --- */
    const ok=st.errs===0;
    run.checked=true; run.log[run.i]=ok;
    if(ok || store.res[t.id]!==true) store.res[t.id]=ok;
    save(); paintHud(); paintRail();
    left.appendChild(el('div',{class:'fb '+(ok?'good':'bad')},
      el('div',{class:'v'}, ok?'Схема собрана верно':'Схема собрана с ошибками'),
      el('div',{class:'why'}, ok?'Все таблицы и все связи описаны правильно. Готовый код справа можно вставить в dbdiagram.io и увидеть схему.'
        :'Ошибок по ходу сборки: '+st.errs+'. Перечитайте разборы связей и пройдите кейс заново — важно научиться проговаривать связь с двух сторон.')));
    left.appendChild(el('div',{class:'eyebrow', style:'margin-bottom:8px'},'Разбор связей'));
    const dl=el('dl',{class:'dl', style:'margin-bottom:20px'});
    t.links.forEach(L=>{ dl.appendChild(el('dt',{}, L.a+' — '+L.b));
      dl.appendChild(el('dd',{html:CARDS[L.card]+'. '+L.why})); });
    left.appendChild(dl);
    left.appendChild(el('div',{class:'actions'},
      el('button',{class:'btn', onclick:()=>{ run.i++; run.checked=false; run.state=null; render(); }},
        run.i===run.list.length-1?'Показать результат':'Дальше'),
      el('button',{class:'btn sec', onclick:()=>{ run.state=null; render(); }},'Собрать заново')));
  };

  draw();
  return box;
}

/* --- конструктор схемы --- */
function buildNode(t, box){
  const uniq=[...new Set(t.steps.map(s=>s.k))];
  if(!run.state) run.state={i:0, errs:0, hints:0, tip:false, bad:'',
    pal:shuffle([...new Set([...uniq, ...(t.extras||[])])])};
  const st=run.state;
  const host=el('div',{}); box.appendChild(host);

  const chip=(k,cap)=> el('div',{class:'node'}, glyph(k,46),
    el('span',{class:'knd'}, EL[k].replace(/ \(.*\)/,'')), el('span',{class:'cap'}, cap));

  const draw=()=>{
    host.textContent='';
    host.appendChild(el('div',{class:'case'},
      el('div',{class:'eyebrow'},'Кейс'), el('p',{html:t.story})));

    const flow = t.flow!==false;
    const cv=el('div',{class:'canvas'});
    if(!st.i) cv.appendChild(el('span',{class:'empty'},
      flow?'холст пуст — поставьте первую фигуру':'холст пуст — добавьте первый элемент'));
    for(let n=0;n<st.i;n++){
      if(n && flow) cv.appendChild(el('span',{class:'arrow'}));
      cv.appendChild(chip(t.steps[n].k, t.steps[n].cap));
    }
    let slot=null;
    if(st.i<t.steps.length){
      if(st.i && flow) cv.appendChild(el('span',{class:'arrow'}));
      slot=el('div',{class:'node slot'+(st.bad?' err':'')},
        el('span',{class:'cap'},'?'), el('span',{class:'knd'},'шаг '+(st.i+1)));
      cv.appendChild(slot);
    }
    if(st.i) cv.children[flow? (st.i-1)*2 : st.i-1].classList.add('landed');
    host.appendChild(cv);
    /* примерка фигуры: наведение на палитру показывает её прямо в слоте */
    const tryOn=(k)=>{ if(!slot) return;
      slot.textContent=''; slot.classList.add('ghost');
      slot.appendChild(glyph(k,46));
      slot.appendChild(el('span',{class:'knd'}, EL[k].replace(/ \(.*\)/,'')));
      slot.appendChild(el('span',{class:'cap'},'примерка'));
    };
    const tryOff=()=>{ if(!slot) return;
      slot.textContent=''; slot.classList.remove('ghost');
      slot.appendChild(el('span',{class:'cap'},'?'));
      slot.appendChild(el('span',{class:'knd'},'шаг '+(st.i+1)));
    };

    if(st.i>=t.steps.length){ finish(); return; }

    const s=t.steps[st.i];
    host.appendChild(el('div',{class:'stepline'},
      el('span',{class:'n'},'Шаг '+(st.i+1)+' из '+t.steps.length),
      el('span',{class:'n'},'ошибок: '+st.errs),
      el('span',{class:'n'},'подсказок: '+st.hints)));
    host.appendChild(el('div',{class:'ask', html:'<b>По кейсу дальше:</b> '+s.label+'. Какую фигуру поставить?'}));
    if(st.tip) host.appendChild(el('div',{class:'tip', html:'<b>Подсказка.</b> '+s.hint}));

    const pal=el('div',{class:'pal'});
    st.pal.forEach(k=>{
      pal.appendChild(el('button',{class:'pi'+(st.bad===k?' bad':''), onclick:()=>pick(k),
        onmouseenter:()=>tryOn(k), onmouseleave:tryOff, onfocus:()=>tryOn(k), onblur:tryOff},
        glyph(k,34), el('span',{},EL[k])));
    });
    host.appendChild(pal);

    host.appendChild(el('div',{class:'actions'},
      st.tip? null : el('button',{class:'btn sec', onclick:()=>{ st.hints++; st.tip=true; draw(); }},'Подсказка')));
  };

  const pick=(k)=>{
    const s=t.steps[st.i];
    if(k===s.k){ st.i++; st.tip=false; st.bad=''; draw(); }
    else { st.errs++; st.bad=k; st.tip=true; draw(); }
  };

  const finish=()=>{
    const ok = st.errs===0;
    run.checked=true; run.log[run.i]=ok;
    if(ok || store.res[t.id]!==true) store.res[t.id]=ok;
    save(); paintHud(); paintRail();
    const verdict = st.errs===0 && st.hints===0 ? 'Схема собрана без единой ошибки и без подсказок.'
      : st.errs===0 ? 'Схема собрана верно. Подсказками пользоваться не стыдно — со второго прохода попробуйте без них.'
      : 'Схема собрана, но по пути было '+st.errs+' неверных фигур. Перечитайте разбор и пройдите кейс заново.';
    host.appendChild(el('div',{class:'fb '+(ok?'good':'bad')},
      el('div',{class:'v'}, ok?'Схема верна':'Собрано с ошибками'),
      el('div',{class:'why'}, verdict)));
    host.appendChild(el('div',{class:'eyebrow', style:'margin-bottom:8px'},'Разбор шагов'));
    const dl=el('dl',{class:'dl', style:'margin-bottom:20px'});
    t.steps.forEach((s,n)=>{ dl.appendChild(el('dt',{}, (n+1)+'. '+EL[s.k]));
      dl.appendChild(el('dd',{html:s.hint})); });
    host.appendChild(dl);
    host.appendChild(el('div',{class:'actions'},
      el('button',{class:'btn', onclick:()=>{ run.i++; run.checked=false; run.state=null; render(); }},
        run.i===run.list.length-1?'Показать результат':'Дальше'),
      el('button',{class:'btn sec', onclick:()=>{ run.state=null; render(); }},'Собрать заново')));
  };

  draw();
  return box;
}

function startRun(mod, only){
  const pool = only && only.length ? only : poolOf(mod);
  run={mod, list:shuffle(pool), i:0, log:[], checked:false, state:null};
  render();
}

function runnerNode(mod){
  if(!run || run.mod.id!==mod.id) startRunSilent(mod);
  if(run.i>=run.list.length) return resultNode(mod);

  const t=run.list[run.i];
  const box=el('div',{class:'runner'});

  box.appendChild(el('div',{class:'run-head'},
    el('span',{class:'chip mono'}, t.id),
    el('span',{class:'chip kind'}, KIND[t.type]),
    el('span',{class:'dots'}, run.list.map((_,k)=>el('i',{class:
      k<run.i ? (run.log[k]?'ok':'no') : (k===run.i?'now':'')})))
  ));
  box.appendChild(el('div',{class:'q'}, t.q));
  if(t.sub) box.appendChild(el('div',{class:'qsub'}, t.sub));
  if(t.code) box.appendChild(el('pre',{class:'code', style:'margin-bottom:18px'}, t.code));
  if(TEACHER) box.appendChild(teacherKey(t));
  if(t.type==='build') return buildNode(t, box);
  if(t.type==='erd') return erdNode(t, box);
  if(t.type==='hotspot') return hotspotNode(t, box);

  const body=el('div',{}); box.appendChild(body);
  const hint=el('div',{class:'hintmsg'});
  const acts=el('div',{class:'actions'});

  let read;   /* () => ответ пользователя */
  let mark;   /* (correct) => подсветить */

  if(t.type==='choice' || t.type==='multi'){
    if(!run.state) run.state={order:shuffle(t.opts.map((o,i)=>({o,i}))), pick:new Set()};
    const {order,pick}=run.state;

    /* живая сцена: схема достраивается тем вариантом, который выбран */
    let scene=null, drawScene=null;
    if(t.scene){
      scene=el('div',{class:'fig scene'});
      drawScene=(state)=>{
        scene.textContent='';
        scene.appendChild(el('div',{class:'figcap'}, t.scene.cap||'Как это выглядит на схеме'));
        const row=el('div',{class:'figrow'});
        t.scene.base.forEach(([k,c],i)=>{
          if(i) row.appendChild(el('span',{class:'arrow'}));
          row.appendChild(el('div',{class:'fignode'}, glyph(k,40), el('span',{class:'fc'},c)));
        });
        row.appendChild(el('span',{class:'arrow'}));
        const sel=[...pick][0];
        const shown = state==='answer' ? t.a : sel;
        if(shown===undefined || t.scene.by[shown]===undefined){
          row.appendChild(el('div',{class:'fignode slotmini'},
            el('span',{class:'qm'},'?'), el('span',{class:'fc'}, t.scene.slot||'выберите вариант')));
        } else {
          const k=t.scene.by[shown];
          row.appendChild(el('div',{class:'fignode'+(state==='answer'?' ok':' hl')},
            glyph(k,40), el('span',{class:'fc'}, EL[k]||t.scene.slot)));
        }
        if(t.scene.tail) t.scene.tail.forEach(([k,c])=>{
          row.appendChild(el('span',{class:'arrow'}));
          row.appendChild(el('div',{class:'fignode'}, glyph(k,40), el('span',{class:'fc'},c)));
        });
        scene.appendChild(row);
        if(state==='answer' && sel!==undefined && sel!==t.a){
          scene.appendChild(el('div',{class:'sceneno', html:
            'Ваш вариант — <b>'+(EL[t.scene.by[sel]]||t.opts[sel])+'</b> — на этой схеме дал бы другое поведение.'}));
        }
      };
      drawScene();
      body.appendChild(scene);
    }

    const list=el('div',{class:'opts'});
    order.forEach((it,pos)=>{
      const input=el('input',{type:t.type==='choice'?'radio':'checkbox', name:'o'});
      const lab=el('label',{class:'opt'}, input, el('span',{class:'txt'}, it.o));
      input.addEventListener('change',()=>{
        if(run.checked) return;
        if(t.type==='choice'){ pick.clear(); pick.add(it.i);
          list.querySelectorAll('.opt').forEach(n=>n.classList.remove('sel')); }
        else { input.checked?pick.add(it.i):pick.delete(it.i); }
        lab.classList.toggle('sel', input.checked);
        hint.textContent='';
        if(drawScene) drawScene();
      });
      lab.dataset.i=it.i;
      list.appendChild(lab);
    });
    body.appendChild(list);
    read=()=> pick.size? [...pick] : null;
    mark=()=>{
      if(drawScene) drawScene('answer');
      const right = t.type==='choice'?[t.a]:t.a;
      list.querySelectorAll('.opt').forEach(n=>{
        const i=+n.dataset.i; n.classList.add('locked'); n.classList.remove('sel');
        n.querySelector('input').disabled=true;
        if(right.includes(i)){ n.classList.add('good'); n.appendChild(el('span',{class:'tag'},'верно')); }
        else if(pick.has(i)){ n.classList.add('bad'); n.appendChild(el('span',{class:'tag'},'ваш выбор')); }
      });
    };
  }

  if(t.type==='fill'){
    const inp=el('input',{class:'fill', type:'text', placeholder:'Ваш ответ', autocomplete:'off'});
    inp.addEventListener('input',()=>hint.textContent='');
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') acts.querySelector('.btn').click(); });
    body.appendChild(inp);
    read=()=> inp.value.trim()? inp.value : null;
    mark=(ok)=>{ inp.disabled=true; inp.classList.add(ok?'good':'bad'); };
  }

  if(t.type==='assign'){
    if(!run.state) run.state={order:shuffle(t.items), val:{}};
    const {order,val}=run.state;
    const rows=el('div',{class:'rows'});
    order.forEach((it,k)=>{
      const sel=el('select',{},
        el('option',{value:''},'— выберите —'),
        t.buckets.map(b=>el('option',{value:b},b)));
      sel.addEventListener('change',()=>{ val[k]=sel.value; hint.textContent=''; });
      const row=el('div',{class:'row'}, el('span',{class:'txt'}, it.text), sel);
      row.dataset.k=k; rows.appendChild(row);
    });
    body.appendChild(rows);
    read=()=> order.every((_,k)=>val[k])? order.map((_,k)=>val[k]) : null;
    mark=()=>{
      rows.querySelectorAll('.row').forEach(n=>{
        const k=+n.dataset.k, ok=val[k]===order[k].a;
        n.classList.add(ok?'good':'bad');
        const s=n.querySelector('select'); s.disabled=true;
        if(!ok) n.appendChild(el('span',{class:'fixhint'},'→ '+order[k].a));
      });
    };
  }

  if(t.type==='order'){
    if(!run.state) run.state={order:shuffle(t.items)};
    const st=run.state;
    const rows=el('div',{class:'rows'});
    const draw=()=>{
      rows.textContent='';
      st.order.forEach((txt,k)=>{
        const up=el('button',{class:'mvb', title:'Выше', disabled:k===0||run.checked,
          onclick:()=>{ [st.order[k-1],st.order[k]]=[st.order[k],st.order[k-1]]; draw(); }},'↑');
        const dn=el('button',{class:'mvb', title:'Ниже', disabled:k===st.order.length-1||run.checked,
          onclick:()=>{ [st.order[k+1],st.order[k]]=[st.order[k],st.order[k+1]]; draw(); }},'↓');
        const row=el('div',{class:'row'}, el('span',{class:'idx'},(k+1)+'.'),
          el('span',{class:'txt'},txt), el('span',{class:'mv'},up,dn));
        if(run.checked){ const ok=txt===t.items[k]; row.classList.add(ok?'good':'bad');
          if(!ok) row.appendChild(el('span',{class:'fixhint'},'должно быть №'+(t.items.indexOf(txt)+1))); }
        rows.appendChild(row);
      });
    };
    draw(); body.appendChild(rows);
    read=()=> st.order;
    mark=()=>draw();
  }

  /* --- проверка --- */
  const check=()=>{
    const ans=read();
    if(ans===null){ hint.textContent='Ответ не заполнен'; return; }
    let ok=false;
    if(t.type==='choice') ok = ans[0]===t.a;
    if(t.type==='multi'){ const r=[...t.a].sort().join(','); ok = [...ans].sort().join(',')===r; }
    if(t.type==='fill') ok = t.a.some(v=>norm(v)===norm(ans));
    if(t.type==='assign') ok = run.state.order.every((it,k)=>run.state.val[k]===it.a);
    if(t.type==='order') ok = ans.every((v,k)=>v===t.items[k]);

    run.checked=true; run.log[run.i]=ok;
    if(ok || store.res[t.id]!==true) store.res[t.id]=ok;
    save(); paintHud(); paintRail();
    mark(ok);
    hint.textContent='';

    const fb=el('div',{class:'fb '+(ok?'good':'bad')},
      el('div',{class:'v'}, ok?'Верно':'Неверно'),
      el('div',{class:'why', html:(t.type==='fill'&&!ok? '<b>Правильный ответ:</b> '+t.a[0]+'. ':'')+t.why}));
    body.after(fb);

    acts.textContent='';
    acts.appendChild(el('button',{class:'btn', onclick:()=>{
      run.i++; run.checked=false; run.state=null; render();
    }}, run.i===run.list.length-1?'Показать результат':'Дальше'));
    acts.querySelector('.btn').focus();
  };

  acts.appendChild(el('button',{class:'btn', onclick:check},'Проверить'));
  acts.appendChild(hint);
  box.appendChild(acts);
  return box;
}

function startRunSilent(mod){
  run={mod, list:shuffle(poolOf(mod)), i:0, log:[], checked:false, state:null};
}

function resultNode(mod){
  const right=run.log.filter(Boolean).length, total=run.list.length;
  const pct=Math.round(right/total*100);
  const missed=run.list.filter((t,k)=>!run.log[k]);
  if(mod.exam){ store.exam=Math.max(store.exam||0, pct); save(); paintRail(); }
  const verdict = pct===100 ? 'Дело раскрыто полностью. Можно переходить к следующему.'
    : pct>=80 ? 'Дело почти закрыто. Разберите промахи ниже и прогоните их отдельно.'
    : pct>=50 ? 'Основа есть, но половина деталей пока плавает. Перечитайте досье и прогоните ошибки.'
    : 'Дело не раскрыто: вернитесь к досье и пройдите расследование заново.';
  const box=el('div',{class:'result'});
  box.appendChild(el('div',{class:'eyebrow'}, mod.exam?'Итог экзамена':'Итог по делу'));
  box.appendChild(el('div',{class:'score'}, pct+'', el('span',{},'%')));
  box.appendChild(el('div',{class:'verdict'}, 'Верно '+right+' из '+total+'. '+verdict));
  if(mod.solved && pct>=70) box.appendChild(el('section',{class:'solved'},
    el('div',{class:'eyebrow'},'Развязка'), el('p',{}, mod.solved)));
  else if(mod.solved) box.appendChild(el('section',{class:'solved locked'},
    el('div',{class:'eyebrow'},'Развязка дела'),
    el('p',{},'Откроется, когда наберёте 70% и выше. Сейчас '+pct+'%.')));
  if(missed.length){
    box.appendChild(el('div',{class:'eyebrow'},'Нераскрытые улики'));
    box.appendChild(el('div',{class:'misslist'}, missed.map(t=>
      el('div',{class:'miss'}, el('span',{class:'id'},t.id), el('span',{class:'qq'},t.q)))));
  }
  box.appendChild(el('div',{class:'actions'},
    missed.length? el('button',{class:'btn', onclick:()=>startRun(mod,missed)},'Прогнать ошибки') : null,
    el('button',{class:'btn'+(missed.length?' sec':''), onclick:()=>startRun(mod)},'Пройти заново'),
    el('button',{class:'btn sec', onclick:()=>{
      const i=MODULES.findIndex(m=>m.id===mod.id);
      if(i<MODULES.length-1){ current=MODULES[i+1].id; run=null; render(); window.scrollTo({top:0,behavior:'smooth'}); }
    }}, 'Следующий модуль')
  ));
  return box;
}

/* ---- рендер ---- */
let tab='theory';
function render(){
  const mod=MODULES.find(m=>m.id===current);
  if(tab==='teach' && !TEACHER) tab='theory';
  if(tab==='lecture' && !mod.lecture) tab='theory';
  const stage=document.getElementById('stage');
  stage.textContent='';
  const done=mod.tasks.filter(t=>mastered(t.id)).length;

  const no=String(MODULES.indexOf(mod)+1).padStart(2,'0');
  const head=el('div',{class:'sheet-head'},
    el('div',{class:'casebar'},
      el('span',{class:'stamp'}, mod.exam?'экзамен':'дело № '+no),
      mod.caseName? el('span',{class:'codename'}, '«'+mod.caseName+'»') : null,
      mod.emblem? emblem(mod.emblem,30) : null),
    el('h2',{}, mod.title),
    mod.hook? el('p',{class:'hook'}, mod.hook) : null,
    el('p',{class:'lead'}, mod.lead),
    el('div',{class:'tabs'},
      el('button',{class:'tab','aria-selected':tab==='theory','onclick':()=>{tab='theory';render();}},
        mod.exam?'Регламент':'Досье'),
      mod.lecture? el('button',{class:'tab','aria-selected':tab==='lecture','onclick':()=>{tab='lecture';render();}},
        'Лекция') : null,
      el('button',{class:'tab','aria-selected':tab==='practice','onclick':()=>{tab='practice';render();}},
        mod.exam ? 'Сдать экзамен' : 'Расследование · '+done+'/'+mod.tasks.length),
      (mod.teach && TEACHER)? el('button',{class:'tab','aria-selected':tab==='teach','onclick':()=>{tab='teach';render();}},
        'Преподавателю') : null
    ));

  const body=el('div',{class:'body'});
  if(tab==='theory'){
    if(mod.plot) body.appendChild(el('section',{class:'plot'},
      el('div',{class:'eyebrow'},'Обстоятельства дела'),
      el('p',{}, mod.plot)));
    if(mod.purpose) body.appendChild(purposeNode(mod.purpose));
    body.appendChild(theoryNode(mod.theory));
    body.appendChild(el('div',{class:'actions', style:'margin-top:28px'},
      el('button',{class:'btn', onclick:()=>{ tab='practice'; run=null; render(); }},
        mod.exam?'Сдать экзамен':'Начать расследование')));
  } else if(tab==='lecture'){
    body.appendChild(lectureNode(mod));
  } else if(tab==='teach'){
    body.appendChild(teachNode(mod));
  } else {
    body.appendChild(runnerNode(mod));
  }
  stage.appendChild(el('section',{class:'sheet', style:mod.hue||''}, head, body));
  paintRail();
}

document.getElementById('reset').addEventListener('click',()=>{
  if(!confirm('Сбросить весь прогресс? Отметки об освоенных задачах будут удалены.')) return;
  store={res:{}}; save(); run=null; paintHud(); render();
});

if(TEACHER) document.getElementById('brand-sub').textContent='ERD · BPMN · UML · DFD · режим преподавателя';
paintHud(); render();
</script>
