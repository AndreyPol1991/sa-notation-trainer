<title>Тренажёр нотаций — ERD · BPMN · UML · DFD</title>
<style>
/* ============================================================
   ТОКЕНЫ
   ============================================================ */
:root{
  --paper:#E9EAE4; --sheet:#F7F8F4; --sheet-2:#FFFFFF; --sunk:#E2E4DC;
  --ink:#15181B; --ink-2:#4C5450; --ink-3:#7C847F;
  --line:#C9CCC3; --line-2:#A6ABA0;
  --accent:#1B4DA8; --accent-soft:#DCE5F6;
  --mark:#B06C08; --mark-soft:#F5E7CE;
  --ok:#1C6B48; --ok-soft:#DCEDE4;
  --no:#A62A20; --no-soft:#F5DFDC;
  --grid:rgba(27,77,168,.075);
  --case:#1B4DA8; --case-soft:#DCE5F6; --thread:#A8221B; --stamp:#A8221B;
  --shadow:0 1px 0 rgba(21,24,27,.04), 0 12px 28px -20px rgba(21,24,27,.5);
  --font-display:"Bahnschrift","DIN Alternate","Segoe UI Semibold",system-ui,sans-serif;
  --font-body:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --font-mono:"Cascadia Mono","Consolas",ui-monospace,SFMono-Regular,monospace;
  --r:6px;
  /* ритм отступов */
  --s1:6px; --s2:10px; --s3:16px; --s4:24px; --s5:34px; --s6:48px;
  /* шкала кегля */
  --t-xs:12px; --t-sm:13.5px; --t-md:15.5px; --t-lg:18px; --t-xl:22px;
  --tap:48px;   /* минимальный размер тач-таргета */
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#101315; --sheet:#171B1E; --sheet-2:#1C2125; --sunk:#13171A;
    --ink:#E9ECE7; --ink-2:#A3ACA6; --ink-3:#79837D;
    --line:#2B3237; --line-2:#3E464C;
    --accent:#84ABF6; --accent-soft:#1A2540; --mark:#DFA24C; --mark-soft:#2C2313;
    --ok:#63C89A; --ok-soft:#13291F; --no:#F0857B; --no-soft:#2C1614;
    --grid:rgba(132,171,246,.06);
  --case:#84ABF6; --case-soft:#1A2540; --thread:#E4736A; --stamp:#E4736A;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 14px 30px -22px #000;
  }
}
:root[data-theme="dark"]{
  --paper:#101315; --sheet:#171B1E; --sheet-2:#1C2125; --sunk:#13171A;
  --ink:#E9ECE7; --ink-2:#A3ACA6; --ink-3:#79837D;
  --line:#2B3237; --line-2:#3E464C;
  --accent:#84ABF6; --accent-soft:#1A2540; --mark:#DFA24C; --mark-soft:#2C2313;
  --ok:#63C89A; --ok-soft:#13291F; --no:#F0857B; --no-soft:#2C1614;
  --grid:rgba(132,171,246,.06);
  --case:#84ABF6; --case-soft:#1A2540; --thread:#E4736A; --stamp:#E4736A;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 14px 30px -22px #000;
}
:root[data-theme="light"]{
  --paper:#E9EAE4; --sheet:#F7F8F4; --sheet-2:#FFFFFF; --sunk:#E2E4DC;
  --ink:#15181B; --ink-2:#4C5450; --ink-3:#7C847F;
  --line:#C9CCC3; --line-2:#A6ABA0;
  --accent:#1B4DA8; --accent-soft:#DCE5F6; --mark:#B06C08; --mark-soft:#F5E7CE;
  --ok:#1C6B48; --ok-soft:#DCEDE4; --no:#A62A20; --no-soft:#F5DFDC;
  --grid:rgba(27,77,168,.075);
  --case:#1B4DA8; --case-soft:#DCE5F6; --thread:#A8221B; --stamp:#A8221B;
  --shadow:0 1px 0 rgba(21,24,27,.04), 0 12px 28px -20px rgba(21,24,27,.5);
}

/* ============================================================
   БАЗА
   ============================================================ */
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--font-body); font-size:16px; line-height:1.6;
  background-image:
    repeating-linear-gradient(to right, var(--grid) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(to bottom, var(--grid) 0 1px, transparent 1px 28px);
}
h1,h2,h3,h4{font-family:var(--font-display); font-variation-settings:"wght" 700,"wdth" 87.5;
  font-weight:700; margin:0; letter-spacing:.01em; text-wrap:balance; line-height:1.15}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}
.mono{font-family:var(--font-mono)}
.eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3)}

/* ============================================================
   КАРКАС
   ============================================================ */
.wrap{max-width:1220px; margin:0 auto; padding:0 22px 80px}
header.top{
  border-bottom:1px solid var(--line); background:color-mix(in srgb, var(--paper) 82%, transparent);
  backdrop-filter:blur(8px); position:sticky; top:0; z-index:20;
}
.top-in{max-width:1220px; margin:0 auto; padding:14px 22px; display:flex; align-items:center;
  gap:20px; flex-wrap:wrap}
.brand{display:flex; align-items:baseline; gap:12px; margin-right:auto}
.brand h1{font-size:clamp(19px,2.4vw,25px)}
.brand .sub{font-family:var(--font-mono); font-size:11px; color:var(--ink-3); letter-spacing:.1em}
.hud{display:flex; align-items:center; gap:14px}
.hud .num{font-family:var(--font-mono); font-size:13px; color:var(--ink-2); font-variant-numeric:tabular-nums}
.hud .num b{color:var(--ink); font-weight:600}
.bar{width:150px; height:8px; background:var(--sunk); border:1px solid var(--line); position:relative;
  border-radius:20px; overflow:hidden}
.bar i{position:absolute; inset:0 auto 0 0; background:var(--accent); display:block;
  border-radius:20px; transition:width .4s cubic-bezier(.4,0,.2,1)}
.ghost{background:transparent; border:1px solid var(--line-2); padding:8px 14px; min-height:38px;
  font-family:var(--font-mono); font-size:12px; letter-spacing:.04em; border-radius:20px}
.ghost:hover{border-color:var(--ink-2); background:var(--sheet)}

.shell{display:grid; grid-template-columns:270px minmax(0,1fr); gap:30px; padding-top:26px}
@media(max-width:940px){ .shell{grid-template-columns:1fr; gap:18px} }

/* рейка */
.rail{align-self:start; position:sticky; top:82px; display:flex; flex-direction:column; gap:3px}
@media(max-width:940px){
  .rail{position:static; flex-direction:row; overflow-x:auto; padding-bottom:6px; gap:8px}
  .rail .rail-h{display:none}
}
.rail-h{font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); padding:0 0 8px 2px}
.mod{display:grid; grid-template-columns:26px 1fr; gap:11px; align-items:start;
  padding:11px 12px; border:1px solid transparent; background:transparent; text-align:left;
  border-radius:var(--r); width:100%; min-height:var(--tap); transition:background .12s, border-color .12s}
@media(max-width:940px){ .mod{width:auto; min-width:190px; flex:0 0 auto; background:var(--sheet); border-color:var(--line)} }
.mod:hover{background:var(--sheet); border-color:var(--line)}
.mod[aria-current="true"]{background:var(--sheet-2); border-color:var(--line-2); box-shadow:var(--shadow)}
.mod .n{font-family:var(--font-mono); font-size:12px; color:var(--ink-3); padding-top:2px}
.mod[aria-current="true"] .n{color:var(--accent)}
.mod > span:last-child{display:block; min-width:0}
.mod .t{display:block; font-size:14px; line-height:1.3; font-weight:600; overflow-wrap:anywhere}
.mod .m{display:block; margin-top:3px; font-family:var(--font-mono); font-size:11px;
  color:var(--ink-3); font-variant-numeric:tabular-nums}
.mod .pb{height:3px; background:var(--sunk); margin-top:6px; position:relative}
.mod .pb i{position:absolute; left:0; top:0; bottom:0; background:var(--ok)}
.mod.exam .t{color:var(--mark)}

/* лист */
.sheet{background:var(--sheet); border:1px solid var(--line); box-shadow:var(--shadow);
  border-radius:var(--r); position:relative}
.sheet::after{content:""; position:absolute; top:-1px; right:-1px; width:16px; height:16px;
  border-top:1px solid var(--line-2); border-right:1px solid var(--line-2)}
.sheet-head{padding:22px 26px 0}
.sheet-head h2{font-size:clamp(22px,3vw,30px); margin-bottom:6px}
.sheet-head .lead{color:var(--ink-2); font-size:15px; max-width:64ch}

/* дело: штамп, кодовое имя, эмблема, завязка */
.sheet{--case:var(--case-l); --case-soft:color-mix(in srgb, var(--case) 13%, var(--sheet))}
@media (prefers-color-scheme: dark){ .sheet{--case:var(--case-d)} }
:root[data-theme="dark"] .sheet{--case:var(--case-d)}
:root[data-theme="light"] .sheet{--case:var(--case-l)}
.mod{--case:var(--case-l)}
@media (prefers-color-scheme: dark){ .mod{--case:var(--case-d)} }
:root[data-theme="dark"] .mod{--case:var(--case-d)}
:root[data-theme="light"] .mod{--case:var(--case-l)}
.sheet{border-top:3px solid var(--case)}
.casebar{display:flex; align-items:center; gap:12px; margin-bottom:12px}
.stamp{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--stamp); border:1.5px solid var(--stamp); border-radius:2px; padding:4px 9px;
  transform:rotate(-1.5deg); opacity:.9}
.codename{font-family:var(--font-display); font-variation-settings:"wght" 600,"wdth" 87.5;
  font-size:15px; color:var(--case)}
svg.emb{margin-left:auto; flex:0 0 auto; fill:none; stroke:var(--case); stroke-width:1.5;
  stroke-linecap:round; stroke-linejoin:round; opacity:.9}
.hook{font-size:15.5px; line-height:1.55; color:var(--ink-2); max-width:62ch; margin-bottom:10px;
  padding-left:14px; border-left:2px solid var(--case)}
.mod[aria-current="true"] .n{color:var(--case)}
.mod[aria-current="true"]{border-left:2px solid var(--case)}
.mod .pb i{background:var(--case)}

/* доска улик: красная нить между фигурами */
.canvas{background:var(--sunk); border-color:var(--line-2)}
.canvas .arrow{background:var(--thread)}
.canvas .arrow::after{border-left-color:var(--thread)}
.canvas .node.slot{border-color:var(--case); background:var(--case-soft)}
.canvas .node.slot .knd{color:var(--case)}
.node .knd{color:var(--case)}
.fig .arrow{background:var(--thread)}
.fig .arrow::after{border-left-color:var(--thread)}
.tabs{display:flex; gap:0; margin-top:var(--s4); border-bottom:1px solid var(--line);
  overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none; border:none; border-bottom:2px solid transparent; padding:12px 2px 11px;
  margin-right:24px; white-space:nowrap; min-height:44px;
  font-family:var(--font-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--case)}
.tab:hover{color:var(--ink)}
.body{padding:var(--s5) 26px var(--s6)}
@media(max-width:560px){ .sheet-head{padding:18px 16px 0} .body{padding:var(--s4) 16px var(--s5)} }

/* ============================================================
   ТЕОРИЯ
   ============================================================ */
/* лекция и рассказ преподавателя */
.lecthead{border-bottom:2px solid var(--case); padding-bottom:var(--s3); margin-bottom:var(--s2)}
.lecthead p{color:var(--ink-2); font-size:var(--t-md); line-height:1.6; margin-top:7px; max-width:66ch}
.lect p{max-width:68ch}
/* правила нотации: можно / нельзя */
ul.rules{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:0;
  border-top:1px solid var(--line); max-width:74ch}
ul.rules li{display:flex; gap:12px; align-items:flex-start;
  padding:11px 0; border-bottom:1px solid var(--line); color:var(--ink-2);
  font-size:var(--t-md); line-height:1.55}
ul.rules li > span{flex:1; min-width:0}
ul.rules li::before{display:grid; place-items:center; width:20px; height:20px; border-radius:50%;
  font-size:12px; font-family:var(--font-body); margin-top:1px; flex:0 0 20px}
ul.rules li.yes::before{content:"✓"; background:var(--ok-soft); color:var(--ok); border:1px solid var(--ok)}
ul.rules li.no::before{content:"✕"; background:var(--no-soft); color:var(--no); border:1px solid var(--no)}
ul.rules li b{color:var(--ink); font-weight:600}

/* мини-кейс с раскрываемым разбором */
.kase{border:1px solid var(--line); border-left:3px solid var(--thread); background:var(--sheet-2);
  border-radius:var(--r); padding:16px 18px 18px; display:flex; flex-direction:column; gap:10px;
  max-width:72ch}
.kase .eyebrow{color:var(--thread)}
.kase-s{font-size:var(--t-md); line-height:1.6; color:var(--ink-2)}
.kase-q{font-size:var(--t-md); line-height:1.6; color:var(--ink)}
.kase .btn{align-self:flex-start}
.kase-ans{font-size:var(--t-md); line-height:1.65; color:var(--ink-2); border-top:1px solid var(--line);
  padding-top:12px; animation:in .2s ease-out}
.kase-ans b{color:var(--ink)}
.kase.deep{max-width:76ch; gap:12px}
.kase-lbl{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); margin-top:4px}
.kase-facts{display:grid; grid-template-columns:minmax(150px,auto) 1fr; gap:0 18px; margin:0;
  border-top:1px solid var(--line)}
.kase-facts dt{font-size:var(--t-sm); font-weight:600; color:var(--ink); padding:8px 0;
  border-bottom:1px solid var(--line)}
.kase-facts dd{margin:0; font-size:var(--t-sm); line-height:1.55; color:var(--ink-2); padding:8px 0;
  border-bottom:1px solid var(--line)}
@media(max-width:600px){ .kase-facts{grid-template-columns:1fr} .kase-facts dt{border:none; padding-bottom:0} }
.kase-step{display:grid; grid-template-columns:30px 1fr; gap:14px; align-items:start; margin-bottom:18px}
.kase-num{display:grid; place-items:center; width:26px; height:26px; border-radius:50%;
  border:1.5px solid var(--thread); color:var(--thread); font-family:var(--font-mono); font-size:12px;
  margin-top:1px}
.kase-sh{font-family:var(--font-display); font-variation-settings:"wght" 700,"wdth" 92;
  font-size:16px; color:var(--ink); margin-bottom:5px}
.kase-step p{margin-bottom:8px}
.kase-res{margin:8px 0 14px}
.kase-res .fig,.kase-res .tblwrap{margin-top:8px}

.qa{border-left:2px solid var(--case); padding:2px 0 2px 16px; display:flex; flex-direction:column; gap:5px}
.qa b{font-size:var(--t-md); font-weight:600; color:var(--ink)}
.qa span{font-size:var(--t-md); line-height:1.6; color:var(--ink-2)}
.sayhead{font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--case); margin-top:var(--s3)}
blockquote.say{margin:0; padding:14px 18px; background:var(--sheet-2); border:1px solid var(--line);
  border-left:3px solid var(--case); border-radius:var(--r); font-size:var(--t-md); line-height:1.65;
  color:var(--ink); max-width:70ch}
blockquote.say em{color:var(--ink-3); font-style:normal; font-size:var(--t-sm)}
blockquote.say b{font-weight:600}
.board{border:1.5px dashed var(--case); border-radius:var(--r); padding:12px 14px 14px;
  background:var(--sunk); max-width:74ch}
.boardcap{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--case); margin-bottom:10px}
.board .fig{border:none; background:transparent; padding:0}
.board .erdfig{border:none; background:transparent; padding:0}
.board .figcap{margin-bottom:10px}
.board .theory{gap:var(--s3)}

/* обстоятельства дела и развязка */
.plot{border:1px solid var(--line); background:var(--sunk); border-left:3px solid var(--thread);
  padding:15px 18px 17px; margin-bottom:22px; max-width:74ch; border-radius:var(--r)}
.plot p{font-size:15.5px; line-height:1.6; color:var(--ink-2); margin-top:7px}
.solved{border:1px solid var(--ok); background:var(--ok-soft); border-left:3px solid var(--ok);
  padding:15px 18px 17px; margin:20px 0 24px; max-width:60ch; border-radius:var(--r);
  animation:in .25s ease-out}
.solved .eyebrow{color:var(--ok)}
.solved p{font-size:15.5px; line-height:1.6; color:var(--ink-2); margin-top:7px}
.solved.locked{border-color:var(--line); background:var(--sunk); border-left-color:var(--line-2)}
.solved.locked .eyebrow{color:var(--ink-3)}

.purpose{border:1px solid var(--line); border-top:3px solid var(--mark); background:var(--sheet-2);
  padding:16px 20px 18px; margin-bottom:26px; max-width:74ch; border-radius:var(--r)}
.purpose .plead{font-family:var(--font-display); font-variation-settings:"wght" 700,"wdth" 87.5;
  font-size:18px; line-height:1.3; margin:6px 0 14px; text-wrap:balance}
.pgrid{display:grid; grid-template-columns:minmax(110px,auto) 1fr; gap:2px 18px; margin:0}
.pgrid dt{font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--mark); padding:7px 0 7px; border-top:1px solid var(--line)}
.pgrid dd{margin:0; padding:7px 0; color:var(--ink-2); font-size:14.5px; border-top:1px solid var(--line)}
@media(max-width:560px){ .pgrid{grid-template-columns:1fr; gap:0} .pgrid dd{border-top:none; padding-top:0} }
.theory{display:flex; flex-direction:column; gap:var(--s4); max-width:70ch}
.theory h3{font-size:var(--t-xl); margin-top:var(--s3); padding-top:var(--s3);
  border-top:1px solid var(--line); display:flex; align-items:baseline; gap:10px}
.theory h3:first-child{border-top:none; padding-top:0; margin-top:0}
.theory h3::before{content:""; width:18px; height:3px; background:var(--case); flex:0 0 auto;
  transform:translateY(-5px)}
.theory p{color:var(--ink-2); font-size:var(--t-md); line-height:1.65}
.theory strong{color:var(--ink); font-weight:600}
.theory ul{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px; color:var(--ink-2)}
.theory li::marker{color:var(--accent)}
.dl{display:grid; grid-template-columns:minmax(120px,auto) 1fr; gap:2px 18px; border-top:1px solid var(--line)}
.dl dt{font-weight:600; padding:9px 0 9px; border-bottom:1px solid var(--line)}
.dl dd{margin:0; padding:9px 0; color:var(--ink-2); border-bottom:1px solid var(--line)}
@media(max-width:560px){ .dl{grid-template-columns:1fr; gap:0} .dl dt{border:none; padding-bottom:0} }
pre.code{background:var(--sunk); border:1px solid var(--line); border-left:2px solid var(--accent);
  padding:14px 16px; overflow-x:auto; font-family:var(--font-mono); font-size:13px; line-height:1.65;
  color:var(--ink); margin:0}
.note{border-left:2px solid var(--mark); background:var(--mark-soft); padding:12px 16px; color:var(--ink-2); font-size:15px}
.note b{color:var(--ink)}
.tblwrap{overflow-x:auto; border:1px solid var(--line)}
table{border-collapse:collapse; width:100%; font-size:14px; min-width:440px}
th{text-align:left; font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; padding:10px 14px; background:var(--sunk); border-bottom:1px solid var(--line)}
td{padding:10px 14px; border-bottom:1px solid var(--line); color:var(--ink-2); vertical-align:top}
tr:last-child td{border-bottom:none}
td:first-child{color:var(--ink); font-weight:600; white-space:nowrap}
.glyph{font-family:var(--font-mono); font-size:15px; color:var(--accent)}

/* ============================================================
   ПРАКТИКА
   ============================================================ */
.runner{max-width:78ch}
.run-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:var(--s4);
  padding-bottom:var(--s3); border-bottom:1px solid var(--line)}
.chip{font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; border:1px solid var(--line-2);
  padding:4px 9px; color:var(--ink-2); border-radius:20px}
.chip.kind{border-color:var(--case); color:var(--case)}
.dots{display:flex; gap:4px; margin-left:auto; flex-wrap:wrap; max-width:60%; justify-content:flex-end}
.dots i{width:10px; height:10px; border:1.5px solid var(--line-2); display:block; border-radius:50%;
  transition:transform .15s, background .15s}
.dots i.ok{background:var(--ok); border-color:var(--ok)}
.dots i.no{background:var(--no); border-color:var(--no)}
.dots i.now{border-color:var(--case); background:var(--case-soft); transform:scale(1.45)}
.q{font-family:var(--font-display); font-variation-settings:"wght" 700,"wdth" 92;
  font-size:clamp(19px,2.4vw,23px); line-height:1.3; margin-bottom:var(--s1); text-wrap:balance}
.qsub{color:var(--ink-3); font-size:var(--t-sm); margin-bottom:var(--s3)}
.opts{display:flex; flex-direction:column; gap:var(--s2); margin-bottom:var(--s4)}
.opt{display:flex; gap:14px; align-items:flex-start; padding:14px 16px; min-height:var(--tap);
  border:1px solid var(--line); background:var(--sheet-2); border-radius:var(--r); cursor:pointer;
  transition:border-color .12s, background .12s, transform .12s; font-size:var(--t-md); line-height:1.45}
.opt:hover{border-color:var(--case); transform:translateX(2px)}
.opt input{margin:3px 0 0; accent-color:var(--case); flex:0 0 auto; width:19px; height:19px}
.opt .txt{flex:1}
.opt.sel{border-color:var(--case); background:var(--case-soft); box-shadow:inset 3px 0 0 var(--case)}
.opt.good{border-color:var(--ok); background:var(--ok-soft)}
.opt.bad{border-color:var(--no); background:var(--no-soft)}
.opt.locked{cursor:default}
.opt .tag{font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; margin-left:auto; white-space:nowrap}
.opt.good .tag{color:var(--ok)} .opt.bad .tag{color:var(--no)}

.rows{display:flex; flex-direction:column; gap:8px; margin-bottom:20px}
.row{display:flex; gap:12px; align-items:center; padding:10px 14px; border:1px solid var(--line);
  background:var(--sheet-2); border-radius:var(--r)}
.row .txt{flex:1}
.row select{font:inherit; font-size:14px; padding:6px 8px; background:var(--sheet); color:var(--ink);
  border:1px solid var(--line-2); border-radius:2px; max-width:52%}
.row.good{border-color:var(--ok); background:var(--ok-soft)}
.row.bad{border-color:var(--no); background:var(--no-soft)}
.row .idx{font-family:var(--font-mono); font-size:12px; color:var(--ink-3); width:20px; text-align:right}
.row .mv{display:flex; gap:4px}
.mvb{width:28px; height:28px; border:1px solid var(--line-2); background:var(--sheet); border-radius:2px;
  line-height:1; font-size:13px; display:grid; place-items:center}
.mvb:hover{border-color:var(--ink-2)}
.mvb:disabled{opacity:.3; cursor:default}
.fixhint{font-family:var(--font-mono); font-size:12px; color:var(--no)}

input.fill{font:inherit; font-family:var(--font-mono); font-size:15px; padding:11px 13px; width:100%;
  max-width:380px; background:var(--sheet-2); color:var(--ink); border:1px solid var(--line-2);
  border-radius:var(--r); margin-bottom:20px; display:block}
input.fill.good{border-color:var(--ok); background:var(--ok-soft)}
input.fill.bad{border-color:var(--no); background:var(--no-soft)}

.fb{border:1px solid var(--line); border-left-width:3px; padding:16px 18px; margin-bottom:var(--s4);
  background:var(--sheet-2); border-radius:var(--r); animation:in .2s ease-out}
.fb.good{border-color:var(--ok); background:var(--ok-soft)}
.fb.bad{border-color:var(--no); background:var(--no-soft)}
.fb .v{font-family:var(--font-display); font-variation-settings:"wght" 700,"wdth" 92;
  font-size:16px; letter-spacing:.02em; margin-bottom:var(--s1); display:flex; align-items:center; gap:9px}
.fb .v::before{display:grid; place-items:center; width:22px; height:22px; border-radius:50%;
  font-size:13px; font-family:var(--font-body); flex:0 0 auto}
.fb.good .v{color:var(--ok)} .fb.bad .v{color:var(--no)}
.fb.good .v::before{content:"✓"; background:var(--ok); color:var(--ok-soft)}
.fb.bad .v::before{content:"✕"; background:var(--no); color:var(--no-soft)}
.fb .why{font-size:var(--t-md); line-height:1.6; color:var(--ink-2)}
.fb .why b{color:var(--ink)}
@keyframes in{from{opacity:0; transform:translateY(-4px)} to{opacity:1; transform:none}}
@media(prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }

.actions{display:flex; gap:var(--s2); align-items:center; flex-wrap:wrap}
/* липкая панель действия: основная кнопка всегда под рукой */
.runner > .actions{position:sticky; bottom:0; z-index:5; margin-top:var(--s2);
  padding:var(--s3) 0 var(--s2);
  background:linear-gradient(to bottom, transparent, var(--sheet) 42%)}
.btn{background:var(--case); color:var(--sheet); border:1px solid var(--case);
  padding:12px 24px; min-height:46px; font-family:var(--font-display);
  font-variation-settings:"wght" 600,"wdth" 92; font-size:15.5px;
  letter-spacing:.02em; border-radius:var(--r); transition:filter .12s, transform .1s}
.btn:active{transform:translateY(1px)}
@media (prefers-color-scheme: dark){ .btn{color:#0E1114} }
:root[data-theme="dark"] .btn{color:#0E1114}
:root[data-theme="light"] .btn{color:#F7F8F4}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:transparent; color:var(--ink); border-color:var(--line-2)}
.btn.sec:hover{border-color:var(--ink-2); background:var(--sheet-2); filter:none}
.hintmsg{font-size:13px; color:var(--no); font-family:var(--font-mono)}

/* итог */
.result{text-align:left; max-width:60ch}
.score{font-family:var(--font-display); font-variation-settings:"wght" 700,"wdth" 75;
  font-size:clamp(52px,10vw,86px); line-height:1; color:var(--accent); font-variant-numeric:tabular-nums}
.score span{font-size:.42em; color:var(--ink-3)}
.verdict{font-size:17px; color:var(--ink-2); margin:12px 0 22px; max-width:52ch}
.misslist{display:flex; flex-direction:column; gap:0; border-top:1px solid var(--line); margin:0 0 24px}
.miss{padding:10px 0; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline}
.miss .id{font-family:var(--font-mono); font-size:11px; color:var(--no); flex:0 0 auto}
.miss .qq{font-size:14px; color:var(--ink-2)}

/* ============================================================
   ВИЗУАЛЬНЫЙ СЛОЙ: ЛЕГЕНДЫ, ПРИМЕРЫ СХЕМ, ВИДЖЕТЫ
   ============================================================ */
.gal{display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:8px; margin:0}
.gi{display:flex; flex-direction:column; align-items:center; gap:7px; padding:13px 8px 11px;
  border:1px solid var(--line); background:var(--sheet-2); border-radius:var(--r); text-align:center;
  transition:border-color .12s, transform .12s}
.gi:hover{border-color:var(--case); transform:translateY(-1px)}
.gi[aria-expanded="true"]{border-color:var(--case); background:var(--case-soft)}
.gi .nm{font-size:12px; line-height:1.25; color:var(--ink-2)}
.gi[aria-expanded="true"] .nm{color:var(--ink); font-weight:600}
.galnote{grid-column:1/-1; border-left:2px solid var(--case); background:var(--case-soft);
  padding:11px 14px; font-size:14px; color:var(--ink-2); animation:in .16s ease-out}
.galnote b{color:var(--ink)}

.fig{border:1px solid var(--line); background:var(--sunk); padding:16px 14px 12px; border-radius:var(--r);
  overflow-x:auto}
.fig .figcap{font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); margin-bottom:12px}
.figrow{display:flex; align-items:stretch; gap:4px; min-width:min-content}
.fignode{width:108px; flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:5px;
  padding:8px 6px; background:var(--sheet-2); border:1px solid var(--line); border-radius:var(--r)}
.fignode .fc{font-size:11px; line-height:1.25; text-align:center; color:var(--ink-2)}
.fignode.bad-node{border-color:var(--no); background:var(--no-soft); animation:land .4s ease-out}
.fignode.bad-node .fc{color:var(--no)}
.fignode .fc.mark{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--no); font-weight:700}
.fignode.shakeit{border-color:var(--no); animation:shake .32s}
.fignode.act{cursor:pointer; transition:border-color .12s, opacity .15s, transform .12s}
.fignode.act:hover{border-color:var(--case); transform:translateY(-2px)}
.fignode.dim{opacity:.35}
.fignode.hl{border-color:var(--case); background:var(--case-soft); animation:land .35s ease-out}

/* график динамики по делам */
.chart{display:flex; align-items:flex-end; gap:5px; height:140px; padding:8px 0 0;
  border-bottom:1px solid var(--line); margin-bottom:var(--s3); overflow-x:auto}
.bar-col{--case:var(--case-l); flex:1 0 22px; display:flex; flex-direction:column; align-items:center;
  gap:6px; background:none; border:none; height:100%; padding:0; min-width:22px}
@media (prefers-color-scheme: dark){ .bar-col{--case:var(--case-d)} }
:root[data-theme="dark"] .bar-col{--case:var(--case-d)}
:root[data-theme="light"] .bar-col{--case:var(--case-l)}
.bar-v{flex:1; width:100%; display:flex; align-items:flex-end; background:var(--sunk);
  border-radius:3px 3px 0 0; overflow:hidden}
.bar-v i{display:block; width:100%; background:var(--case); border-radius:3px 3px 0 0;
  transition:height .5s cubic-bezier(.4,0,.2,1)}
.bar-col.full .bar-v i{background:var(--ok)}
.bar-col:hover .bar-v{background:var(--case-soft)}
.bar-n{font-family:var(--font-mono); font-size:9.5px; color:var(--ink-3)}
.bar-col:hover .bar-n{color:var(--case)}
.fignode.ok{border-color:var(--ok); background:var(--ok-soft); animation:land .42s ease-out}
.fignode.ok .fc{color:var(--ok); font-weight:600}
.fignode.slotmini{border-style:dashed; border-color:var(--case); background:transparent; justify-content:center}
.fignode .qm{font-family:var(--font-display); font-size:26px; color:var(--case); line-height:1}
/* ERD-диаграмма */
.erdfig{padding-bottom:var(--s3)}
.erdscroll{overflow-x:auto; padding:2px 0 6px}
svg.erdsvg{display:block; max-width:100%; height:auto; min-width:520px}
.e-box{fill:var(--sheet-2); stroke:var(--line-2); stroke-width:1.4}
.e-fill{fill:var(--case-soft); stroke:none}
.e-hd{stroke:var(--line-2); stroke-width:1.4}
.e-name{fill:var(--ink); font-family:var(--font-display);
  font-variation-settings:"wght" 700,"wdth" 92; font-size:14px}
.e-f{fill:var(--ink-2); font-family:var(--font-mono); font-size:11.5px}
.e-f.pk{fill:var(--ink); font-weight:700}
.e-f.fk{fill:var(--case)}
.e-key{fill:var(--ink-3); font-family:var(--font-mono); font-size:9px; letter-spacing:.08em}
.e-th{stroke:var(--thread); stroke-width:1.8; fill:none}
.e-ln{stroke:var(--thread); stroke-width:1.8; fill:none}
.e-card{fill:var(--ink-2); font-family:var(--font-mono); font-size:11px}
.e-tab,.e-link{cursor:pointer; transition:opacity .15s}
.e-tab:hover .e-box{stroke:var(--case)}
.e-link:hover .e-th,.e-link:hover .e-ln{stroke:var(--case)}
.e-tab.on .e-box{stroke:var(--case); stroke-width:2.4}
.e-link.on .e-th,.e-link.on .e-ln{stroke:var(--case); stroke-width:2.6}
.e-link.on .e-card{fill:var(--case); font-weight:700}
.e-tab.dim,.e-link.dim{opacity:.28}
/* схема архитектуры */
.s-box{fill:var(--sheet-2); stroke:var(--ink-2); stroke-width:1.5}
.s-tab1{fill:var(--sheet-2); stroke:var(--ink-2); stroke-width:1.3}
.s-n{fill:var(--ink); font-family:var(--font-display);
  font-variation-settings:"wght" 700,"wdth" 92; font-size:13.5px}
.s-st{fill:var(--case); font-family:var(--font-mono); font-size:10px}
.s-line{stroke:var(--ink-2); stroke-width:1.6; fill:none}
.s-line.dash{stroke-dasharray:5 4}
.s-head{stroke:var(--ink-2); stroke-width:1.6; fill:none}
.s-lbl{fill:var(--ink-3); font-family:var(--font-mono); font-size:10.5px}
.s-pkgbox{fill:none; stroke:var(--line-2); stroke-width:1.3; stroke-dasharray:6 4}
.s-pkgtab{stroke:var(--line-2); stroke-width:1.3; fill:none}
.s-pkgn{fill:var(--ink-3); font-family:var(--font-mono); font-size:10px; letter-spacing:.06em}
.s-node,.s-link{cursor:pointer; transition:opacity .15s}
.s-node:hover .s-box{stroke:var(--case)}
.s-node.on .s-box{stroke:var(--case); stroke-width:2.6}
.s-node.on .s-tab1{stroke:var(--case)}
.s-link:hover .s-line,.s-link:hover .s-head{stroke:var(--case)}
.s-link.on .s-line,.s-link.on .s-head{stroke:var(--case); stroke-width:2.4}
.s-link.on .s-lbl{fill:var(--case); font-weight:700}
.s-node.dim,.s-link.dim{opacity:.26}

/* матрёшка уровней */
svg.layers .ly rect{fill:none; stroke:var(--line-2); stroke-width:1.5; cursor:pointer;
  transition:stroke .15s, fill .15s}
svg.layers .ly:hover rect{stroke:var(--case)}
svg.layers .ly.on rect{stroke:var(--case); stroke-width:2.6; fill:var(--case-soft)}
svg.layers .ly-n{fill:var(--ink-3); font-family:var(--font-mono); font-size:10.5px}
svg.layers .ly.on .ly-n{fill:var(--case)}
svg.layers .ly-c{fill:var(--ink); font-family:var(--font-mono); font-size:11.5px}

/* ключ преподавателя */
.tkey{border:1px dashed var(--mark); background:var(--mark-soft); border-radius:var(--r);
  padding:11px 14px; margin-bottom:var(--s4)}
.key-head{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.key-head .eyebrow{color:var(--mark)}
.key-btn{margin-left:auto; background:transparent; border:1px solid var(--mark); color:var(--mark);
  font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; padding:5px 11px;
  border-radius:20px; min-height:30px}
.key-btn:hover{background:var(--mark); color:var(--paper)}
.key-body{margin-top:11px; padding-top:11px; border-top:1px solid var(--line);
  animation:in .18s ease-out}
.key-ans{font-size:var(--t-md); line-height:1.7; color:var(--ink-2)}
.key-ans b{color:var(--ink); font-weight:600}
.key-ans u{text-decoration:none; font-family:var(--font-mono); font-size:11px;
  letter-spacing:.06em; color:var(--ink-3); text-transform:uppercase}
.key-ans .alt{color:var(--ink-3); font-size:var(--t-sm)}
.key-why{margin-top:10px; font-size:var(--t-sm); line-height:1.6; color:var(--ink-2)}

/* схема на плоскости */
.d-box{fill:var(--sheet-2); stroke:var(--line-2); stroke-width:1.4}
.d-cap{fill:var(--ink-2); font-family:var(--font-body); font-size:10.5px}
.d-line{stroke:var(--thread); stroke-width:1.7; fill:none}
.d-line.dash{stroke-dasharray:5 4}
.d-head{stroke:var(--thread); stroke-width:1.7; fill:none}
.d-lbl{fill:var(--ink-3); font-family:var(--font-mono); font-size:10.5px}
.d-node.act{cursor:pointer}
.d-node.act:hover .d-box{stroke:var(--case)}
.d-node.on .d-box{stroke:var(--case); stroke-width:2.4; fill:var(--case-soft)}
.d-node.on .d-cap{fill:var(--ink); font-weight:600}
.d-node.dim{opacity:.3}
svg.diag .g *{stroke:var(--ink); fill:none; stroke-width:1.7}
svg.diag .g .fill{fill:var(--ink); stroke:none}
svg.diag .g .thick{stroke-width:3.4}
.d-node.on .g *{stroke:var(--case)}
.d-node.on .g .fill{fill:var(--case)}

/* легенда таблиц под ERD-схемой */
.erdleg{margin-top:var(--s4); border-top:1px solid var(--line); padding-top:var(--s3)}
.erdleg .eyebrow{margin-bottom:9px}
.erdleg-rows{display:flex; flex-direction:column; gap:0}
.erdleg-row{display:grid; grid-template-columns:132px minmax(0,1fr) auto; gap:14px; align-items:baseline;
  padding:9px 8px; background:none; border:none; border-bottom:1px solid var(--line);
  text-align:left; border-radius:var(--r); transition:background .12s}
.erdleg-row:last-child{border-bottom:none}
.erdleg-row:hover{background:var(--sunk)}
.erdleg-row.on{background:var(--case-soft); box-shadow:inset 3px 0 0 var(--case)}
.lg-n{font-family:var(--font-mono); font-size:13px; font-weight:700; color:var(--ink)}
.erdleg-row.on .lg-n{color:var(--case)}
.lg-a{font-size:var(--t-sm); line-height:1.5; color:var(--ink-2)}
.lg-f{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-3); white-space:nowrap}
@media(max-width:640px){
  .erdleg-row{grid-template-columns:1fr auto; gap:4px 10px}
  .lg-a{grid-column:1/-1}
}

.erdnote{margin-top:var(--s3); font-size:var(--t-sm); line-height:1.6; color:var(--ink-2);
  border-left:2px solid var(--case); padding-left:13px; min-height:38px}
.erdnote b{color:var(--ink)}

.scene{margin-bottom:20px}
.sceneno{margin-top:12px; font-size:13.5px; color:var(--ink-2); border-left:2px solid var(--no);
  padding-left:12px}
.sceneno b{color:var(--ink)}

.wdg{border:1px solid var(--line); border-top:3px solid var(--case); background:var(--sheet-2);
  border-radius:var(--r); padding:16px 18px 18px}
.wdg h4{font-size:15px; margin-bottom:4px}
.wdg .whint{font-size:13px; color:var(--ink-3); margin-bottom:14px}
.ctrls{display:flex; flex-wrap:wrap; gap:16px; margin-bottom:16px}
.ctrl{display:flex; flex-direction:column; gap:6px}
.ctrl .cl{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-3)}
.seg{display:flex; border:1px solid var(--line-2); border-radius:var(--r); overflow:hidden}
.seg button{background:var(--sheet); border:none; padding:6px 13px; font-family:var(--font-mono);
  font-size:13px; color:var(--ink-2); border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:none}
.seg.wrapseg{flex-wrap:wrap; border:none; gap:6px; border-radius:0}
.seg.wrapseg button{border:1px solid var(--line-2); border-radius:20px; font-size:12.5px; padding:7px 14px}
.seg button[aria-pressed="true"]{background:var(--case); color:var(--sheet)}
:root[data-theme="dark"] .seg button[aria-pressed="true"], .seg button[aria-pressed="true"]{color:var(--paper)}
.wout{border-top:1px solid var(--line); padding-top:14px; display:flex; flex-direction:column; gap:10px}
.wread{font-size:15px; line-height:1.5}
.wread b{color:var(--case)}
.wcode{font-family:var(--font-mono); font-size:12.5px; background:var(--sunk); border:1px solid var(--line);
  padding:9px 12px; border-radius:2px; color:var(--ink-2); white-space:pre-wrap}
svg.link{display:block; max-width:100%; height:auto}
svg.link .ln{stroke:var(--ink-2); stroke-width:1.6; fill:none}
svg.link .th{stroke:var(--thread); stroke-width:2; fill:none}
svg.link .bx{fill:var(--sheet-2); stroke:var(--ink-2); stroke-width:1.4}
svg.link text{fill:var(--ink); font-family:var(--font-mono); font-size:12px}
svg.link text.lbl{fill:var(--case); font-size:13px}
svg.link text.sm{fill:var(--ink-3); font-size:10.5px}

/* класс-бокс */
.cbox{border:1.5px solid var(--ink-2); background:var(--sheet-2); max-width:420px; font-family:var(--font-mono);
  font-size:13px; border-radius:2px; overflow:hidden}
.cbox .zone{padding:9px 12px; border-bottom:1px solid var(--line); cursor:pointer; transition:background .12s}
.cbox .zone:last-child{border-bottom:none}
.cbox .zone:hover{background:var(--sunk)}
.cbox .zone[aria-pressed="true"]{background:var(--case-soft); box-shadow:inset 3px 0 0 var(--case)}
.cbox .cn{text-align:center; font-weight:700; font-size:14px}
.cbox .ln{display:block; line-height:1.65}
.vis{color:var(--case); font-weight:700}

/* доска статусов */
.stat{display:flex; flex-wrap:wrap; gap:8px}
.stbtn{border:1px solid var(--line-2); background:var(--sheet); padding:8px 14px; border-radius:20px;
  font-size:13.5px}
.stbtn[aria-pressed="true"]{border-color:var(--case); background:var(--case-soft); color:var(--ink); font-weight:600}
.trans{display:flex; flex-direction:column; gap:6px}
.tr{display:flex; gap:10px; align-items:baseline; font-size:14px; padding:7px 0; border-bottom:1px solid var(--line)}
.tr .ev{font-family:var(--font-mono); font-size:12px; color:var(--ink-2); min-width:120px}
.tr .to{font-weight:600}
.tr.no .to{color:var(--no); font-weight:400}
.tr.yes .to{color:var(--ok)}

/* ============================================================
   КОНСТРУКТОР BPMN
   ============================================================ */
.case{border:1px solid var(--line); border-left:3px solid var(--mark); background:var(--sheet-2);
  padding:14px 16px; margin-bottom:18px}
.case .eyebrow{margin-bottom:6px}
.case p{color:var(--ink-2); font-size:15px}
.canvas{border:1px dashed var(--line-2); background:var(--sunk); padding:14px;
  display:flex; flex-wrap:wrap; align-items:stretch; gap:4px; margin-bottom:18px; min-height:104px}
.node{width:124px; display:flex; flex-direction:column; align-items:center; gap:5px; padding:9px 7px;
  background:var(--sheet-2); border:1px solid var(--line); border-radius:var(--r); animation:pop .18s ease-out}
@keyframes pop{from{opacity:0; transform:scale(.94)} to{opacity:1; transform:none}}
.node .cap{font-size:11.5px; line-height:1.28; text-align:center; color:var(--ink-2)}
.node .knd{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--accent); text-align:center}
.node.slot{border-style:dashed; border-color:var(--accent); background:var(--accent-soft);
  justify-content:center; animation:none}
.node.slot .cap{color:var(--ink); font-weight:600}
.node.slot.ghost{opacity:.62; border-style:dashed}
.node.slot.ghost svg.g *{stroke:var(--case)}
.node.slot.err{border-color:var(--no); background:var(--no-soft); animation:shake .34s}
.node.landed{animation:land .42s ease-out}
@keyframes land{
  0%{transform:scale(.86); border-color:var(--ok); box-shadow:0 0 0 4px var(--ok-soft)}
  55%{border-color:var(--ok); box-shadow:0 0 0 6px transparent}
  100%{transform:none; box-shadow:none}}
.arrow{align-self:center; width:22px; height:2px; background:var(--ink-3); position:relative; flex:0 0 auto}
.arrow::after{content:""; position:absolute; right:-1px; top:-3px; border:4px solid transparent;
  border-left-color:var(--ink-3); border-right:none}
.canvas .empty{color:var(--ink-3); font-size:14px; align-self:center; font-family:var(--font-mono)}
svg.g{display:block}
svg.g *{stroke:var(--ink); fill:none; stroke-width:1.7; vector-effect:non-scaling-stroke}
svg.g .fill{fill:var(--ink); stroke:none}
svg.g .thick{stroke-width:3.4}
svg.g text{fill:var(--ink); stroke:none; font-family:var(--font-mono); font-size:11px}
.ask{font-size:15px; margin-bottom:12px}
.ask b{font-weight:600}
.pal{display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:7px; margin-bottom:16px}
.pi{display:flex; align-items:center; gap:9px; padding:7px 9px; border:1px solid var(--line);
  background:var(--sheet-2); border-radius:var(--r); text-align:left; font-size:12.5px; line-height:1.25}
.pi:hover{border-color:var(--accent); background:var(--accent-soft)}
.pi.bad{border-color:var(--no); background:var(--no-soft); animation:shake .32s}
.pi.off{opacity:.42; pointer-events:none}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.tip{border-left:2px solid var(--mark); background:var(--mark-soft); padding:11px 14px; font-size:14px;
  color:var(--ink-2); margin-bottom:16px; animation:in .18s ease-out}
.tip b{color:var(--ink)}
.stepline{display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-bottom:10px}
.stepline .n{font-family:var(--font-mono); font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums}

/* песочница ERD */
.erd{display:grid; grid-template-columns:minmax(0,1fr) minmax(240px,300px); gap:20px; align-items:start}
@media(max-width:820px){ .erd{grid-template-columns:1fr} }
.erd-code{background:var(--sunk); border:1px solid var(--line); border-left:2px solid var(--accent);
  padding:12px 14px; font-family:var(--font-mono); font-size:12px; line-height:1.6; overflow-x:auto;
  position:sticky; top:88px; white-space:pre; color:var(--ink)}
.erd-code .ph{color:var(--ink-3)}
.erd-code .rf{color:var(--accent)}
.qa{display:flex; flex-direction:column; gap:7px; margin-bottom:16px}
.qa label{font-size:14px; color:var(--ink-2)}
.qa select{font:inherit; font-size:14px; padding:9px 10px; background:var(--sheet-2); color:var(--ink);
  border:1px solid var(--line-2); border-radius:var(--r); width:100%; max-width:460px}
.qa select.good{border-color:var(--ok); background:var(--ok-soft)}
.qa select.bad{border-color:var(--no); background:var(--no-soft)}
.pairhead{font-family:var(--font-display); font-variation-settings:"wght" 700,"wdth" 87.5;
  font-size:17px; margin-bottom:4px}
.pairhead em{font-style:normal; color:var(--accent)}
</style>

<script>
/* ============================================================
   ДАННЫЕ КУРСА
   ============================================================ */
const T = {
  h:(v)=>({t:'h',v}), p:(v)=>({t:'p',v}), ul:(v)=>({t:'ul',v}),
  dl:(v)=>({t:'dl',v}), code:(v)=>({t:'code',v}), note:(v)=>({t:'note',v}),
  table:(head,rows)=>({t:'table',head,rows}),
  erdfig:(v)=>({t:'erdfig',v}),                 /* интерактивная ERD-диаграмма */
  sysfig:(v)=>({t:'sysfig',v}),                 /* интерактивная схема архитектуры */
  diag:(v)=>({t:'diag',v}),                     /* схема на плоскости с ветвлениями */
  gal:(v)=>({t:'gal',v}),                       /* легенда фигур: [ключ, подпись, пояснение] */
  fig:(cap,v,arrows)=>({t:'fig',cap,v,arrows}), /* отрисованный пример схемы */
  wdg:(v)=>({t:'wdg',v}),                       /* интерактивный виджет */
  kase:(title,situation,question,answer)=>({t:'kase',title,situation,question,answer}),
  deep:(title,spec)=>({t:'kase',title,spec}),   /* развёрнутый разбор дела */
  rules:(v)=>({t:'rules',v})   /* [true|false, текст правила] — можно / нельзя */
};

const MODULES = [];

/* ---------- 1. ERD ---------- */
MODULES.push({
  id:'erd', title:'ERD: сущности и связи',
  lead:'Диаграмма «сущность-связь» описывает, из каких объектов состоят данные, какие у них признаки и как объекты связаны между собой.',
  theory:[
    T.h('Зачем нужна ERD'),
    T.p('ERD (Entity Relationship Diagram) — схема структуры базы данных. Аналитик рисует её, чтобы договориться с разработчиком: какие таблицы завести, какие поля в них хранить и как таблицы ссылаются друг на друга. По ERD видно, где данные дублируются, а где их не хватает.'),

    T.h('Сущность'),
    T.p('<strong>Сущность</strong> — объект, о котором можно хранить данные. Это физический объект (автомобиль, человек), концепт (адрес) или событие (регистрация студента на курс).'),
    T.dl([
      ['Сильная сущность','Имеет собственный идентификатор (первичный ключ) и существует сама по себе, независимо от других. Пример: студент, товар, пользователь.'],
      ['Слабая сущность','Не может существовать без сильной и содержит внешний ключ на неё. Пример: регистрация студента на курс — без студента и курса записи не существует.']
    ]),
    T.note('Простая проверка: если удалить «родителя» и запись потеряет смысл — сущность слабая.'),

    T.h('Атрибуты'),
    T.p('<strong>Атрибут</strong> — характеристика сущности. На схеме атрибуты изображают овалами или строками внутри прямоугольника-таблицы.'),
    T.dl([
      ['Простой','Нельзя разделить на части: имя, номер телефона.'],
      ['Составной','Делится на несколько: полное имя = фамилия + имя + отчество; адрес = город + улица + дом.'],
      ['Вычисляемый','Получается из других данных: возраст — из даты рождения, сумма заказа — из позиций.']
    ]),

    T.h('Как это выглядит целиком'),
    T.p('Вот собранная схема интернет-магазина. Нажмите на таблицу или на связь — покажу, как она читается и почему внешний ключ стоит именно там.'),
    T.erdfig({cap:'Схема данных интернет-магазина', w:820, h:330,
      tables:[
        {id:'cl', n:'Client', x:6, y:20, about:'Сильная сущность: существует сама по себе, идентифицируется собственным ключом.',
         f:['id int [pk]','name varchar','email varchar','phone varchar']},
        {id:'or', n:'Order', x:300, y:20, about:'Сильная сущность, но зависит от клиента: внешний ключ client_id обязателен.',
         f:['id int [pk]','client_id int [fk]','created_at timestamp','status varchar']},
        {id:'it', n:'OrderItem', x:300, y:190, about:'Связующая сущность между заказом и товаром. Здесь живут атрибуты самой связи: количество и цена на момент покупки.',
         f:['id int [pk]','order_id int [fk]','product_id int [fk]','qty int','price decimal']},
        {id:'pr', n:'Product', x:600, y:190, about:'Справочник товаров. Один товар встречается во множестве заказов.',
         f:['id int [pk]','title varchar','price decimal']}
      ],
      links:[
        {a:'cl', b:'or', ca:'1', cb:'0..*', why:'У нового клиента заказов может не быть вовсе, поэтому со стороны заказов стоит ноль. Ключ client_id лежит в Order — на стороне «многих».'},
        {a:'or', b:'it', ca:'1', cb:'1..*', side:'down', why:'Заказ без единой позиции не имеет смысла, поэтому минимум здесь единица, а не ноль.'},
        {a:'it', b:'pr', ca:'0..*', cb:'1', why:'Каждая позиция ссылается ровно на один товар, а один товар может встречаться в любом числе позиций.'}
      ]}),
    T.kase('Пропавшая история заказов',
      'Разработчик предложил упростить схему: убрать таблицу OrderItem, а вместо неё положить в Order поле product_id. «Один заказ — один товар, зачем усложнять».',
      'Что сломается и как это объяснить разработчику?',
      '<b>Сломается сразу три вещи.</b> Первое: заказ из двух товаров станет невозможен, а бизнес такого ограничения не ставил. Второе: исчезнет место для количества — его некуда положить, потому что оно принадлежит паре «заказ + товар», а не заказу целиком. Третье, самое дорогое: исчезнет цена на момент покупки, и любое изменение прайса перепишет историю всех прошлых заказов.<br><br>' +
      '<b>Как объяснить:</b> задать один вопрос — «где будет храниться количество этого товара в этом заказе?». Ответа в предложенной схеме нет, и это закрывает обсуждение без спора о вкусах.'),
    T.note('Связь «Order — Product» на схеме напрямую не нарисована, и это не ошибка. Она разложена на две связи через <b>OrderItem</b>: именно так реализуется «многие ко многим», когда у связи есть собственные данные.'),

    T.h('Что означает каждая строка в таблице'),
    T.p('Разберём таблицу <strong>Order</strong> со схемы выше построчно. Каждая строка устроена одинаково: <strong>имя поля — тип данных — пометки в скобках</strong>.'),
    T.code('Table Order {\n  id         int        [pk]   ← имя  тип  пометка\n  client_id  int        [ref: > Client.id]\n  created_at timestamp\n  status     varchar\n}'),
    T.dl([
      ['id int [pk]','<strong>id</strong> — имя поля. <strong>int</strong> — целое число. <strong>[pk]</strong> — primary key, первичный ключ: по нему запись отличают от всех остальных. Обычно база сама выдаёт следующий номер: 1, 2, 3. Такое поле есть почти в каждой таблице.'],
      ['client_id int','Внешний ключ: ссылка на строку в другой таблице. Хранит не имя клиента, а его <strong>id</strong> — то самое число. Именно поэтому имя поля собирается по образцу «имя_таблицы_id». Если клиент сменит фамилию, здесь ничего менять не нужно: число не изменилось.'],
      ['created_at timestamp','Дата и время создания заказа. <strong>timestamp</strong> — специальный тип для момента времени, а не строка. Разница принципиальна: по timestamp можно отсортировать, отфильтровать «за последнюю неделю» и вычесть одну дату из другой. По строке — нет.'],
      ['status varchar','Текущий статус заказа. <strong>varchar</strong> — строка переменной длины. Здесь это компромисс: правильнее было бы использовать перечисление, чтобы база сама не пускала значение «оплочен» с опечаткой.']
    ]),

    T.h('Типы данных: что писать рядом с полем'),
    T.p('Тип отвечает на вопрос «какие значения тут вообще возможны». Его выбирает не разработчик из головы, а вы — из смысла поля. Вот те, которых хватает в 95% задач.'),
    T.table(['Тип','Что хранит','Когда брать','Пример значения'],[
      ['int','Целое число','Идентификаторы, количество, номер по порядку','42'],
      ['bigint','Очень большое целое','Идентификаторы там, где записей миллионы','9 223 372 036 854'],
      ['decimal','Число с точной дробной частью','<strong>Деньги.</strong> Всегда только этот тип','1499.90'],
      ['float','Число с приблизительной дробной частью','Измерения: вес, температура, координаты','36.6'],
      ['varchar(n)','Строка ограниченной длины','Имена, адреса, названия, коды','«Иван Петров»'],
      ['text','Длинный текст без ограничения','Комментарии, описания, письма','«Прошу перенести занятие…»'],
      ['boolean','Да или нет','Флаги: подтверждён, активен, удалён','true'],
      ['date','Только дата','День рождения, дата договора','2026-08-02'],
      ['timestamp','Дата и время','Момент события: создан, оплачен, отгружен','2026-08-02 14:31:07'],
      ['enum','Значение из закрытого списка','Статусы, типы, категории с фиксированным перечнем','NEW / PAID / SHIPPED'],
      ['uuid','Глобально уникальный идентификатор','Когда id генерируется вне базы или должен быть непредсказуем','f47ac10b-58cc-…']
    ]),
    T.note('<b>Четыре ошибки, которые встречаются чаще всего.</b><br>' +
      '<b>Деньги во float.</b> Приблизительный тип даёт 0,1 + 0,2 = 0,30000000000000004. На тысяче заказов копейки разъезжаются, и отчёт не сходится с бухгалтерией. Деньги — только <b>decimal</b>.<br>' +
      '<b>Телефон в int.</b> Число съест ведущий ноль и не примет «+», скобки и дефис. Телефон, ИНН, номер счёта, индекс — это <b>varchar</b>, даже если состоят из цифр.<br>' +
      '<b>Дата строкой.</b> «02.08.2026» отсортируется как текст: 01 января окажется раньше 02 августа только по случайности, а «вчера» вычислить будет нечем. Дата — <b>date</b> или <b>timestamp</b>.<br>' +
      '<b>Статус свободной строкой.</b> Рано или поздно в базе окажутся «PAID», «paid» и «Оплачен» одновременно. Перечень значений фиксируется через <b>enum</b> или отдельный справочник.'),

    T.h('Три уровня модели данных'),
    T.p('Схема выше не появляется сразу такой. Аналитик проходит три уровня, и на каждом отвечает на свой вопрос. Переключите уровни и посмотрите, что добавляется на каждом шаге.'),
    T.wdg('datalevels'),
    T.p('Практический вывод: не пытайтесь на первой встрече обсуждать типы полей и индексы. Сначала договоритесь о составе сущностей, потом о полях и связях, и только потом отдавайте это в реализацию. Попытка начать с физического уровня заканчивается спорами о varchar там, где ещё не решено, нужна ли вообще таблица.'),

    T.h('Виды связей'),
    T.table(['Связь','Смысл','Пример'],[
      ['Один к одному (1:1)','Одной записи соответствует ровно одна запись','Пользователь — паспорт'],
      ['Один ко многим (1:N)','Одна запись связана с несколькими','Клиент — его заказы'],
      ['Многие ко многим (N:M)','Много записей связаны со многими','Преподаватель — предмет']
    ]),
    T.p('Связь N:M напрямую в базе не реализуется: создаётся <strong>промежуточная (связующая) таблица</strong> с двумя внешними ключами — например, «Преподаватель_Предмет» с полями «Код преподавателя (FK)» и «Код предмета (FK)».'),

    T.h('Историчность: «а каким был адрес полгода назад?»'),
    T.p('Вопрос, на котором сыпется большинство моделей. Обычная таблица хранит только <strong>текущее</strong> значение: обновили адрес — прежний исчез навсегда. Пока никто не спрашивает про прошлое, всё выглядит нормально. Спрашивают всегда.'),
    T.table(['Приём','Что решает','Когда применять','Чем платим'],[
      ['Мягкое удаление','Запись не исчезает: помечается deleted_at','Всегда, если на запись ссылаются другие таблицы','Все запросы должны фильтровать удалённые. Забыли — увидели «призраков»'],
      ['Отметки времени','created_at и updated_at в каждой таблице','Практически всегда, это дёшево','Отвечает только на «когда меняли», но не «на что»'],
      ['Таблица аудита','Отдельная таблица с историей всех изменений полей','Когда важно кто и что менял: деньги, доступы, статусы','Растёт быстро, нужен план архивации'],
      ['Версионирование строк','Каждая версия — отдельная строка с valid_from и valid_to','Когда нужно «значение на дату»: цены, тарифы, курсы','Все запросы усложняются условием по датам'],
      ['Фиксация на момент операции','Значение копируется в документ и больше не меняется','Цена в заказе, ставка в договоре, тариф в начислении','Осознанное дублирование — обязательно записать в требования']
    ]),

    T.h('Три способа хранить историю адреса'),

   ['<strong>Контекст.</strong> Вся ваша система — один прямоугольник. Вокруг пользователи и внешние системы. Аудитория: заказчик, новый человек в проекте.',
    '<strong>Контейнеры.</strong> Система распадается на приложения и хранилища: веб, мобильное, API, база, очередь. Аудитория: команда, архитектор.',

   'Смешение уровней — самая частая причина нечитаемых схем. Если на одном листе оказались пользователь, класс и адрес сервера, схему нужно не улучшать, а разрезать.'],

  ['Диалекты: почему одна и та же нотация выглядит по-разному',

   '<strong>DFD: Йордон-Де Марко против Гейна-Сарсона.</strong> Самое существенное расхождение, потому что различаются не только фигуры, но и состав элементов.',
   T.table(['','Йордон-Де Марко','Гейн-Сарсон'],[

     ['Хранилище','Две горизонтальные линии','Прямоугольник, открытый справа, с секцией для кода'],
     ['Управляющий поток','Есть, рисуется пунктиром','Понятия не существует вовсе'],

     ['dfd-func','Йордон-Де Марко','Функция — круг. Здесь же возможен управляющий поток пунктиром: «запустить пересчёт».'],
     ['dfd-func-g','Гейн-Сарсон','Функция — прямоугольник с полосой под номер. Управляющих потоков в этом диалекте нет вовсе.']

   'Практическое следствие: если в системе есть команды «запустить», «остановить», «пересчитать» — берите Йордон-Де Марко, иначе эти сигналы негде показать. Если нужна декомпозиция на три уровня с нумерацией — удобнее Гейн-Сарсон.',

   '<strong>ERD: три диалекта, и путают их чаще всего.</strong>',

     ['Сущность','Прямоугольник','Прямоугольник с полями внутри','Прямоугольник, у зависимых углы скруглены'],

   'В повседневной работе почти всегда используется <strong>воронья лапка</strong>: именно её рисуют dbdiagram.io и инструменты для баз данных, и именно её вы видели в деле про ERD. Нотация Чена с овалами-атрибутами наглядна для обучения, но становится нечитаемой уже на пяти сущностях. IDEF1X встречается там, где есть требование соответствовать стандарту.',

   '<strong>UML: расхождения не в фигурах, а в стиле.</strong> Стандарт один, но команды по-разному решают, что подписывать. Одни ставят кратности у всех связей, другие — только у неочевидных. Одни указывают типы параметров в методах, другие ограничиваются именами. Формально верны оба варианта, и здесь важна не правильность, а единообразие внутри проекта.',

SCRIPT.notations=[

LECTURE.erd=[
  ['Зачем модель данных, если можно просто «добавить поле»',

   'ERD решает три задачи сразу. Во-первых, договориться о составе данных до того, как их начнут писать в базу. Во-вторых, зафиксировать связи так, чтобы разработчик не додумывал. В-третьих, увидеть дублирование заранее — на схеме это заметно, а в готовой базе обнаруживается через полгода и стоит миграции.'],

  ['Как отличить сущность от атрибута: три вопроса',

   ['<strong>Сколько фактов мы храним об этом объекте?</strong> Один — это атрибут. Несколько — кандидат в сущности. «Год издания» — один факт о книге, значит поле. «Автор» с именем, биографией и списком книг — уже сущность.',
    '<strong>Существует ли объект самостоятельно?</strong> Если он теряет смысл без «родителя» — это слабая сущность или вовсе атрибут. Регистрация на курс без студента и курса не значит ничего.',
    '<strong>Выводится ли значение из других данных?</strong> Сумма заказа считается по позициям, возраст — из даты рождения. Такие значения обычно не хранят, а вычисляют. Хранят только тогда, когда нужно зафиксировать историю: цена на момент покупки — это уже не копия прайса, а отдельный факт.'],
   '!Обратное правило тоже работает. Если «атрибут» начал обрастать собственными полями — адрес превратился в город, улицу, индекс и координаты — он созрел до отдельной сущности.'],

  ['Разбор: как из абзаца требований получается схема',

   'Шаг первый — существительные: клиент, заказ, товар, количество, цена, сумма. Шаг второй — отсев: количество и цена относятся к паре «заказ + товар», сумма вычисляется. Остаются клиент, заказ, товар и — внимание — позиция заказа, которой в тексте нет ни разу, но без неё некуда положить количество и цену.',
   'Именно поэтому связующие таблицы так часто забывают: в требованиях они не названы. Их обнаруживают, задав вопрос «а где будет храниться вот это свойство связи».',
   '?Можно ли обойтись без позиции заказа?|Только если у связи нет собственных данных. Как только появляется количество, цена, дата или статус — связующая таблица обязательна.'],

  ['Ключи: чем first name отличается от идентификатора',

   'Проверка простая: если два «статуса» могут быть истинными одновременно и меняться независимо — это признаки. <em>(разберите с группой пример «оплачен» и «отгружен»)</em>',
   'Обратите внимание, ответ зависит от бизнеса. Если отгружать можно только после оплаты — это цепочка статусов. Если постоянному клиенту отгружают до оплаты — это два независимых флага. Один и тот же вопрос, разные ответы в разных компаниях. Поэтому его надо задавать, а не додумывать.',
   'И объясните цену ошибки: если сделать признаки статусами, получите комбинаторный взрыв. Оплачен и отгружен, оплачен и не отгружен, не оплачен и отгружен. Каждый новый флаг удваивает модель.'],
  ['Как подписывают переход',
   'Полная форма: событие, в квадратных скобках условие, через косую черту действие. <em>(пишете на доске: отменить [прошло меньше 2 часов] / вернуть деньги)</em>',
   'Разберём по частям. Событие — что произошло. Условие — при каком условии переход вообще разрешён; именно здесь живут бизнес-правила. Действие — что система делает в момент перехода.',
   'Смотрите, что случилось: расплывчатое «заказ можно отменить» превратилось в проверяемое требование. Видно условие, видно побочный эффект. Разработчику больше нечего додумывать.'],
  ['Таблица переходов',
   'Диаграмма хороша для обсуждения. Для передачи в работу удобнее таблица: строки — статусы, столбцы — события, в клетке — новый статус или «запрещено». <em>(рисуете таблицу для заказа)</em>',
   'Почему таблица лучше? На диаграмме запрет — это отсутствие стрелки. Отсутствие легко не заметить. В таблице каждая клетка заполнена явно.',
   'И главное для тестировщика: каждая клетка «запрещено» — это готовый негативный тест-кейс. Вы фактически пишете тест-план, сами того не замечая.'],
  ['Три дефекта, которые ловит модель',
   'Тупик — статус без выхода, который не является конечным. Значит, кто-то не задал вопрос «а что дальше».',
   'Статусы-омонимы — одно слово с разными последствиями. Отменён клиентом с возвратом денег и отменён по таймауту без списания. Либо два статуса, либо один плюс атрибут «причина».',
   'Недостижимый статус — описан, но в него не ведёт ни один переход. Обычно остаток от предыдущей версии процесса, который забыли убрать.'],
  ['Переход к практике',
   'Домашнее задание сформулирую прямо сейчас: возьмите главный объект своего проекта и составьте таблицу переходов. Гарантирую: вы найдёте минимум два незаданных вопроса.',
   'В практике будет виджет со статусной моделью заказа — потыкайте, посмотрите, как запреты превращаются в тест-кейсы.']
];

LECTURE.classes=[
  ['Откуда берутся классы: три источника',
   'Начинающие часто думают, что классы придумывает разработчик. На самом деле они вытаскиваются из текста требований, и делает это аналитик — либо сознательно, либо случайно и плохо.',
   ['<strong>Существительные из требований.</strong> Подчеркните все существительные предметной области — это кандидаты. Глаголы дадут методы.',
    '<strong>Сущности из модели данных.</strong> Каждая таблица почти всегда даёт класс-сущность, только с добавленным поведением.',

  ['Boundary, Control, Entity: готовая раскладка',
   'Эта тройка отвечает на вопрос «какие вообще бывают классы» и одновременно задаёт правила их взаимодействия.',
   ['<strong>Boundary</strong> — всё, чем система соприкасается с внешним миром: экраны, формы, REST-контроллеры, клиенты чужих API.',

  ['Методы: не «что умеет класс», а «за что он отвечает»',

   'Признак неверного размещения виден в коде: длинная цепочка вида order.getClient().getCard().getBalance(). Метод лезет за данными через три чужих объекта — значит, он написан не там.'],

  ['Отношения между классами и тест на композицию',
   'Шесть типов связей покрывают почти всё: ассоциация («знает о»), агрегация и композиция («часть-целое»), обобщение («является»), реализация («выполняет контракт интерфейса»), зависимость («временно пользуется»).',
   'Единственный по-настоящему трудный выбор — между агрегацией и композицией, и он решается одним вопросом: удалим целое, что станет с частью? Игроки переживут расформирование команды — агрегация. Позиции заказа без заказа бессмысленны — композиция.',
   'Практическая ценность этого различия огромна: оно превращается в требование о каскадном удалении, которое разработчик обязан реализовать явно.',
   '?Зачем аналитику знать про наследование, если это дело разработчика?|Затем, что обобщение приходит из предметной области. «Физическое и юридическое лицо — виды клиента» — это ваше наблюдение, а не техническое решение. Разработчик лишь выберет способ реализации.'],

  ['Три антипаттерна, которые видно на схеме',
   'Класс-бог: один класс на сорок методов, который считает, печатает, шлёт письма и ходит в базу. Признак — имя вида Manager, Helper, Processor.',
   'Анемичная модель: класс только с полями и геттерами, без единого правила. Тогда правила расползаются по сервисам и начинают противоречить друг другу.',
   'Класс равно таблица: попытка сделать по классу на каждую таблицу и наоборот. У Boundary и Control таблиц нет вовсе, а у класса есть поведение, которого нет у таблицы.']
];

SCRIPT.classes=[
  ['Вступление: с чего начать',

LECTURE.components=[
  ['Что такое компонент и чем он отличается от всего остального',
   'Компонент — самостоятельная заменяемая часть системы с собственной зоной ответственности и спрятанной реализацией. Ключевое слово — заменяемая: если сервис можно переписать с нуля на другом языке и остальная система не заметит, границы проведены правильно.',
   'Различие с соседними понятиями держится на единице измерения. Класс — единица кода. Модуль или пакет — единица организации кода, папка. Компонент — единица сборки, выката и замены. Сервис — компонент, у которого контракт доступен по сети.'],

  ['Порт и пакет: два инструмента наведения порядка',

  ['Что схема даёт в работе',

let store = load();
function load(){
  try{ const r=JSON.parse(localStorage.getItem(KEY)); if(r && r.res) return r; }catch(e){}
  return {res:{}};
}

const allTasks = ()=> MODULES.flatMap(m=>m.tasks);
const examPool = ()=> allTasks().filter(t=>t.type!=='build' && t.type!=='erd');
const poolOf = m => m.exam ? shuffle(examPool()).slice(0,m.size) : m.tasks;
const sizeOf = m => m.exam ? m.size : m.tasks.length;
const mastered = id => store.res[id]===true;

function el(tag, props, ...kids){
  const n=document.createElement(tag);
  if(props) for(const k in props){
    if(k==='class') n.className=props[k];
    else if(k==='html') n.innerHTML=props[k];
    else if(k.startsWith('on')) n.addEventListener(k.slice(2), props[k]);
    else if(props[k]!==null && props[k]!==false) n.setAttribute(k, props[k]);
  }
  kids.flat().forEach(c=>{ if(c==null||c===false) return;
    n.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return n;
}
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const plural = (n,one,few,many)=>{
  const a=Math.abs(n)%100, b=a%10;
  return n+' '+(a>10&&a<20 ? many : b===1 ? one : b>=2&&b<=4 ? few : many);
};
const norm = s => s.toLowerCase().trim().replace(/ё/g,'е').replace(/[«»"'.,;:()\[\]]/g,'').replace(/\s+/g,' ');

/* ---- интерактивная ERD-диаграмма ----
   spec: {cap, w, h, tables:[{id,n,x,y,f:[поля]}], links:[{a,b,ca,cb,side,why}]}
   ca/cb — кардинальность у конца: '1' | '0..1' | '0..*' | '1..*'                */
function erdFigNode(spec){
  const TW=186, HH=28, RH=19, PAD=7;
  const box={}; spec.tables.forEach(t=>{ box[t.id]={...t, w:TW, h:HH+t.f.length*RH+PAD}; });
  const foot=(x,y,dir,card)=>{
    const many=card.indexOf('*')>=0, zero=card.indexOf('0')===0, d=dir;
    let g='<path class="e-ln" d="M'+(x+d*13)+' '+(y-7)+' v14"/>';
    if(many) g+='<path class="e-ln" d="M'+x+' '+y+' l'+(d*13)+' -7 M'+x+' '+y+' l'+(d*13)+' 0 M'+x+' '+y+' l'+(d*13)+' 7"/>';
    if(zero) g+='<circle class="e-ln" cx="'+(x+d*21)+'" cy="'+y+'" r="4.5"/>';
    return g;
  };
  let svg='';
  /* связи рисуем первыми, чтобы таблицы легли поверх */
  spec.links.forEach((L,i)=>{
    const A=box[L.a], B=box[L.b];
    let path,fa,fb,lx,ly,lx2;
    if(L.side==='down'){
      const x=A.x+A.w/2, y1=A.y+A.h, y2=B.y;
      path='M'+x+' '+y1+' V'+y2;
      fa='<g transform="translate('+x+','+(y1+16)+') rotate(-90)">'+foot(0,0,-1,L.ca)+'</g>';
      fb='<g transform="translate('+x+','+(y2-16)+') rotate(90)">'+foot(0,0,-1,L.cb)+'</g>';
      lx=x+10; ly=y1+22; lx2=x+10;
    } else {
      const y=A.y+HH/2+10, x1=A.x+A.w, x2=B.x, mid=(x1+x2)/2;
      const y2=B.y+HH/2+10;
      path='M'+x1+' '+y+' H'+mid+' V'+y2+' H'+x2;
      fa=foot(x1,y,1,L.ca); fb=foot(x2,y2,-1,L.cb);
      lx=x1+26; ly=y-9; lx2=x2-26;
    }
    svg+='<g class="e-link" data-i="'+i+'">'+
      '<path class="e-th" d="'+path+'"/>'+fa+fb+
      '<text class="e-card" x="'+lx+'" y="'+ly+'">'+L.ca+'</text>'+
      '<text class="e-card" x="'+(L.side==='down'?lx2:lx2)+'" y="'+(L.side==='down'?box[L.b].y-22:box[L.b].y+HH/2+1)+'" text-anchor="'+(L.side==='down'?'start':'end')+'">'+L.cb+'</text></g>';
  });
  spec.tables.forEach(t=>{
    const b=box[t.id];
    svg+='<g class="e-tab" data-id="'+t.id+'">'+
      '<rect class="e-box" x="'+b.x+'" y="'+b.y+'" width="'+b.w+'" height="'+b.h+'" rx="5"/>'+
      '<path class="e-hd" d="M'+b.x+' '+(b.y+HH)+' h'+b.w+'"/>'+
      '<rect class="e-fill" x="'+b.x+'" y="'+b.y+'" width="'+b.w+'" height="'+HH+'" rx="5"/>'+
      '<text class="e-name" x="'+(b.x+11)+'" y="'+(b.y+19)+'">'+t.n+'</text>';
    t.f.forEach((f,k)=>{ const pk=/\[pk\]/.test(f), fk=/\[fk\]/.test(f);
      svg+='<text class="e-f'+(pk?' pk':'')+(fk?' fk':'')+'" x="'+(b.x+11)+'" y="'+(b.y+HH+15+k*RH)+'">'+
        f.replace(/\s*\[(pk|fk)\]/,'')+'</text>'+
        (pk||fk? '<text class="e-key" x="'+(b.x+b.w-11)+'" y="'+(b.y+HH+15+k*RH)+'" text-anchor="end">'+(pk?'PK':'FK')+'</text>':'');
    });
    svg+='</g>';
  });
  const host=el('div',{class:'fig erdfig'});
  host.appendChild(el('div',{class:'figcap'}, spec.cap||'Схема данных'));
  const wrap=el('div',{class:'erdscroll'});
  wrap.innerHTML='<svg class="erdsvg" viewBox="0 0 '+spec.w+' '+spec.h+'" width="'+spec.w+'" '+
    'role="img" aria-label="'+(spec.cap||'ERD')+'">'+svg+'</svg>';
  host.appendChild(wrap);
  const note=el('div',{class:'erdnote', html:'Нажмите на таблицу или на связь — покажу, как это читается.'});
  host.appendChild(note);
  /* постоянная легенда: что за таблицы вообще есть на схеме */
  const legend=el('div',{class:'erdleg'});
  legend.appendChild(el('div',{class:'eyebrow'},'Таблицы на схеме'));
  const legrows=el('div',{class:'erdleg-rows'});
  spec.tables.forEach(t=>{
    legrows.appendChild(el('button',{class:'erdleg-row','data-id':t.id, onclick:()=>selectTable(t.id)},
      el('span',{class:'lg-n'}, t.n),
      el('span',{class:'lg-a'}, t.about||''),
      el('span',{class:'lg-f'}, plural(t.f.length,'поле','поля','полей'))));
  });
  legend.appendChild(legrows);
  host.insertBefore(legend, note);

  let sel=null;
  const HINT='Нажмите на таблицу или на связь — покажу, как это читается.';
  const clear=()=>{ sel=null;
    wrap.querySelectorAll('.e-tab,.e-link').forEach(n=>n.classList.remove('on','dim'));
    legrows.querySelectorAll('.erdleg-row').forEach(n=>n.classList.remove('on')); };
  const selectTable=(id)=>{
    if(sel==='t:'+id){ clear(); note.innerHTML=HINT; return; }
    clear(); sel='t:'+id;
    wrap.querySelectorAll('.e-tab').forEach(n=>n.classList.add(n.dataset.id===id?'on':'dim'));
    legrows.querySelectorAll('.erdleg-row').forEach(n=>n.classList.toggle('on', n.dataset.id===id));
    const mine=spec.links.map((L,i)=>({L,i})).filter(x=>x.L.a===id||x.L.b===id);
    wrap.querySelectorAll('.e-link').forEach(n=>
      n.classList.add(mine.some(x=>x.i===+n.dataset.i)?'on':'dim'));
    const t=spec.tables.find(x=>x.id===id);
    note.innerHTML='<b>'+t.n+'.</b> '+(t.about||'')+(mine.length?
      '<br>Связи: '+mine.map(x=>{
        const other=x.L.a===id? box[x.L.b].n : box[x.L.a].n;
        const c=x.L.a===id? x.L.cb : x.L.ca;
        return 'одна запись «'+t.n+'» — <b>'+c+'</b> «'+other+'»';
      }).join('; ')+'.' : '');
  };
  wrap.querySelectorAll('.e-tab').forEach(g=>
    g.addEventListener('click',()=>selectTable(g.dataset.id)));
  wrap.querySelectorAll('.e-link').forEach(g=>{
    g.addEventListener('click',(e)=>{ e.stopPropagation();
      const L=spec.links[+g.dataset.i];
      if(sel==='l:'+g.dataset.i){ clear(); note.innerHTML=HINT; return; }
      clear(); sel='l:'+g.dataset.i; g.classList.add('on');
      wrap.querySelectorAll('.e-link').forEach(n=>{ if(n!==g) n.classList.add('dim'); });
      wrap.querySelectorAll('.e-tab').forEach(n=>
        n.classList.add(n.dataset.id===L.a||n.dataset.id===L.b?'on':'dim'));
      note.innerHTML='<b>'+box[L.a].n+' ↔ '+box[L.b].n+'.</b> Читается с двух сторон: одна запись «'+
        box[L.a].n+'» — <b>'+L.cb+'</b> «'+box[L.b].n+'»; одна запись «'+box[L.b].n+'» — <b>'+L.ca+
        '</b> «'+box[L.a].n+'». '+(L.why||'');
    });
  });
  return host;
}

/* ---- схема архитектуры: компоненты, пакеты, связи с протоколами ---- */
function sysFigNode(spec){
  const box={}; spec.nodes.forEach(n=>{ box[n.id]={w:150,h:56,...n}; });
  let svg='';
  (spec.packages||[]).forEach(p=>{
    svg+='<g class="s-pkg"><rect class="s-pkgbox" x="'+p.x+'" y="'+p.y+'" width="'+p.w+'" height="'+p.h+'" rx="6"/>'+
      '<path class="s-pkgtab" d="M'+p.x+' '+(p.y+14)+' v-14 h64 v14"/>'+
      '<text class="s-pkgn" x="'+(p.x+8)+'" y="'+(p.y+10)+'">'+p.n+'</text></g>';
  });
  spec.links.forEach((L,i)=>{
    const A=box[L.a], B=box[L.b];
    let path, lx, ly;
    if(L.side==='down'){
      const x=A.x+A.w/2;
      path='M'+x+' '+(A.y+A.h)+' V'+(B.y-9);
      svg+='<path class="s-head" d="M'+(x-5)+' '+(B.y-9)+' L'+x+' '+(B.y-1)+' L'+(x+5)+' '+(B.y-9)+'"/>';
      lx=x+9; ly=(A.y+A.h+B.y)/2;
    } else if(L.side==='left'){
      const y=A.y+A.h/2;
      path='M'+A.x+' '+y+' H'+(B.x+B.w+9);
      svg+='<path class="s-head" d="M'+(B.x+B.w+9)+' '+(y-5)+' L'+(B.x+B.w+1)+' '+y+' L'+(B.x+B.w+9)+' '+(y+5)+'"/>';
      lx=(A.x+B.x+B.w)/2; ly=y-9;
    } else {
      const y=A.y+A.h/2, y2=B.y+B.h/2, mid=(A.x+A.w+B.x)/2;
      path='M'+(A.x+A.w)+' '+y+' H'+mid+' V'+y2+' H'+(B.x-9);
      svg+='<path class="s-head" d="M'+(B.x-9)+' '+(y2-5)+' L'+(B.x-1)+' '+y2+' L'+(B.x-9)+' '+(y2+5)+'"/>';
      lx=mid+7; ly=(y+y2)/2-7;
    }
    svg+='<g class="s-link" data-i="'+i+'"><path class="s-line'+(L.dashed?' dash':'')+'" d="'+path+'"/>'+
      '<text class="s-lbl" x="'+lx+'" y="'+ly+'">'+(L.label||'')+'</text></g>';
  });
  spec.nodes.forEach(n=>{
    const b=box[n.id];
    svg+='<g class="s-node" data-id="'+n.id+'">'+
      '<rect class="s-box" x="'+b.x+'" y="'+b.y+'" width="'+b.w+'" height="'+b.h+'" rx="5"/>'+
      '<rect class="s-tab1" x="'+(b.x-7)+'" y="'+(b.y+12)+'" width="14" height="8"/>'+
      '<rect class="s-tab1" x="'+(b.x-7)+'" y="'+(b.y+30)+'" width="14" height="8"/>'+
      (n.st? '<text class="s-st" x="'+(b.x+b.w/2)+'" y="'+(b.y+19)+'" text-anchor="middle">«'+n.st+'»</text>':'')+
      '<text class="s-n" x="'+(b.x+b.w/2)+'" y="'+(b.y+(n.st?38:34))+'" text-anchor="middle">'+n.n+'</text></g>';
  });
  const host=el('div',{class:'fig erdfig'});
  host.appendChild(el('div',{class:'figcap'}, spec.cap||'Архитектура системы'));
  const wrap=el('div',{class:'erdscroll'});
  wrap.innerHTML='<svg class="erdsvg sysfig" viewBox="0 0 '+spec.w+' '+spec.h+'" width="'+spec.w+'">'+svg+'</svg>';
  host.appendChild(wrap);
  const HINT='Нажмите на компонент или на связь — расскажу, за что он отвечает и что по ней ходит.';
  const note=el('div',{class:'erdnote'}, HINT);
  host.appendChild(note);
  let sel=null;
  const clear=()=>{ sel=null; wrap.querySelectorAll('.s-node,.s-link').forEach(n=>n.classList.remove('on','dim')); };
  wrap.querySelectorAll('.s-node').forEach(g=>g.addEventListener('click',()=>{
    const id=g.dataset.id;
    if(sel==='n:'+id){ clear(); note.innerHTML=HINT; return; }
    clear(); sel='n:'+id;
    const mine=spec.links.map((L,i)=>({L,i})).filter(x=>x.L.a===id||x.L.b===id);
    wrap.querySelectorAll('.s-node').forEach(n=>n.classList.add(n.dataset.id===id?'on':'dim'));
    wrap.querySelectorAll('.s-link').forEach(n=>n.classList.add(mine.some(x=>x.i===+n.dataset.i)?'on':'dim'));
    const n=spec.nodes.find(x=>x.id===id);
    note.innerHTML='<b>'+n.n+'.</b> '+(n.about||'')+(mine.length?
      '<br>Связи: '+mine.map(x=>{
        const other=x.L.a===id? box[x.L.b].n : box[x.L.a].n;
        return (x.L.a===id?'→ ':'← ')+other+' ('+(x.L.label||'без подписи')+')';
      }).join('; ')+'.':'');
  }));
  wrap.querySelectorAll('.s-link').forEach(g=>g.addEventListener('click',e=>{
    e.stopPropagation();
    const L=spec.links[+g.dataset.i];
    if(sel==='l:'+g.dataset.i){ clear(); note.innerHTML=HINT; return; }
    clear(); sel='l:'+g.dataset.i; g.classList.add('on');
    wrap.querySelectorAll('.s-link').forEach(n=>{ if(n!==g) n.classList.add('dim'); });
    wrap.querySelectorAll('.s-node').forEach(n=>n.classList.add(n.dataset.id===L.a||n.dataset.id===L.b?'on':'dim'));
    note.innerHTML='<b>'+box[L.a].n+' → '+box[L.b].n+'</b> ('+(L.label||'без подписи')+'). '+(L.why||'');
  }));
  return host;
}

/* ---- полноценная схема на плоскости: фигуры в координатах + подписанные связи ---- */
function diagNode(spec){
  const NW=124, NH=78;
  const box={}; spec.nodes.forEach(n=>{ box[n.id]={w:NW,h:NH,...n}; });
  let svg='';
  spec.links.forEach((L,i)=>{
    const A=box[L.a], B=box[L.b];
    let path, lx, ly;
    const ax=A.x+A.w/2, ay=A.y+A.h/2, bx=B.x+B.w/2, by=B.y+B.h/2;
    if(L.side==='down'){
      path='M'+ax+' '+(A.y+A.h)+' V'+(B.y-9);
      svg+='<path class="d-head" d="M'+(ax-5)+' '+(B.y-9)+' L'+ax+' '+(B.y-1)+' L'+(ax+5)+' '+(B.y-9)+'"/>';
      lx=ax+8; ly=(A.y+A.h+B.y)/2;
    } else if(L.side==='elbow'){
      const mx=A.x+A.w+26;
      path='M'+(A.x+A.w)+' '+ay+' H'+mx+' V'+by+' H'+(B.x-9);
      svg+='<path class="d-head" d="M'+(B.x-9)+' '+(by-5)+' L'+(B.x-1)+' '+by+' L'+(B.x-9)+' '+(by+5)+'"/>';
      lx=mx+7; ly=(ay+by)/2-6;
    } else if(L.side==='join'){
      const mx=B.x-26;
      path='M'+(A.x+A.w)+' '+ay+' H'+mx+' V'+by+' H'+(B.x-9);
      svg+='<path class="d-head" d="M'+(B.x-9)+' '+(by-5)+' L'+(B.x-1)+' '+by+' L'+(B.x-9)+' '+(by+5)+'"/>';
      lx=A.x+A.w+8; ly=ay-8;
    } else {
      path='M'+(A.x+A.w)+' '+ay+' H'+(B.x-9);
      svg+='<path class="d-head" d="M'+(B.x-9)+' '+(ay-5)+' L'+(B.x-1)+' '+ay+' L'+(B.x-9)+' '+(ay+5)+'"/>';
      lx=(A.x+A.w+B.x)/2-((L.label||'').length*2.6); ly=ay-9;
    }
    svg+='<g class="d-link" data-i="'+i+'"><path class="d-line'+(L.dashed?' dash':'')+'" d="'+path+'"/>'+
      (L.label? '<text class="d-lbl" x="'+lx+'" y="'+ly+'">'+L.label+'</text>':'')+'</g>';
  });
  spec.nodes.forEach(n=>{
    const b=box[n.id];
    const words=(n.label||'').split(' ');
    let lines=[''];
    words.forEach(wd=>{ const t=(lines[lines.length-1]+' '+wd).trim();
      if(t.length>17) lines.push(wd); else lines[lines.length-1]=t; });
    lines=lines.slice(0,3);
    svg+='<g class="d-node'+(n.about?' act':'')+'" data-id="'+n.id+'">'+
      '<rect class="d-box" x="'+b.x+'" y="'+b.y+'" width="'+b.w+'" height="'+b.h+'" rx="6"/>'+
      '<g transform="translate('+(b.x+b.w/2-22)+','+(b.y+7)+')">'+
        '<svg class="g" viewBox="0 0 48 40" width="44" height="37">'+(GLYPH[n.k]||SVG.task)+'</svg></g>'+
      lines.map((ln,j)=>'<text class="d-cap" x="'+(b.x+b.w/2)+'" y="'+(b.y+56+j*11)+'" text-anchor="middle">'+ln+'</text>').join('')+
      '</g>';
  });
  const host=el('div',{class:'fig erdfig'});
  if(spec.cap) host.appendChild(el('div',{class:'figcap'}, spec.cap));
  const wrap=el('div',{class:'erdscroll'});
  wrap.innerHTML='<svg class="erdsvg diag" viewBox="0 0 '+spec.w+' '+spec.h+'" width="'+spec.w+'">'+svg+'</svg>';
  host.appendChild(wrap);
  const HINT='Нажмите на любую фигуру — объясню, почему здесь именно она.';
  const note=el('div',{class:'erdnote'}, HINT);
  host.appendChild(note);
  let sel=null;
  const clear=()=>{ sel=null; wrap.querySelectorAll('.d-node,.d-link').forEach(n=>n.classList.remove('on','dim')); };
  wrap.querySelectorAll('.d-node.act').forEach(g=>g.addEventListener('click',()=>{
    const id=g.dataset.id;
    if(sel===id){ clear(); note.innerHTML=HINT; return; }
    clear(); sel=id;
    wrap.querySelectorAll('.d-node').forEach(n=>n.classList.add(n.dataset.id===id?'on':'dim'));
    const n=spec.nodes.find(x=>x.id===id);
    note.innerHTML='<b>'+(EL[n.k]||n.label)+'.</b> '+n.about;
  }));
  return host;
}

  ];
  let cur=1;
  const box=el('div',{class:'wdg'});
  const pic=el('div',{}); const note=el('div',{class:'wread'}); const meta=el('div',{class:'pgrid'});
  const draw=()=>{
    const l=L[cur];
    pic.textContent='';
    pic.appendChild(el('pre',{class:'code'}, l.code));
    note.innerHTML='<b>'+l.k+' модель.</b> '+l.txt;
    meta.textContent='';
    [['Кому',l.who],['Отвечает на вопрос',l.q],['Когда делается',l.when]].forEach(([k,v])=>{
      meta.appendChild(el('dt',{},k)); meta.appendChild(el('dd',{},v)); });
    box.querySelectorAll('.seg button').forEach((b,i)=>b.setAttribute('aria-pressed', i===cur?'true':'false'));

  const seg=el('div',{class:'seg'}, L.map((l,i)=>el('button',{onclick:()=>{cur=i;draw();}}, l.k)));
